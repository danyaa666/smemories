# Weekly dependency updates, one grouped pull request per ecosystem, against develop
# (the integration branch). Runs from the default branch's copy of this file.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]
  # Exact-pinned tool projects (Playwright, print checks) would otherwise never get update pull requests.
  - package-ecosystem: npm
    directory: /tools/e2e
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      e2e-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tools/print-check
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      print-check-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  # The Dockerfile pins both base images by digest; this keeps the tag and digest current (new Go patch, new distroless build).
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
  # T-029: the pinned MySQL, Valkey and SeaweedFS images of docker-compose.yml. ci.yml and scripts/image-smoke.sh repeat the digests; follow by hand.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
