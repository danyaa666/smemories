# Continuous integration. On pull requests and pushes this runs go, web and security; go-integration (MySQL, Valkey,
# SeaweedFS S3), e2e and image are paused (D-37, D-38) and run by hand only (gh workflow run ci.yml --ref <branch>).
# Pushes that only touch docs or board files start no run (D-38, paths-ignore below). Details and the required-check
# names for branch protection: docs/ci.md.
# No repository secrets are used anywhere in this file; keep it that way (public repo, and
# pull requests from forks must be able to run it).
name: ci

on:
  pull_request:
  push:
    branches: [develop, main]
    # D-38 (T-137): a push that changes only these paths starts no run. Never add this to pull_request: a path filter there
    # leaves the required checks pending and blocks doc-only PRs.
    paths-ignore:
      - ".team/**"
      - "docs/**"
      - "**/*.md"
      - "CLAUDE.md"
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# A newer push to the same pull request supersedes its run in progress. Pushes to develop and main
# get one group per commit, so every merge commit gets a complete run (a shared group would also drop
# a queued run when a third push arrives).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go.mod pins the language floor (go 1.26.0); build with the newest 1.26.x so the
      # standard library carries the latest security fixes (govulncheck below checks it).
      - id: gover
        run: echo "minor=$(awk '$1=="go"{split($2,v,".");print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.gover.outputs.minor }}
          check-latest: true
          cache: true # module and build cache, keyed on go.sum
      - uses: ./.github/actions/go-newest-patch
        with:
          minor: ${{ steps.gover.outputs.minor }}
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: Class privacy review lists every class endpoint (T-131)
        run: scripts/check-class-matrix.sh
      - run: go vet ./...
      - run: go vet -tags integration ./...
      # .golangci.yml enables errcheck, govet, staticcheck, ineffassign, unused, gosec, bodyclose
      # and analyses the integration-tagged files too. Keep the version in step with README.md.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.8.0
          # The released v2.8.0 binary is built with Go 1.25 and refuses a go 1.26 module; building
          # it with the job's Go avoids that. Drop this once a release built with Go 1.26 is pinned.
          install-mode: goinstall
      - name: Unit tests with the race detector
        run: go test -race -coverprofile=coverage.txt ./...
      - name: Coverage in the job summary
        run: |
          {
            echo "### Go coverage"
            echo "Total statement coverage: **$(go tool cover -func=coverage.txt | awk '/^total:/{print $3}')**"
          } >> "$GITHUB_STEP_SUMMARY"

  go-integration:
    # D-37 (T-132): paused on push and pull request, runs by hand only (gh workflow run ci.yml --ref <branch>); delete this `if:` to switch it back on.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    # T-077: above `make test-integration`'s -timeout 30m plus the service start-up, so a hang ends in Go's goroutine dump, not in a cancelled job.
    timeout-minutes: 40
    env:
      # Throwaway MySQL on the runner, reachable only from the runner. Obviously fake, not a secret.
      SMEM_TEST_DB_DSN: root:ci-only-fake-root-pw@tcp(127.0.0.1:3306)/smemories
      # Throwaway S3 store on the runner (SeaweedFS, same image and digest as docker-compose.yml, T-029). Fake credentials; the
      # storage tests create the bucket themselves.
      SMEM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SMEM_TEST_S3_ACCESS_KEY: ci-only-s3
      SMEM_TEST_S3_SECRET_KEY: ci-only-fake-s3-pw
      SMEM_TEST_S3_BUCKET: smemories-ci
      # Throwaway Valkey on the runner (same pinned image as docker-compose.yml, T-051). No password, loopback only.
      SMEM_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gover
        run: echo "minor=$(awk '$1=="go"{split($2,v,".");print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.gover.outputs.minor }}
          check-latest: true
          cache: true
      - uses: ./.github/actions/go-newest-patch
        with:
          minor: ${{ steps.gover.outputs.minor }}
      # A `services:` container cannot take server arguments, so this starts MySQL 8.4 with
      # the same flags as docker-compose.yml (utf8mb4, strict sql_mode, UTC).
      - name: Start MySQL 8.4 (utf8mb4)
        run: |
          docker run -d --name mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=ci-only-fake-root-pw -e MYSQL_DATABASE=smemories \
            mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci \
            --sql-mode=ONLY_FULL_GROUP_BY,STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION \
            --default-time-zone=+00:00
          # TCP, not the socket: the image's temporary init server only listens on the socket.
          for i in $(seq 1 60); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -pci-only-fake-root-pw --silent && exit 0
            sleep 2
          done
          docker logs mysql
          exit 1
      - name: Check the server character set
        run: docker exec mysql mysql -uroot -pci-only-fake-root-pw -N -e "SELECT @@character_set_server, @@collation_server" | grep -qx $'utf8mb4\tutf8mb4_0900_ai_ci'
      - name: Start the S3 store (SeaweedFS)
        run: |
          docker run -d --name s3 -p 127.0.0.1:9000:8333 \
            -e AWS_ACCESS_KEY_ID=ci-only-s3 -e AWS_SECRET_ACCESS_KEY=ci-only-fake-s3-pw \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            mini -dir=/data -ip.bind=0.0.0.0 -master.telemetry=false -s3.port=8333
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/status && exit 0
            sleep 2
          done
          docker logs s3
          exit 1
      # Same image and flags as docker-compose.yml (the digest is the one pinned there; keep them in step). A
      # `services:` container cannot take server arguments, so this is a docker run like the other two.
      - name: Start Valkey 8 (Redis protocol)
        run: |
          docker run -d --name valkey -p 127.0.0.1:6379:6379 \
            valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2 \
            valkey-server --appendonly yes --appendfsync everysec --save "" \
            --maxmemory 256mb --maxmemory-policy noeviction --protected-mode no
          for i in $(seq 1 30); do
            docker exec valkey valkey-cli ping | grep -qx PONG && exit 0
            sleep 1
          done
          docker logs valkey
          exit 1
      - run: make test-integration

  # T-020: the M1 journey in a real browser (Playwright, Chromium) against the built web app, the real API and the same
  # MySQL, S3 store and Valkey as go-integration (docs/e2e.md). This is the ONLY job that sets SMEM_DEV_FIXED_OTP: the API runs
  # with SMEM_ENV=test, the one environment besides dev where the registered DEV-SHORTCUT(otp) is allowed. The link token of the
  # journey is never printed. On failure the Playwright trace, a screenshot and the API log are uploaded.
  e2e:
    # D-37 (T-132): paused on push and pull request, runs by hand only (gh workflow run ci.yml --ref <branch>); delete this `if:` to switch it back on.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # the journey itself is limited to 240 s (tools/e2e/playwright.config.mjs), print-check to 6 min
    env:
      # Throwaway services on the runner, loopback only; obviously fake values, not secrets (same as go-integration).
      SMEM_DB_DSN: root:ci-only-fake-root-pw@tcp(127.0.0.1:3306)/smem_e2e
      SMEM_REDIS_URL: redis://127.0.0.1:6379/0
      SMEM_S3_ENDPOINT: http://127.0.0.1:9000
      SMEM_S3_REGION: us-east-1
      SMEM_S3_BUCKET: smemories-e2e
      SMEM_S3_ACCESS_KEY: ci-only-s3
      SMEM_S3_SECRET_KEY: ci-only-fake-s3-pw
      SMEM_S3_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gover
        run: echo "minor=$(awk '$1=="go"{split($2,v,".");print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.gover.outputs.minor }}
          check-latest: true
          cache: true
      - uses: ./.github/actions/go-newest-patch
        with:
          minor: ${{ steps.gover.outputs.minor }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/e2e/package-lock.json
      - name: Start MySQL 8.4 (utf8mb4)
        run: |
          docker run -d --name mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=ci-only-fake-root-pw -e MYSQL_DATABASE=smem_e2e \
            mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci \
            --sql-mode=ONLY_FULL_GROUP_BY,STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION \
            --default-time-zone=+00:00
          for i in $(seq 1 60); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -pci-only-fake-root-pw --silent && exit 0
            sleep 2
          done
          docker logs mysql
          exit 1
      - name: Start the S3 store (SeaweedFS) with the bucket
        run: |
          docker run -d --name s3 -p 127.0.0.1:9000:8333 \
            -e AWS_ACCESS_KEY_ID=ci-only-s3 -e AWS_SECRET_ACCESS_KEY=ci-only-fake-s3-pw -e S3_BUCKET=smemories-e2e \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            mini -dir=/data -ip.bind=0.0.0.0 -master.telemetry=false -s3.port=8333
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/status && break
            [ "$i" -lt 60 ] || { docker logs s3; exit 1; }
            sleep 2
          done
      - name: Start Valkey 8 (Redis protocol)
        run: |
          docker run -d --name valkey -p 127.0.0.1:6379:6379 \
            valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2 \
            valkey-server --appendonly yes --appendfsync everysec --save "" \
            --maxmemory 256mb --maxmemory-policy noeviction --protected-mode no
          for i in $(seq 1 30); do
            docker exec valkey valkey-cli ping | grep -qx PONG && exit 0
            sleep 1
          done
          docker logs valkey
          exit 1
      # poppler (pdfinfo, pdffonts, pdftotext, pdfimages) reads the printed PDF, like tools/print-check.
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: tools/e2e
      # T-120: the browser download is cached per resolved Playwright version. A hit installs only the OS packages
      # (install-deps); a miss downloads the browser too. The install hung three times on 2026-10-22 (PRs #109, #111, #113),
      # so each attempt is cut after 150 s and retried once, and the step has its own timeout.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: tools/e2e
      - id: pwcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        timeout-minutes: 6
        env:
          CACHE_HIT: ${{ steps.pwcache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then cmd="install-deps chromium"; else cmd="install --with-deps chromium"; fi
          for attempt in 1 2; do
            start=$SECONDS
            if timeout -k 5 150 npx playwright $cmd; then echo "playwright $cmd: ${attempt} attempt(s), $((SECONDS - start)) s, cache-hit=${CACHE_HIT:-false}"; exit 0; fi
            echo "::warning::playwright $cmd failed or timed out (attempt $attempt)"
          done
          exit 1
        working-directory: tools/e2e
      - run: npm run guard-test
        working-directory: tools/e2e
      - name: The journey
        env:
          SMEM_DEV_FIXED_OTP: "123123" # DEV-SHORTCUT(otp): the only CI job that sets it; the API below runs with SMEM_ENV=test
        run: scripts/e2e.sh
      # T-121: the print check (tools/print-check, the same Playwright version and browser cache as above, poppler installed above)
      # prints fixture books to PDF and inspects them, so a change that drops photos or text from the printed book fails the PR.
      # T-116 broke it unnoticed because it only ran by hand. The whole suite runs; its time is printed so it can be watched.
      - name: Print check
        timeout-minutes: 6
        working-directory: tools/print-check
        run: |
          start=$SECONDS
          npm ci
          npm test
          echo "print-check: $((SECONDS - start)) s"
      - name: Playwright trace, screenshot and API log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: tools/e2e/out
          retention-days: 3 # scripts/e2e.sh scrubs tokens and the session cookie from the trace first (tools/e2e/scrub-trace.sh, docs/e2e.md)

  # T-022 / T-089: builds the production image (no push), runs scripts/image-smoke.sh against it (private MySQL, Valkey and S3 store
  # containers it starts itself), then the secret-hygiene check, the Trivy scan (pinned image, fails on a fixable HIGH/CRITICAL
  # vulnerability) and the SBOM artifact. Not a required check until the owner adds it.
  image:
    # D-38 (T-137): paused on push and pull request, runs by hand only (gh workflow run ci.yml --ref <branch>); delete this `if:` to switch it back on.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image-smoke-selftest
      - run: make image-smoke
      - run: make image-hygiene
      # The vulnerability database is cached per day (Trivy re-downloads it when it is older than its own 24 h limit).
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/smem-trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - run: make image-scan
      - run: make image-scan-selftest
      - name: SBOM (CycloneDX)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: build/sbom/sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 30

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:i18n
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:api

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gover
        run: echo "minor=$(awk '$1=="go"{split($2,v,".");print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.gover.outputs.minor }}
          check-latest: true
          cache: true
      - uses: ./.github/actions/go-newest-patch
        with:
          minor: ${{ steps.gover.outputs.minor }}
      # Blocking: a known vulnerability that the code can reach fails the build.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      # Reported, not blocking: npm advisories often have no fix yet or concern build-time tools
      # that never ship, so a hard failure would block unrelated PRs. Make it blocking (delete
      # continue-on-error) once the dependency tree is clean and advisories are triaged within a day.
      - name: npm audit (non-blocking)
        working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev
