  /api/public-media/get-content:
    get:
      operationId: getPublicMediaContent
      tags: [media]
      summary: Open a photo through a public link (public)
      description: >-
        Called by anyone who holds a photo link, for example from the plain-text export of a book (T-093); there is no session and none is read, no cookie
        is set and no CORS headers are sent. The `token` is `<photo id>.<22-character signature>` and is a **bearer secret** (decision D-32): it is
        never logged (the access log records the route only), never put in an error and never used as a metric label. A link works while three things hold:
        the signature matches the photo, its book and the book's current link epoch (the owner raises the epoch with `POST /api/yearbook/revoke-photo-links`,
        which ends every earlier link of that book at once); the photo is the cover or the profile photo of its book, or belongs to an `approved` note of
        that book; and the photo, the note and the book still exist. Hiding or deleting the note stops its photos at once. **Every other case** (missing,
        malformed or oversized `token`, unknown photo, wrong signature, old epoch, pending, hidden or deleted note, deleted book or photo, a photo no one refers
        to) answers the same `404 ERROR_NOT_FOUND` with the same body, so nothing can be learned by guessing. Binary on success, no envelope: the `display`
        version only (the re-encoded image, 3000 px at most, without EXIF, GPS or other metadata; never the original and never another size).
        `Content-Type` comes from the stored record; `X-Content-Type-Options: nosniff`, `Content-Disposition: inline`, `X-Robots-Tag: noindex, nofollow`,
        `Referrer-Policy: no-referrer` and `Cross-Origin-Resource-Policy: cross-origin` are always set. `Cache-Control: public, max-age=300`: a shared cache
        or CDN may keep serving a revoked or unshared photo for up to 5 minutes. Honours `HEAD`, `Range` (206) and `If-None-Match` (304); a refused link is
        never answered 304. Limits per client IP: 60 requests that find nothing per 15 minutes (only misses count, so a good link never uses this budget) and
        600 requests of any kind per 15 minutes; both answer `ERROR_RATE_LIMITED` with `Retry-After`, and both let the request through when Redis is down.
        A client IP may also have at most 64 downloads in progress (T-107): the 65th waits up to 0.5 s for a slot and is then the same `429 ERROR_RATE_LIMITED`, answered before the link is looked at.
        The route may take up to 2 minutes for a slow client; a client that reads slower than 16 KiB/s (after 15 s) or stops reading for 10 s is disconnected.
      x-auth: public
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The link is not valid for any reason; the reasons cannot be told apart."}
        - {code: ERROR_RATE_LIMITED, description: "Too many requests, or already 64 downloads in progress, from this client IP; wait `Retry-After` seconds."}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; retry later.}
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, maxLength: 128}, description: "The link token, `<26-character photo ULID>.<22 base64url characters>`. A bearer secret."}
      responses:
        "200":
          description: The image bytes. Not an envelope.
          headers:
            Cache-Control: {description: "Always `public, max-age=300` on success.", schema: {type: string, const: "public, max-age=300"}}
            Content-Disposition: {description: "Always `inline`.", schema: {type: string, const: inline}}
            X-Content-Type-Options: {description: "Always `nosniff`.", schema: {type: string, const: nosniff}}
            X-Robots-Tag: {description: "Always `noindex, nofollow`.", schema: {type: string, const: "noindex, nofollow"}}
            Referrer-Policy: {description: "Always `no-referrer`.", schema: {type: string, const: no-referrer}}
            Cross-Origin-Resource-Policy: {description: "Always `cross-origin`.", schema: {type: string, const: cross-origin}}
            ETag: {description: "Per photo content.", schema: {type: string}}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
              examples:
                jpeg:
                  summary: The bytes of a JPEG
                  value: "(binary JPEG bytes)"
            image/png:
              schema: {type: string, format: binary}
              examples:
                png:
                  summary: The bytes of a PNG (a photo with transparency)
                  value: "(binary PNG bytes)"
        "206": {description: The requested byte range (`Range` request header).}
        "304": {description: Not modified (`If-None-Match` matched a link that is still valid).}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "416": {description: Range not satisfiable.}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
  /api/public-collect/get:
    get:
      operationId: getPublicCollect
      tags: [notes]
      summary: Look up a collection link (public)
      description: >-
        Called by the public note form (a friend's browser) when the page opens. No session is needed and none is read; no cookie
        is set and no CORS headers are sent. An unknown, malformed, missing or revoked `token` all answer the same `ERROR_NOT_FOUND`.
        Once the deadline has passed the answer is `ERROR_COLLECTION_CLOSED`. The answer also carries `fields`, the questions of the
        note form in order, so the page can render the form. Only requests that miss (unknown, malformed or revoked token) count
        against the tight limit of 60 per client IP per 15 minutes, so a class behind one address can open the same link; all requests
        together are capped at 600 per client IP per 15 minutes (`ERROR_RATE_LIMITED`, with `Retry-After`: wait that many seconds).
        The token is a credential in the URL: the access log records the route only, never the query string. `signature` tells the page whether to
        show the signature pad (`enabled`, true only when the book's template declares it) and the limits of the drawing space.
      x-auth: public
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The token is missing, malformed, unknown or revoked; the four cannot be told apart."}
        - {code: ERROR_COLLECTION_CLOSED, description: The deadline of the link has passed.}
        - {code: ERROR_RATE_LIMITED, description: "Too many requests from this client IP; wait `Retry-After` seconds."}
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}, description: The link token, a bearer secret of 32 base64url characters.}
      responses:
        "200":
          description: The link is active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicCollectGetResponse"}
              examples:
                open:
                  value:
                    status: OK
                    data:
                      yearbook: {title: Class 12A}
                      owner: {display_name: Linh}
                      deadline_at: 1761000000000
                      open: true
                      fields:
                        - {id: name, kind: short_text, label: {en: Your name, vi: Tên của bạn}, hint: {en: "", vi: ""}, required: true, max_length: 60}
                      signature: {enabled: true, w: 1000, h: 400, max_strokes: 12, max_points: 600}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "410": {$ref: "#/components/responses/ApiGone"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
  /api/public-collect/submit-note:
    post:
      operationId: submitPublicCollectNote
      tags: [notes]
      summary: Submit a note through a collection link (public)
      description: >-
        Called by the public note form (a friend's browser). A friend sends answers to the form fields (`fields` of
        the lookup) and up to three photos, without an account, as `multipart/form-data`; the link `token` is the query parameter
        `token` (the one exception to "parameters go in the body": the link is checked before the body is read, so a request with an
        unknown token costs no disk and no connection time). The note is stored as `pending` for the owner to moderate; nothing about it is returned except its id. No session is read,
        no cookie is set, no CORS headers are sent, and neither the client IP nor the user agent is stored. The body is spooled to a
        temporary file on the server while it arrives (nothing is decoded and no image-processing slot is held during the upload); the
        server removes the file in every case. The link is resolved first: `ERROR_NOT_FOUND` for an unknown, malformed, missing or revoked token is answered at once without
        reading the body (a client that is still uploading may see the connection reset instead of the answer). The other rejections
        (`ERROR_COLLECTION_CLOSED` after the deadline, `ERROR_RATE_LIMITED`, then the note limit and the text: `ERROR_PARAM`, ...) are sent
        only after the rest of the body has been read, so a browser can show them. Send
        `answers` before the first `photos` part (otherwise `ERROR_PARAM`). Unknown parts are ignored. A body that delivers no byte for 10
        seconds, or averages under 16 KiB/s once 15 seconds have passed, or takes over 120 seconds, is dropped (`ERROR_REQUEST_TIMEOUT`,
        nothing stored).


        Answers are validated against the set of fields in force at submission time (text rules of `docs/note-fields.md`: NFC, trimmed,
        control and format characters rejected except ZWJ and variation selectors, limits in characters). Each photo goes through the same
        pipeline as owner uploads (content sniffing, decode limits, metadata stripped, display, print and thumbnail versions); a rejected
        photo rejects the whole submission and nothing is stored. Photos are processed one at a time, each waiting up to 10 seconds for a
        free image-processing slot. A submission is refused at once, before any byte of the body is read, with `ERROR_BUSY` and a
        `Retry-After` of 2 to 6 seconds (random) when the server already has `SMEM_PUBLIC_UPLOAD_MAX_CONNS` uploads in progress or the
        client IP has `SMEM_PUBLIC_UPLOAD_CONCURRENT_PER_IP`; `ERROR_BUSY` is also the answer when no processing slot frees up in 10
        seconds. A `503` costs the client nothing against the request limits below. The server does not read the body of an immediate
        `503`, so a client that is still uploading may see the connection reset instead of the answer: treat a network error exactly
        like `503` and retry with the same data. Retrying after any other failure may store a second note; a success is final.


        Limits: request body 32 MiB, each photo `SMEM_MEDIA_MAX_BYTES` (default 10 MiB), `answers` 16 KiB, `signature` 4 KiB, 300 notes per link in any status,
        the yearbook's photo quota. Submissions that passed text validation are counted per client IP (100 per hour, 300 per day) and per
        link (60 per hour): `ERROR_RATE_LIMITED` with `Retry-After`. A non-empty `website` field is a honeypot: the answer is a normal
        success and nothing is stored.


        An optional `signature` part carries a handwritten signature as vector strokes (decision L-14; format in the `Signature` schema and
        `docs/note-fields.md`). It is read up to 4 KiB, parsed strictly (integers only, limits of strokes, points, coordinates, size and a
        minimum extent) and **re-serialised by the server; the client's string is never stored**. It is validated right after the text and before
        any photo is processed; a bad one is `ERROR_INVALID_SIGNATURE` whose message names the rule, never the content, and nothing is stored.
        A second `signature` part, or one sent to a book whose template does not enable signatures (`signature.enabled` false in the lookup), is
        `ERROR_PARAM`. A `signature` part over 4 KiB is `ERROR_INVALID_SIGNATURE` whatever the template: it is refused while the body is read,
        before the book (and so its template) is looked up. The signature is part of the note: pending until the owner approves it, hidden and deleted with it. Only positions are
        kept (no timing, pressure, pointer or device data).
      x-auth: public
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The token is missing, malformed, unknown or revoked; the four cannot be told apart."}
        - {code: ERROR_COLLECTION_CLOSED, description: The deadline of the link has passed.}
        - {code: ERROR_COLLECTION_FULL, description: The link already holds 300 notes.}
        - {code: ERROR_MISSING_ANSWER, description: "A required field is missing or blank; the message names the field id, never the value."}
        - {code: ERROR_INVALID_ANSWER, description: "An answer breaks the text rules or the field's length limit; the message names the field id, never the value."}
        - {code: ERROR_INVALID_SIGNATURE, description: "The signature part breaks the format (not the exact v1 JSON, a float, an out-of-range or negative number, an extra or duplicate key, a stroke with fewer than 2 points, more than 12 strokes, 600 points or 3072 bytes, a speck, more than 4 KiB sent, or an empty part); the message names the rule, never the content."}
        - {code: ERROR_TOO_MANY_PHOTOS, description: More than three photos were sent.}
        - {code: ERROR_INVALID_IMAGE, description: "A photo is corrupt, over 12000 px on a side, over 50 megapixels for JPEG or 25 megapixels for PNG and WebP, or its estimated decoded size is over 128 MiB."}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: The request is not multipart/form-data, or a photo is not a JPEG, PNG or WebP image.}
        - {code: ERROR_VERIFICATION_FAILED, description: The abuse check refused the submission.}
        - {code: ERROR_QUOTA_EXCEEDED, description: The yearbook's photo quota is reached.}
        - {code: ERROR_TOO_LARGE, description: The request body is over 32 MiB or a photo is over the per-photo cap.}
        - {code: ERROR_REQUEST_TIMEOUT, description: "No body byte arrived for 10 seconds, the average rate stayed under 16 KiB/s after 15 seconds, or the upload took over 120 seconds; nothing was stored."}
        - {code: ERROR_RATE_LIMITED, description: "Too many requests from this client IP or for this link; wait `Retry-After` seconds."}
        - {code: ERROR_BUSY, description: "The upload slots or the image-processing slots are full; retry after `Retry-After`."}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; nothing was kept, retry later.}
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}, description: The link token, a bearer secret of 32 base64url characters. Never logged.}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/PublicCollectSubmitNoteRequest"}
            examples:
              textOnly:
                value: {answers: '{"name":"Linh","message":"Nhớ các bạn nhiều 🎓"}'}
              withSignature:
                value: {answers: '{"name":"Linh","message":"Nhớ các bạn nhiều 🎓"}', signature: '{"v":1,"w":1000,"h":400,"s":[[120,260,300,120,480,280],[500,260,880,240]]}'}
      responses:
        "200":
          description: Stored as pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicCollectSubmitNoteResponse"}
              examples:
                stored:
                  value: {status: OK, data: {id: 01K7QB4C5D6E7F8G9H0J1K2M3N}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "408": {$ref: "#/components/responses/ApiRequestTimeout"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "410": {$ref: "#/components/responses/ApiGone"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiBusy"}
  /api/class/create:
    post:
      operationId: createClass
      tags: [class]
      summary: Create a class (the caller becomes its admin)
      description: >-
        Called by a signed-in user with a verified email (the new-class form). Creates the class and makes the caller its first member with the role `admin`.
        `name` and `language` are required; `school_name` and `graduation_year` are optional. A user can be admin of at most 10 classes (`ERROR_LIMIT_REACHED`).
        An unverified email is `ERROR_EMAIL_NOT_VERIFIED` and nothing is created. Unknown fields and a body that is not a JSON object are `ERROR_PARAM`. Text fields are normalised to NFC and trimmed; control characters (Cc), format characters (Cf, except U+200D) and line/paragraph separators are rejected.
        Not idempotent: repeating a lost request creates a second class. A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The caller's email address is not verified yet; nothing was created.}
        - {code: ERROR_INVALID_NAME, description: "Field `name`: missing, empty after trimming, over 120 characters, or containing control characters."}
        - {code: ERROR_INVALID_SCHOOL_NAME, description: "Field `school_name`: over 120 characters or containing control characters."}
        - {code: ERROR_INVALID_GRADUATION_YEAR, description: "Field `graduation_year`: not a whole year from 1950 to 2100."}
        - {code: ERROR_INVALID_LANGUAGE, description: "Field `language`: missing, or not `en` or `vi`."}
        - {code: ERROR_LIMIT_REACHED, description: The user is already admin of 10 classes.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_RATE_LIMITED, description: "More than 120 class writes by this user in an hour. Retry after `Retry-After`."}
        - {code: ERROR_UNAVAILABLE, description: "The write rate limiter in Redis did not answer, so the write fails closed. Retry after `Retry-After`."}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
