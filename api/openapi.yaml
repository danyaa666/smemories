  /api/note/batch-delete:
    post:
      operationId: deleteNotes
      tags: [notes]
      summary: Delete up to 100 notes with their photos
      description: >-
        Called by the owner's inbox (the web delays the call so the owner can undo, see T-017). Deletes 1 to 100 notes of one
        yearbook (`ids` must not repeat; more than 100 is `ERROR_TOO_MANY_IDS`) and their photos: the stored objects first, then
        the note, note-photo and photo rows in one transaction. Hard delete, there is no undo on the server. All or nothing: any id
        that is not a note of that yearbook, or of someone else's, is `ERROR_NOT_FOUND` for the whole batch. If the object store
        fails the answer is `ERROR_STORAGE_ERROR` (502) and the notes are still there: retry the same call. Notes that were already
        deleted are `ERROR_NOT_FOUND`, so after a lost answer the client reloads. The positions of the remaining approved notes
        close up. A photo that is also the yearbook's cover or profile photo is cleared there. Returns the new `counts`. Needs a
        verified email. At most 120 moderation writes per user per minute. A request with the session cookie must come from an
        allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook, or at least one of the ids, does not exist or belongs to someone else; nothing was deleted.}
        - {code: ERROR_TOO_MANY_IDS, description: More than 100 ids.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_RATE_LIMITED, description: "More than 120 moderation writes in a minute. Retry after `Retry-After`."}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; nothing was changed, retry later.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteDeleteRequest"}
            examples:
              delete:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, ids: [01K7QB1B2C3D4E5F6G7H8J9K0M]}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteCountsResponse"}
              examples:
                deleted:
                  value: {status: OK, data: {counts: {all: 4, pending: 0, approved: 3, hidden: 1}}}
