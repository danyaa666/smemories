  /api/yearbook/update:
    post:
      operationId: updateYearbook
      tags: [yearbook]
      summary: Partially update a yearbook
      description: >-
        Called by the signed-in owner (the edit screen, the cover picker). Only the fields present change; an absent field stays as it is, an empty string clears an
        optional text field and `graduation_year: null` or `cover_media_id: null` or `template_id: null` clear them. A JSON null on any other field counts as absent. A body with only `id` changes nothing
        but still bumps `updated_at`. `cover_media_id` must be a photo of this very book (`ERROR_INVALID_MEDIA`). Unknown fields and a missing `id` are `ERROR_PARAM`. Text fields are normalised to NFC and trimmed; control characters (Cc), format characters (Cf, except U+200D) and line/paragraph separators are rejected.
        A request with the session cookie must come from an allowed Origin. Idempotent: repeating it leaves the same book (apart from `updated_at`).
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_INVALID_TITLE, description: "Field `title`: missing on create, empty after trimming, over 120 characters, or containing control characters."}
        - {code: ERROR_INVALID_SCHOOL_NAME, description: "Field `school_name`: over 120 characters or containing control characters."}
        - {code: ERROR_INVALID_CLASS_NAME, description: "Field `class_name`: over 120 characters or containing control characters."}
        - {code: ERROR_INVALID_GRADUATION_YEAR, description: "Field `graduation_year`: not a whole year from 1950 to 2100."}
        - {code: ERROR_INVALID_MOTTO, description: "Field `motto`: over 200 characters or containing control characters."}
        - {code: ERROR_INVALID_LANGUAGE, description: "Field `language`: missing on create, or not `en` or `vi`."}
        - {code: ERROR_INVALID_PAGE_SIZE, description: "Field `page_size`: not `A5`, `A4` or `Letter`."}
        - {code: ERROR_INVALID_TEMPLATE, description: "Field `template_id`: not a template of the registry, one that does not support the book's page size, or (on update) a page-size change to a size the book's chosen template does not support."}
        - {code: ERROR_INVALID_MEDIA, description: "`cover_media_id` is not a photo of this yearbook (unknown, deleted, or another book's), or not a canonical ULID."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YearbookUpdateRequest"}
            examples:
              rename:
                value: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, title: "Lớp 12A1 - Kỷ yếu", graduation_year: null}
      responses:
        "200":
          description: The updated book.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearbookResponse"}
              examples:
                updated:
                  value:
                    status: OK
                    data: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, title: "Lớp 12A1 - Trường THPT Chu Văn An", school_name: "THPT Chu Văn An", class_name: 12A1, graduation_year: 2026, motto: "Học, học nữa, học mãi", language: vi, page_size: A5, template_id: null, cover_media_id: null, created_at: 1760000000000, updated_at: 1760000000000, profile: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2F, is_owner: true, full_name: "Nguyễn Thị Hồng", nickname: "", birthday: null, quote: "", hobbies: "", future_plans: "", photo_media_id: null}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/yearbook/update-profile:
    post:
      operationId: updateYearbookProfile
      tags: [yearbook]
      summary: Replace the owner's profile information
      description: >-
        Called by the signed-in owner (the profile form, the photo picker). Replaces every profile field: an omitted optional field is cleared, so send the whole profile
        (the web app builds the body from the current one). `full_name` is required. `photo_media_id` must be a photo of this very book (`ERROR_INVALID_MEDIA`). The
        birthday is personal data and is never logged. Unknown fields (for example `is_owner`) and a missing `yearbook_id` are `ERROR_PARAM`. Text fields are normalised to NFC and trimmed; control characters (Cc), format characters (Cf, except U+200D) and line/paragraph separators are rejected.
        A request with the session cookie must come from an allowed Origin. Idempotent.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_INVALID_FULL_NAME, description: "Field `full_name`: missing, empty after trimming, over 100 characters, or containing control characters."}
        - {code: ERROR_INVALID_NICKNAME, description: "Field `nickname`: over 50 characters or containing control characters."}
        - {code: ERROR_INVALID_BIRTHDAY, description: "Field `birthday`: not a real `YYYY-MM-DD` date, before 1900-01-01, or not before today (UTC)."}
        - {code: ERROR_INVALID_QUOTE, description: "Field `quote`: over 500 characters or containing control characters."}
        - {code: ERROR_INVALID_HOBBIES, description: "Field `hobbies`: over 300 characters or containing control characters."}
        - {code: ERROR_INVALID_FUTURE_PLANS, description: "Field `future_plans`: over 300 characters or containing control characters."}
