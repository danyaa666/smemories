  /api/note/get-list:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List a yearbook's notes for moderation
      description: >-
        Called by the signed-in owner's inbox. Returns one page of the notes of a yearbook and, in `counts`, the number of notes
        of the whole book per status (for the tabs and the header), whatever the filter. `status` is optional: `pending` (not
        looked at yet), `approved` (in the book) or `hidden`; omitted means all. `status=approved` is in book order (`position`
        1, 2, 3 ...); every other value is newest first. `limit` defaults to 50, at most 100 (`ERROR_PARAM` above). `next_id` is
        the opaque cursor of the previous page, bound to this yearbook and this `status`; a malformed, tampered or foreign one is
        `ERROR_PARAM`. Items carry the answers as stored (the display name is `answers.name`, the client falls back to
        "Anonymous"), the handwritten `signature` (vector strokes, or null; integers only, draw it as an SVG path) in every status, photo ids only (content through `media/get-content`), the label of the link the note arrived through, and
        no token. Needs a verified email (`ERROR_EMAIL_NOT_VERIFIED`). A missing yearbook and one owned by someone else both
        answer `ERROR_NOT_FOUND`. Safe to repeat.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: yearbook_id, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Yearbook ULID.}
        - {name: status, in: query, required: false, schema: {type: string, enum: [pending, approved, hidden]}, description: "Only notes in this status; omitted means all. `approved` is in book order, the others newest first."}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}, description: Page size.}
        - {name: next_id, in: query, required: false, schema: {type: string}, description: "Opaque cursor from the previous page's `next_id`; omit for the first page."}
      responses:
        "200":
          description: One page of notes and the counts of the whole yearbook.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteListResponse"}
              examples:
                approved:
                  value:
                    status: OK
                    data:
                      items:
                        - {id: 01K7QB1B2C3D4E5F6G7H8J9K0M, status: approved, answers: {name: Minh Khoa, relationship: Classmate, message: Thanks for everything}, signature: {v: 1, w: 1000, h: 400, s: [[120, 260, 300, 120, 480, 280]]}, photos: [{id: 01K7QC1B2C3D4E5F6G7H8J9K0M}], link_label: Cafe friends, created_at: 1760000100000, position: 1}
                      next_id: ""
