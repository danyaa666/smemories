        Keyset paginated: pass the `next_id` of a page back as the `next_id` query parameter; it is the empty string on the last page. `next_id` is an opaque, tamper-evident token bound to the caller's list: a changed, truncated or foreign token is `ERROR_PARAM`. A `limit` outside 1..50 is `ERROR_PARAM`.
      x-auth: required
      x-error-codes:
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
