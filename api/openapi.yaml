  /api/media/create:
    post:
      operationId: createMedia
      tags: [media]
      summary: Upload a photo to a yearbook
      description: >-
        Called by the signed-in owner (the web app's photo library, cover and profile photo pickers). `multipart/form-data` with the
        text field `yearbook_id` and the image in the part named `file`, in either order; other parts are ignored and the client file
        name is never used. The type is decided by sniffing the content (JPEG, PNG, WebP), never by file name or Content-Type. The image
        is decoded, rotated upright, stripped of all metadata (EXIF, GPS, ICC, comments), resized to at most 3000 px on the long edge
        (never enlarged) and stored; a 480 px JPEG thumbnail and a print version (long edge at most 1800 px, JPEG quality 85, PNG when
        the photo has transparency) are stored too. Opaque images are stored as JPEG, images with transparency as PNG. Only the owner of
        the yearbook may upload (`ERROR_NOT_FOUND` otherwise). The request body is capped at `SMEM_MEDIA_MAX_BYTES` (default 10 MiB) for
        the file plus 64 KiB of framing. The route may take up to 2.5 minutes (2 minutes to receive a slow phone upload, 30 seconds to
        process it). Limits: 200 photos per yearbook, 500 MiB per user, 60 uploads per 10 minutes per user, and at most four times the
        number of image-processing slots in progress at once (`ERROR_BUSY`, retry after `Retry-After`). Needs a verified email
        (`ERROR_EMAIL_NOT_VERIFIED`, checked before the body is read), and at most 2 uploads in progress per user and 4 per client address
        (`ERROR_RATE_LIMITED` with `Retry-After: 5`). A request with the session cookie
        must come from an allowed Origin. Not idempotent: retrying after a lost answer may store the photo twice. The answer carries no
        storage key or URL: fetch the image with `GET /api/media/get-content?id=`.
      x-auth: required
      x-error-codes:
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet; nothing was read or stored.}
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_INVALID_IMAGE, description: "The image is corrupt, over 12000 px on a side, over 50 megapixels for JPEG or 25 megapixels for PNG and WebP, or its estimated decoded size is over 128 MiB."}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: The request is not multipart/form-data, or the file is not a JPEG, PNG or WebP image.}
        - {code: ERROR_QUOTA_EXCEEDED, description: "The yearbook already holds 200 photos or the user's photos together reach 500 MiB."}
        - {code: ERROR_TOO_LARGE, description: "The file or the request body is over the cap (`SMEM_MEDIA_MAX_BYTES` plus framing)."}
        - {code: ERROR_REQUEST_TIMEOUT, description: The request body did not arrive in time; nothing was stored.}
        - {code: ERROR_RATE_LIMITED, description: "More than 60 uploads in 10 minutes for this user, or already 2 uploads in progress for this user or 4 for this client address; wait `Retry-After` seconds."}
        - {code: ERROR_BUSY, description: "Too many uploads are in progress; retry after `Retry-After`."}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; nothing was kept, retry later.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/MediaCreateRequest"}
            examples:
              photo:
                summary: A photo for one yearbook
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, file: "(binary JPEG, PNG or WebP bytes)"}
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaResponse"}
              examples:
                stored:
                  value:
                    status: OK
                    data: {id: 01K7QC5D6E7F8G9H0J1K2M3N4P, yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, content_type: image/jpeg, bytes: 184220, width: 1800, height: 1200, created_at: 1760000000000}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "408": {$ref: "#/components/responses/ApiRequestTimeout"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiBusy"}
  /api/media/get-list:
    get:
      operationId: listMedia
      tags: [media]
      summary: List a yearbook's photos
      description: >-
        Called by the signed-in owner (the photo library). Newest first, keyset paginated, so uploads and deletes between pages never
        repeat or skip a photo that stays. Pass the `next_id` of a page back as the `next_id` query parameter to get the next one; it is the empty string on the last page.
        `next_id` is an opaque, tamper-evident token that is bound to the yearbook it came from: a changed, truncated, foreign or
        otherwise unknown token (also the cursor of the old API) is `ERROR_PARAM`, and a token never reveals an internal id. By default
        only the owner's own uploads are listed (`uploader=owner`); `contributor` lists the photos friends sent through a collection link
        and `all` both. A missing `yearbook_id`, a `limit` outside 1..100 and an unknown `uploader` are `ERROR_PARAM`. A missing yearbook
        and one owned by someone else both answer `ERROR_NOT_FOUND`. The response never contains storage keys, hashes or URLs: build the
        image URL from `id`, for example `/api/media/get-content?id=<id>&variant=thumb`.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: yearbook_id, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Yearbook ULID.}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}, description: "Page size, default 50, maximum 100."}
        - {name: next_id, in: query, required: false, schema: {type: string}, description: "Opaque token from the previous page; omit it for the first page."}
        - {name: uploader, in: query, required: false, schema: {type: string, enum: [owner, contributor, all], default: owner}, description: "Whose photos to list: `owner` (the owner's own uploads, default), `contributor` (photos sent through a collection link) or `all`."}
      responses:
        "200":
          description: A page of photos.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaListResponse"}
              examples:
                page:
                  value:
                    status: OK
                    data:
                      items:
                        - {id: 01K7QC5D6E7F8G9H0J1K2M3N4P, yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, content_type: image/jpeg, bytes: 184220, width: 1800, height: 1200, created_at: 1760000000000}
                      next_id: ""
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/media/get-content:
    get:
      operationId: getMediaContent
      tags: [media]
      summary: Download a photo
      description: >-
        Called by the browser for every `<img src>` of the signed-in owner (session cookie, same origin). Binary: on success the body is
        the stored image with **no envelope**; `Content-Type` comes from the stored record (`image/jpeg`, or `image/png` for a photo with
        transparency; always `image/jpeg` for `variant=thumb`), `X-Content-Type-Options: nosniff` and `Cache-Control: private, max-age=3600`
        are set, and the `ETag` differs per variant. Honours `HEAD`, `Range` (206) and `If-None-Match` (304). On failure the answer is the
        usual JSON error envelope with the matching HTTP status and `Cache-Control: no-store`, so an error is never cached in place of the
        image; an `<img>` tag only needs the status. Only the owner may read (`ERROR_NOT_FOUND` for anyone else, and for an unknown id).
        `variant=print` is the 1800 px version for the print renderer; a photo uploaded before it existed, and not yet reached by the
        backfill (`smemories-media-backfill`), is answered in display size. The route may take up to 2 minutes for a slow client; a client that reads
        slower than 16 KiB/s (after 15 s) or stops reading for 10 s is disconnected. The bytes are streamed from the object store (T-107). One account may
        have at most 64 downloads in progress; the 65th waits up to 0.5 s for a slot and is then `429 ERROR_RATE_LIMITED` with `Retry-After`, answered before anything is read.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The photo does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_RATE_LIMITED, description: "This account already has 64 photo downloads in progress; retry after `Retry-After` seconds."}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed or the stored object is gone; retry later.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Photo ULID (the `id` of a list item or of the upload answer).}
        - {name: variant, in: query, required: false, schema: {type: string, enum: [display, thumb, print], default: display}, description: "Which stored version to send: `display` (long edge at most 3000 px, the default), `thumb` (480 px JPEG) or `print` (long edge at most 1800 px, for the print renderer). Anything else is `ERROR_PARAM`."}
      responses:
        "200":
          description: The image bytes. Not an envelope.
          headers:
            Cache-Control: {description: "Always `private, max-age=3600` on success.", schema: {type: string, const: "private, max-age=3600"}}
            X-Content-Type-Options: {description: "Always `nosniff`.", schema: {type: string, const: nosniff}}
            ETag: {description: "Differs per variant (`-t` thumb, `-p` print).", schema: {type: string}}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
              examples:
                jpeg:
                  summary: The bytes of a JPEG (display or thumb)
                  value: "(binary JPEG bytes)"
            image/png:
              schema: {type: string, format: binary}
              examples:
                png:
                  summary: The bytes of a PNG (a photo with transparency)
                  value: "(binary PNG bytes)"
        "206": {description: The requested byte range (`Range` request header).}
        "304": {description: Not modified (`If-None-Match` matched).}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "416": {description: Range not satisfiable.}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/media/delete:
    post:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a photo
      description: >-
        Called by the signed-in owner. Removes the row and the stored objects (display, thumbnail, print). Idempotent: an unknown id, an
        already deleted one and someone else's photo all answer success (and the last deletes nothing), so the answer never reveals whether
        a photo exists. A cover or profile photo that pointed at it is cleared. A missing `id` and unknown fields are `ERROR_PARAM`. A
        request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; the photo is still there and the call can be repeated.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MediaDeleteRequest"}
            examples:
              delete:
                value: {id: 01K7QC5D6E7F8G9H0J1K2M3N4P}
      responses:
        "200":
          description: Deleted, or there was nothing to delete.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                deleted:
                  value: {status: OK, data: {}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note-collection/create:
    post:
      operationId: createNoteCollection
      tags: [notes]
      summary: Create a collection link for a yearbook
      description: >-
        Called by the signed-in owner of a yearbook (the web app's "share" screen). Creates a private link friends can use
        to leave notes. The body is a JSON object with the `yearbook_id` and optional options. The response carries the link
        `token` once; only its SHA-256 is stored and it can never be shown again (revoke the link and create a new one instead).
        The token is a bearer secret of 192 random bits (32 base64url characters); the web link is `<app>/c/<token>`.
        `label` is optional, at most 60 characters, NFC and trimmed (`ERROR_INVALID_LABEL` for control or format characters).
        `deadline_at` is optional, Unix ms, in the future and at most one year ahead (`ERROR_INVALID_DEADLINE`); `null` or
        absent means no deadline. Unknown fields, a missing `yearbook_id` and values of the wrong type are `ERROR_PARAM`.
        Needs a verified email (`ERROR_EMAIL_NOT_VERIFIED`). A missing yearbook and one owned by someone else both answer
        `ERROR_NOT_FOUND`. At most 5 active (not revoked) links and at most 50 links in all, revoked ones included, per yearbook (`ERROR_LIMIT_REACHED`). A request with the
        session cookie must come from an allowed Origin. Not idempotent: retrying after a lost answer may create a second link.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_INVALID_LABEL, description: The label is longer than 60 characters or contains control or format characters.}
        - {code: ERROR_INVALID_DEADLINE, description: "`deadline_at` is not in the future or is more than one year ahead."}
        - {code: ERROR_LIMIT_REACHED, description: "The yearbook already has 5 active links, or 50 links in all (revoked ones count)."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteCollectionCreateRequest"}
            examples:
              withDeadline:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, label: Cafe friends, deadline_at: 1761000000000}
              noOptions:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E}
      responses:
        "200":
          description: Created. The only response that ever contains the token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteCollectionCreateResponse"}
              examples:
                created:
                  value:
                    status: OK
