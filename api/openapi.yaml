  /api/yearbook/revoke-photo-links:
    post:
      operationId: revokeYearbookPhotoLinks
      tags: [yearbook]
      summary: Switch off every public photo link of a yearbook
      description: >-
        Called by the signed-in owner (the export screen, T-094). Raises the book's link epoch by one, atomically, so every public photo link made before
        (`GET /api/public-media/get-content`) stops working at once; links made afterwards carry the new epoch. It cannot be undone and there is no way to
        revoke a single photo. A shared cache may still serve a photo for up to 5 minutes after the call. The book's `updated_at` is not changed. A book that
        does not exist and someone else's both answer `ERROR_NOT_FOUND`; a missing `id` and unknown fields are `ERROR_PARAM`. Limited to 10 calls per hour
        per user (`ERROR_RATE_LIMITED`, with `Retry-After`; fails open when Redis is down). A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_RATE_LIMITED, description: "More than 10 calls in an hour; wait `Retry-After` seconds."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
