        `title` and `language` are required; `page_size` defaults to `A5`; every other field is optional. A user owns at most 20 books (`ERROR_LIMIT_REACHED`).
        A new book has no photos yet, so `cover_media_id` is not accepted here (`ERROR_INVALID_MEDIA`): set the cover later with `/api/yearbook/update`. Unknown fields
        (for example `owner_id`) and a body that is not a JSON object are `ERROR_PARAM`. Text fields are normalised to NFC and trimmed; control characters (Cc), format characters (Cf, except U+200D) and line/paragraph separators are rejected. Not idempotent: repeating a lost request creates a second book.
        A request with the session cookie must come from an allowed Origin.
      x-auth: required
