  /api/yearbook/delete:
    post:
      operationId: deleteYearbook
      tags: [yearbook]
      summary: Delete a yearbook
      description: >-
        Called by the signed-in owner (the edit screen). Hard-deletes the book with its profile, photos, note collections and notes. The stored files are removed
        from object storage first; if that fails the call answers `ERROR_STORAGE_ERROR` and nothing is deleted, so it can simply be repeated. After the
        files are gone one transaction removes the rows (all or nothing). Not idempotent: a book that is already deleted, a missing one and someone else's all answer
        `ERROR_NOT_FOUND`. A missing `id` and unknown fields are `ERROR_PARAM`. A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; the book is still there and the call can be repeated.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YearbookDeleteRequest"}
            examples:
              delete:
                value: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                deleted:
                  value: {status: OK, data: {}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/media/create:
    post:
      operationId: createMedia
      tags: [media]
      summary: Upload a photo to a yearbook
      description: >-
        Called by the signed-in owner (the web app's photo library, cover and profile photo pickers). `multipart/form-data` with the
        text field `yearbook_id` and the image in the part named `file`, in either order; other parts are ignored and the client file
        name is never used. The type is decided by sniffing the content (JPEG, PNG, WebP), never by file name or Content-Type. The image
        is decoded, rotated upright, stripped of all metadata (EXIF, GPS, ICC, comments), resized to at most 3000 px on the long edge
        (never enlarged) and stored; a 480 px JPEG thumbnail and a print version (long edge at most 1800 px, JPEG quality 85, PNG when
        the photo has transparency) are stored too. Opaque images are stored as JPEG, images with transparency as PNG. Only the owner of
        the yearbook may upload (`ERROR_NOT_FOUND` otherwise). The request body is capped at `SMEM_MEDIA_MAX_BYTES` (default 10 MiB) for
        the file plus 64 KiB of framing. The route may take up to 2.5 minutes (2 minutes to receive a slow phone upload, 30 seconds to
        process it). Limits: 200 photos per yearbook, 500 MiB per user, 60 uploads per 10 minutes per user, and at most four times the
        number of image-processing slots in progress at once (`ERROR_BUSY`, retry after `Retry-After`). A request with the session cookie
        must come from an allowed Origin. Not idempotent: retrying after a lost answer may store the photo twice. The answer carries no
        storage key or URL: fetch the image with `GET /api/media/get-content?id=`.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_INVALID_IMAGE, description: "The image is corrupt, over 12000 px on a side, over 50 megapixels for JPEG or 25 megapixels for PNG and WebP, or its estimated decoded size is over 128 MiB."}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: The request is not multipart/form-data, or the file is not a JPEG, PNG or WebP image.}
        - {code: ERROR_QUOTA_EXCEEDED, description: "The yearbook already holds 200 photos or the user's photos together reach 500 MiB."}
        - {code: ERROR_TOO_LARGE, description: "The file or the request body is over the cap (`SMEM_MEDIA_MAX_BYTES` plus framing)."}
        - {code: ERROR_REQUEST_TIMEOUT, description: The request body did not arrive in time; nothing was stored.}
        - {code: ERROR_RATE_LIMITED, description: "More than 60 uploads in 10 minutes for this user; wait `Retry-After` seconds."}
        - {code: ERROR_BUSY, description: "Too many uploads are in progress; retry after `Retry-After`."}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; nothing was kept, retry later.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/MediaCreateRequest"}
            examples:
              photo:
                summary: A photo for one yearbook
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, file: "(binary JPEG, PNG or WebP bytes)"}
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaResponse"}
              examples:
                stored:
                  value:
                    status: OK
                    data: {id: 01K7QC5D6E7F8G9H0J1K2M3N4P, yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, content_type: image/jpeg, bytes: 184220, width: 1800, height: 1200, created_at: 1760000000000}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "408": {$ref: "#/components/responses/ApiRequestTimeout"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiBusy"}
  /api/media/get-list:
    get:
      operationId: listMedia
      tags: [media]
      summary: List a yearbook's photos
      description: >-
        Called by the signed-in owner (the photo library). Newest first, keyset paginated, so uploads and deletes between pages never
        repeat or skip a photo that stays. Pass the `next_id` of a page back as the `next_id` query parameter to get the next one; it is the empty string on the last page.
        `next_id` is an opaque, tamper-evident token that is bound to the yearbook it came from: a changed, truncated, foreign or
        otherwise unknown token (also the cursor of the old API) is `ERROR_PARAM`, and a token never reveals an internal id. By default
        only the owner's own uploads are listed (`uploader=owner`); `contributor` lists the photos friends sent through a collection link
        and `all` both. A missing `yearbook_id`, a `limit` outside 1..100 and an unknown `uploader` are `ERROR_PARAM`. A missing yearbook
        and one owned by someone else both answer `ERROR_NOT_FOUND`. The response never contains storage keys, hashes or URLs: build the
        image URL from `id`, for example `/api/media/get-content?id=<id>&variant=thumb`.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: yearbook_id, in: query, required: true, schema: {type: string}, description: Yearbook ULID.}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}, description: "Page size, default 50, maximum 100."}
        - {name: next_id, in: query, required: false, schema: {type: string}, description: "Opaque token from the previous page; omit it for the first page."}
        - {name: uploader, in: query, required: false, schema: {type: string, enum: [owner, contributor, all], default: owner}, description: "Whose photos to list: `owner` (the owner's own uploads, default), `contributor` (photos sent through a collection link) or `all`."}
      responses:
        "200":
          description: A page of photos.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaListResponse"}
              examples:
                page:
                  value:
                    status: OK
                    data:
                      items:
                        - {id: 01K7QC5D6E7F8G9H0J1K2M3N4P, yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, content_type: image/jpeg, bytes: 184220, width: 1800, height: 1200, created_at: 1760000000000}
                      next_id: ""
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/media/get-content:
    get:
      operationId: getMediaContent
      tags: [media]
      summary: Download a photo
      description: >-
        Called by the browser for every `<img src>` of the signed-in owner (session cookie, same origin). Binary: on success the body is
        the stored image with **no envelope**; `Content-Type` comes from the stored record (`image/jpeg`, or `image/png` for a photo with
        transparency; always `image/jpeg` for `variant=thumb`), `X-Content-Type-Options: nosniff` and `Cache-Control: private, max-age=3600`
        are set, and the `ETag` differs per variant. Honours `HEAD`, `Range` (206) and `If-None-Match` (304). On failure the answer is the
        usual JSON error envelope with the matching HTTP status and `Cache-Control: no-store`, so an error is never cached in place of the
        image; an `<img>` tag only needs the status. Only the owner may read (`ERROR_NOT_FOUND` for anyone else, and for an unknown id).
        `variant=print` is the 1800 px version for the print renderer; a photo uploaded before it existed, and not yet reached by the
        backfill (`smemories-media-backfill`), is answered in display size. The route may take up to 2 minutes for a slow client.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The photo does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed or the stored object is gone; retry later.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}, description: Photo ULID (the `id` of a list item or of the upload answer).}
        - {name: variant, in: query, required: false, schema: {type: string, enum: [display, thumb, print], default: display}, description: "Which stored version to send: `display` (long edge at most 3000 px, the default), `thumb` (480 px JPEG) or `print` (long edge at most 1800 px, for the print renderer). Anything else is `ERROR_PARAM`."}
      responses:
        "200":
          description: The image bytes. Not an envelope.
          headers:
            Cache-Control: {description: "Always `private, max-age=3600` on success.", schema: {type: string, const: "private, max-age=3600"}}
            X-Content-Type-Options: {description: "Always `nosniff`.", schema: {type: string, const: nosniff}}
            ETag: {description: "Differs per variant (`-t` thumb, `-p` print).", schema: {type: string}}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
              examples:
                jpeg:
                  summary: The bytes of a JPEG (display or thumb)
                  value: "(binary JPEG bytes)"
            image/png:
              schema: {type: string, format: binary}
              examples:
                png:
                  summary: The bytes of a PNG (a photo with transparency)
                  value: "(binary PNG bytes)"
        "206": {description: The requested byte range (`Range` request header).}
        "304": {description: Not modified (`If-None-Match` matched).}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "416": {description: Range not satisfiable.}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/media/delete:
    post:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a photo
      description: >-
        Called by the signed-in owner. Removes the row and the stored objects (display, thumbnail, print). Idempotent: an unknown id, an
        already deleted one and someone else's photo all answer success (and the last deletes nothing), so the answer never reveals whether
        a photo exists. A cover or profile photo that pointed at it is cleared. A missing `id` and unknown fields are `ERROR_PARAM`. A
        request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; the photo is still there and the call can be repeated.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MediaDeleteRequest"}
            examples:
              delete:
                value: {id: 01K7QC5D6E7F8G9H0J1K2M3N4P}
      responses:
        "200":
          description: Deleted, or there was nothing to delete.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                deleted:
                  value: {status: OK, data: {}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note-collection/create:
    post:
      operationId: createNoteCollection
      tags: [notes]
      summary: Create a collection link for a yearbook
      description: >-
        Called by the signed-in owner of a yearbook (the web app's "share" screen). Creates a private link friends can use
        to leave notes. The body is a JSON object with the `yearbook_id` and optional options. The response carries the link
        `token` once; only its SHA-256 is stored and it can never be shown again (revoke the link and create a new one instead).
        The token is a bearer secret of 192 random bits (32 base64url characters); the web link is `<app>/c/<token>`.
        `label` is optional, at most 60 characters, NFC and trimmed (`ERROR_INVALID_LABEL` for control or format characters).
        `deadline_at` is optional, Unix ms, in the future and at most one year ahead (`ERROR_INVALID_DEADLINE`); `null` or
        absent means no deadline. Unknown fields, a missing `yearbook_id` and values of the wrong type are `ERROR_PARAM`.
        Needs a verified email (`ERROR_EMAIL_NOT_VERIFIED`). A missing yearbook and one owned by someone else both answer
        `ERROR_NOT_FOUND`. At most 5 active (not revoked) links per yearbook (`ERROR_LIMIT_REACHED`). A request with the
        session cookie must come from an allowed Origin. Not idempotent: retrying after a lost answer may create a second link.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_INVALID_LABEL, description: The label is longer than 60 characters or contains control or format characters.}
        - {code: ERROR_INVALID_DEADLINE, description: "`deadline_at` is not in the future or is more than one year ahead."}
        - {code: ERROR_LIMIT_REACHED, description: The yearbook already has 5 active links.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteCollectionCreateRequest"}
            examples:
              withDeadline:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, label: Cafe friends, deadline_at: 1761000000000}
              noOptions:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E}
      responses:
        "200":
          description: Created. The only response that ever contains the token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteCollectionCreateResponse"}
              examples:
                created:
                  value:
                    status: OK
                    data: {id: 01K7QA1B2C3D4E5F6G7H8J9K0M, label: Cafe friends, deadline_at: 1761000000000, created_at: 1760000000000, token: q3Zp0Vn8xYk2LwR5tB7mJc9aHdE4sUgF}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note-collection/get-list:
    get:
      operationId: listNoteCollections
      tags: [notes]
      summary: List a yearbook's collection links
      description: >-
        Called by the signed-in owner to show the links of a yearbook, newest first, revoked ones included (`revoked_at` set).
        Never contains a token or a token hash. `note_count` counts the link's notes in any status. At most 5 links are active, but
        revoked ones stay, so the list is returned whole: `next_id` is always the empty string and there is no `limit` yet.
        A missing `yearbook_id` is `ERROR_PARAM`; a missing yearbook and one owned by someone else both answer `ERROR_NOT_FOUND`.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: yearbook_id, in: query, required: true, schema: {type: string}, description: Yearbook ULID.}
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteCollectionListResponse"}
              examples:
                list:
                  value:
                    status: OK
                    data:
                      items:
                        - {id: 01K7QA1B2C3D4E5F6G7H8J9K0M, label: Cafe friends, deadline_at: 1761000000000, created_at: 1760000000000, revoked_at: null, note_count: 3}
                      next_id: ""
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note-collection/revoke:
    post:
      operationId: revokeNoteCollection
      tags: [notes]
      summary: Revoke a collection link
      description: >-
        Called by the signed-in owner to stop a link. Sets `revoked_at`; the link stops working at once and never becomes active
        again, but its notes are kept. Idempotent: repeating it succeeds and keeps the first `revoked_at`, so a lost answer can be
        retried. A missing link and someone else's both answer `ERROR_NOT_FOUND`. A request with the session cookie must come from
        an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The link does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteCollectionRevokeRequest"}
            examples:
              revoke: {value: {id: 01K7QA1B2C3D4E5F6G7H8J9K0M}}
      responses:
        "200":
          description: Revoked (or already revoked).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                revoked: {value: {status: OK, data: {}}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note/get-list:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List a yearbook's notes for moderation
      description: >-
        Called by the signed-in owner's inbox. Returns one page of the notes of a yearbook and, in `counts`, the number of notes
        of the whole book per status (for the tabs and the header), whatever the filter. `status` is optional: `pending` (not
        looked at yet), `approved` (in the book) or `hidden`; omitted means all. `status=approved` is in book order (`position`
        1, 2, 3 ...); every other value is newest first. `limit` defaults to 50, at most 100 (`ERROR_PARAM` above). `next_id` is
        the opaque cursor of the previous page, bound to this yearbook and this `status`; a malformed, tampered or foreign one is
        `ERROR_PARAM`. Items carry the answers as stored (the display name is `answers.name`, the client falls back to
        "Anonymous"), photo ids only (content through `media/get-content`), the label of the link the note arrived through, and
        no token. Needs a verified email (`ERROR_EMAIL_NOT_VERIFIED`). A missing yearbook and one owned by someone else both
        answer `ERROR_NOT_FOUND`. Safe to repeat.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: yearbook_id, in: query, required: true, schema: {type: string}, description: Yearbook ULID.}
        - {name: status, in: query, required: false, schema: {type: string, enum: [pending, approved, hidden]}, description: "Only notes in this status; omitted means all. `approved` is in book order, the others newest first."}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}, description: Page size.}
        - {name: next_id, in: query, required: false, schema: {type: string}, description: "Opaque cursor from the previous page's `next_id`; omit for the first page."}
      responses:
        "200":
          description: One page of notes and the counts of the whole yearbook.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteListResponse"}
              examples:
                approved:
                  value:
                    status: OK
                    data:
                      items:
                        - {id: 01K7QB1B2C3D4E5F6G7H8J9K0M, status: approved, answers: {name: Minh Khoa, relationship: Classmate, message: Thanks for everything}, photos: [{id: 01K7QC1B2C3D4E5F6G7H8J9K0M}], link_label: Cafe friends, created_at: 1760000100000, position: 1}
                      next_id: ""
                      counts: {all: 5, pending: 1, approved: 3, hidden: 1}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note/batch-update-status:
    post:
      operationId: updateNoteStatus
      tags: [notes]
      summary: Approve, hide or reset the status of up to 100 notes
      description: >-
        Called by the owner's inbox. Sets `status` (`pending`, `approved` or `hidden`; anything else is `ERROR_PARAM`) on 1 to 100
        notes of one yearbook (`ids` must not repeat; more than 100 is `ERROR_TOO_MANY_IDS`). All or nothing, in one transaction:
        if any id is not a note of that yearbook, or of someone else's, the whole batch is `ERROR_NOT_FOUND` and nothing changes.
        Approving appends the notes to the end of the approved order in the order of `ids`; a note that is already approved keeps
        its place. Hiding or setting a note to `pending` removes its position and closes the gap, so positions of approved notes
        are always 1..n. One note is a batch of one. Setting the status a note already has changes nothing and succeeds, so a
        lost answer can be retried. Returns the new `counts`. Needs a verified email. At most 120 moderation writes per user per
        minute (`ERROR_RATE_LIMITED`, with `Retry-After`). A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook, or at least one of the ids, does not exist or belongs to someone else; nothing was changed.}
        - {code: ERROR_TOO_MANY_IDS, description: More than 100 ids.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_RATE_LIMITED, description: "More than 120 moderation writes in a minute. Retry after `Retry-After`."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteUpdateStatusRequest"}
            examples:
              approve:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, ids: [01K7QB1B2C3D4E5F6G7H8J9K0M, 01K7QB2B2C3D4E5F6G7H8J9K0M], status: approved}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteCountsResponse"}
              examples:
                updated:
                  value: {status: OK, data: {counts: {all: 5, pending: 0, approved: 4, hidden: 1}}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note/reorder:
    post:
      operationId: reorderNotes
      tags: [notes]
      summary: Put the approved notes in a new order
      description: >-
        Called by the owner's inbox after a drag. `ids` must be exactly the notes that are approved right now, in the wanted order
        (at most 300; a repeated id is `ERROR_PARAM`, more than 300 is `ERROR_TOO_MANY_IDS`). If the approved set differs, for
        example a note was approved or hidden meanwhile, or an id is not an approved note of the yearbook, the answer is
        `ERROR_ORDER_STALE` (409), nothing changes and the client reloads the list. Positions stay 1..n. Repeating a successful
        reorder succeeds. An empty `ids` is valid when no note is approved. Needs a verified email. At most 120 moderation writes
        per user per minute. A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else.}
        - {code: ERROR_ORDER_STALE, description: "`ids` is not exactly the set of approved notes; nothing was changed. Reload the list."}
        - {code: ERROR_TOO_MANY_IDS, description: More than 300 ids.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_RATE_LIMITED, description: "More than 120 moderation writes in a minute. Retry after `Retry-After`."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteReorderRequest"}
            examples:
              reorder:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, ids: [01K7QB2B2C3D4E5F6G7H8J9K0M, 01K7QB1B2C3D4E5F6G7H8J9K0M]}
      responses:
        "200":
          description: Reordered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                reordered: {value: {status: OK, data: {}}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note/batch-delete:
    post:
      operationId: deleteNotes
      tags: [notes]
      summary: Delete up to 100 notes with their photos
      description: >-
        Called by the owner's inbox (the web delays the call so the owner can undo, see T-017). Deletes 1 to 100 notes of one
        yearbook (`ids` must not repeat; more than 100 is `ERROR_TOO_MANY_IDS`) and their photos: the stored objects first, then
        the note, note-photo and photo rows in one transaction. Hard delete, there is no undo on the server. All or nothing: any id
        that is not a note of that yearbook, or of someone else's, is `ERROR_NOT_FOUND` for the whole batch. If the object store
        fails the answer is `ERROR_STORAGE_ERROR` (502) and the notes are still there: retry the same call. Notes that were already
        deleted are `ERROR_NOT_FOUND`, so after a lost answer the client reloads. The positions of the remaining approved notes
        close up. A photo that is also the yearbook's cover or profile photo is cleared there. Returns the new `counts`. Needs a
        verified email. At most 120 moderation writes per user per minute. A request with the session cookie must come from an
        allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook, or at least one of the ids, does not exist or belongs to someone else; nothing was deleted.}
        - {code: ERROR_TOO_MANY_IDS, description: More than 100 ids.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_RATE_LIMITED, description: "More than 120 moderation writes in a minute. Retry after `Retry-After`."}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; nothing was changed, retry later.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteDeleteRequest"}
            examples:
              delete:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, ids: [01K7QB1B2C3D4E5F6G7H8J9K0M]}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteCountsResponse"}
              examples:
                deleted:
                  value: {status: OK, data: {counts: {all: 4, pending: 0, approved: 3, hidden: 1}}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/public-collect/get:
    get:
      operationId: getPublicCollect
      tags: [notes]
      summary: Look up a collection link (public)
      description: >-
        Called by the public note form (a friend's browser) when the page opens. No session is needed and none is read; no cookie
        is set and no CORS headers are sent. An unknown, malformed, missing or revoked `token` all answer the same `ERROR_NOT_FOUND`.
        Once the deadline has passed the answer is `ERROR_COLLECTION_CLOSED`. The answer also carries `fields`, the questions of the
        note form in order, so the page can render the form. Only requests that miss (unknown, malformed or revoked token) count
        against the tight limit of 60 per client IP per 15 minutes, so a class behind one address can open the same link; all requests
        together are capped at 600 per client IP per 15 minutes (`ERROR_RATE_LIMITED`, with `Retry-After`: wait that many seconds).
        The token is a credential in the URL: the access log records the route only, never the query string.
      x-auth: public
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The token is missing, malformed, unknown or revoked; the four cannot be told apart."}
        - {code: ERROR_COLLECTION_CLOSED, description: The deadline of the link has passed.}
        - {code: ERROR_RATE_LIMITED, description: "Too many requests from this client IP; wait `Retry-After` seconds."}
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}, description: The link token, a bearer secret of 32 base64url characters.}
      responses:
        "200":
          description: The link is active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicCollectGetResponse"}
              examples:
                open:
                  value:
                    status: OK
                    data:
                      yearbook: {title: Class 12A}
                      owner: {display_name: Linh}
                      deadline_at: 1761000000000
                      open: true
                      fields:
                        - {id: name, kind: short_text, label: {en: Your name, vi: Tên của bạn}, hint: {en: "", vi: ""}, required: true, max_length: 60}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "410": {$ref: "#/components/responses/ApiGone"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
  /api/public-collect/submit-note:
    post:
      operationId: submitPublicCollectNote
      tags: [notes]
      summary: Submit a note through a collection link (public)
      description: >-
        Called by the public note form (a friend's browser). A friend sends answers to the form fields (`fields` of
        the lookup) and up to three photos, without an account, as `multipart/form-data`; the link `token` is the query parameter
        `token` (the one exception to "parameters go in the body": the link is checked before the body is read, so a request with an
        unknown token costs no disk and no connection time). The note is stored as `pending` for the owner to moderate; nothing about it is returned except its id. No session is read,
        no cookie is set, no CORS headers are sent, and neither the client IP nor the user agent is stored. The body is spooled to a
        temporary file on the server while it arrives (nothing is decoded and no image-processing slot is held during the upload); the
        server removes the file in every case. The link is resolved first: `ERROR_NOT_FOUND` for an unknown, malformed, missing or revoked token is answered at once without
        reading the body (a client that is still uploading may see the connection reset instead of the answer). The other rejections
        (`ERROR_COLLECTION_CLOSED` after the deadline, `ERROR_RATE_LIMITED`, then the note limit and the text: `ERROR_PARAM`, ...) are sent
        only after the rest of the body has been read, so a browser can show them. Send
        `answers` before the first `photos` part (otherwise `ERROR_PARAM`). Unknown parts are ignored. A body that delivers no byte for 10
        seconds, or averages under 16 KiB/s once 15 seconds have passed, or takes over 120 seconds, is dropped (`ERROR_REQUEST_TIMEOUT`,
        nothing stored).


        Answers are validated against the set of fields in force at submission time (text rules of `docs/note-fields.md`: NFC, trimmed,
        control and format characters rejected except ZWJ and variation selectors, limits in characters). Each photo goes through the same
        pipeline as owner uploads (content sniffing, decode limits, metadata stripped, display, print and thumbnail versions); a rejected
        photo rejects the whole submission and nothing is stored. Photos are processed one at a time, each waiting up to 10 seconds for a
        free image-processing slot. A submission is refused at once, before any byte of the body is read, with `ERROR_BUSY` and a
        `Retry-After` of 2 to 6 seconds (random) when the server already has `SMEM_PUBLIC_UPLOAD_MAX_CONNS` uploads in progress or the
        client IP has `SMEM_PUBLIC_UPLOAD_CONCURRENT_PER_IP`; `ERROR_BUSY` is also the answer when no processing slot frees up in 10
        seconds. A `503` costs the client nothing against the request limits below. The server does not read the body of an immediate
        `503`, so a client that is still uploading may see the connection reset instead of the answer: treat a network error exactly
        like `503` and retry with the same data. Retrying after any other failure may store a second note; a success is final.


        Limits: request body 32 MiB, each photo `SMEM_MEDIA_MAX_BYTES` (default 10 MiB), `answers` 16 KiB, 300 notes per link in any status,
        the yearbook's photo quota. Submissions that passed text validation are counted per client IP (100 per hour, 300 per day) and per
        link (60 per hour): `ERROR_RATE_LIMITED` with `Retry-After`. A non-empty `website` field is a honeypot: the answer is a normal
        success and nothing is stored.
      x-auth: public
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The token is missing, malformed, unknown or revoked; the four cannot be told apart."}
        - {code: ERROR_COLLECTION_CLOSED, description: The deadline of the link has passed.}
        - {code: ERROR_COLLECTION_FULL, description: The link already holds 300 notes.}
        - {code: ERROR_MISSING_ANSWER, description: "A required field is missing or blank; the message names the field id, never the value."}
        - {code: ERROR_INVALID_ANSWER, description: "An answer breaks the text rules or the field's length limit; the message names the field id, never the value."}
        - {code: ERROR_TOO_MANY_PHOTOS, description: More than three photos were sent.}
        - {code: ERROR_INVALID_IMAGE, description: "A photo is corrupt, over 12000 px on a side, over 50 megapixels for JPEG or 25 megapixels for PNG and WebP, or its estimated decoded size is over 128 MiB."}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: The request is not multipart/form-data, or a photo is not a JPEG, PNG or WebP image.}
        - {code: ERROR_VERIFICATION_FAILED, description: The abuse check refused the submission.}
        - {code: ERROR_QUOTA_EXCEEDED, description: The yearbook's photo quota is reached.}
        - {code: ERROR_TOO_LARGE, description: The request body is over 32 MiB or a photo is over the per-photo cap.}
        - {code: ERROR_REQUEST_TIMEOUT, description: "No body byte arrived for 10 seconds, the average rate stayed under 16 KiB/s after 15 seconds, or the upload took over 120 seconds; nothing was stored."}
        - {code: ERROR_RATE_LIMITED, description: "Too many requests from this client IP or for this link; wait `Retry-After` seconds."}
        - {code: ERROR_BUSY, description: "The upload slots or the image-processing slots are full; retry after `Retry-After`."}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; nothing was kept, retry later.}
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}, description: The link token, a bearer secret of 32 base64url characters. Never logged.}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/PublicCollectSubmitNoteRequest"}
            examples:
              textOnly:
                value: {answers: '{"name":"Linh","message":"Nhớ các bạn nhiều 🎓"}'}
      responses:
        "200":
          description: Stored as pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicCollectSubmitNoteResponse"}
              examples:
                stored:
                  value: {status: OK, data: {id: 01K7QB4C5D6E7F8G9H0J1K2M3N}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "408": {$ref: "#/components/responses/ApiRequestTimeout"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "410": {$ref: "#/components/responses/ApiGone"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiBusy"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: smem_session
      description: >-
        HttpOnly, SameSite=Lax, Path=/, Max-Age 30 days, Secure except when SMEM_ENV=dev.
        State-changing requests that carry it must come from an origin in SMEM_ALLOWED_ORIGINS.
  headers:
    SessionCookie:
      description: >-
        `smem_session=<32 random bytes, base64url>; Path=/; Max-Age=2592000; HttpOnly; SameSite=Lax`
        (plus `Secure` unless SMEM_ENV=dev). Only the token's SHA-256 is stored server-side.
      schema: {type: string}
  responses:
    NotFound:
      description: No route matches this path. Error code `not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Wrong HTTP method for this path. Error code `method_not_allowed`.
      headers:
        Allow:
          description: Methods this path accepts.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ApiBadRequest:
      description: >-
        `ERROR_PARAM` (malformed body or query, unknown field, wrong type, a missing required parameter) or one of the field-level
        codes listed in the operation's `x-error-codes`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiUnauthorized:
      description: No, unknown or expired session (`ERROR_UNAUTHORIZED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiForbidden:
      description: A business code listed in the operation's `x-error-codes` (for example `ERROR_CSRF_ORIGIN_MISMATCH`, `ERROR_EMAIL_NOT_VERIFIED`, `ERROR_VERIFICATION_FAILED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiNotFound:
      description: "`ERROR_NOT_FOUND`: the thing does not exist or is not the caller's; the two cannot be told apart."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiConflict:
      description: A business code listed in the operation's `x-error-codes` (`ERROR_LIMIT_REACHED`, `ERROR_COLLECTION_FULL`, `ERROR_QUOTA_EXCEEDED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiGone:
      description: The deadline of the link has passed (`ERROR_COLLECTION_CLOSED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiRequestTimeout:
      description: The request body arrived too slowly (`ERROR_REQUEST_TIMEOUT`); nothing was stored.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiTooLarge:
      description: The body, or a photo in it, is over its cap (`ERROR_TOO_LARGE`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiUnsupportedMediaType:
      description: The Content-Type is not the one the operation takes, or a photo is not a JPEG, PNG or WebP image (`ERROR_UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiRateLimited:
      description: Too many requests (`ERROR_RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds until the oldest counted request leaves the window.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiInternal:
      description: Unexpected failure (`ERROR_INTERNAL`); nothing was kept.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiBadGateway:
      description: The object store failed (`ERROR_STORAGE_ERROR`); nothing was changed, retry later.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiBusy:
      description: The upload slots or the image-processing slots are full (`ERROR_BUSY`); retry after `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiAuthUnavailable:
      description: >-
        A Redis-backed store or the hashing pool could not serve the request, so it failed closed and nothing was accepted: `ERROR_BUSY`, `ERROR_LIMITER_UNAVAILABLE`,
        `ERROR_CODE_STORE_UNAVAILABLE` or `ERROR_SESSION_STORE_UNAVAILABLE`. Retry after `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiSessionStoreUnavailable:
      description: >-
        Redis, which holds the login sessions, did not answer (`ERROR_SESSION_STORE_UNAVAILABLE`). Sessions have no copy elsewhere, so
        the request fails closed. Retry after `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
  schemas:
    User:
      type: object
      description: The signed-in account. Fields are only ever added (the username arrives with T-081).
      required: [id, email, email_verified, display_name, locale, created_at]
      properties:
        id: {type: string, description: "The account's public id, a ULID. Always present.", examples: ["01J9Z3K6V8Q4M7N2P5R8T0W1XY"]}
        email: {type: string, description: "The normalised (trimmed, lower-cased, NFC) address. Always present."}
        email_verified: {type: boolean, description: "True once the 6-digit code was confirmed (or Google vouched for the address). Always present."}
        display_name: {type: string, description: "1-100 characters, NFC. Always present."}
        locale: {type: string, enum: [en, vi], description: "UI language and language of the emails: `en` English, `vi` Vietnamese. Always present."}
        created_at: {type: integer, format: int64, description: "When the account was created, Unix ms. Always present."}
    UserResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/User"}
    ResendVerificationResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: What the call did.
          required: [already_verified]
          properties:
            already_verified: {type: boolean, description: "True when the address was already verified and nothing was sent; false when a new code was emailed."}
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          maxLength: 254
          description: >-
            Required. Trimmed, lower-cased and normalised to Unicode NFC, so NFC and NFD spellings of one address are the same account (also at login). The local part (before the last `@`)
            is at most 64 bytes, and the address contains no control (Cc) or format (Cf) characters; otherwise `ERROR_INVALID_EMAIL`.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          description: >-
            Required. Normalised to Unicode NFKC before the length rules (counted in characters after normalisation) and before hashing, so NFC and NFD forms of the same password are equal.
            Must differ from the email (case-insensitive); otherwise `ERROR_WEAK_PASSWORD`.
        display_name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Required. Normalised to Unicode NFC, then trimmed; stored and returned in that form. Control characters (Cc), format characters (Cf: zero-width space, bidi overrides and isolates,
            LRM/RLM, BOM) except U+200D (zero-width joiner, used in emoji sequences), and line or paragraph separators (Zl, Zp) are rejected with `ERROR_INVALID_DISPLAY_NAME`.
        locale:
          type: [string, "null"]
          enum: [en, vi, null]
          default: en
          description: >-
            Optional. The student's UI language; it selects the language of the verification email. Absent or `null` means `en`; any other value (including another case such as `VI`,
            or a non-string) is `ERROR_INVALID_LOCALE` and nothing is created.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, maxLength: 254, description: "Required. Trimmed, lower-cased and NFC-normalised as at registration, so either Unicode spelling signs in."}
        password: {type: string, format: password, description: "Required. Normalised to Unicode NFKC before verification, exactly as at registration."}
    VerifyEmailRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: "^[0-9]{6}$", description: "Required. The 6-digit code from the verification email; anything else is `ERROR_INVALID_CODE`.", examples: ["042917"]}
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, maxLength: 254, description: "Required. Trimmed, lower-cased and NFC-normalised like at login."}
    ResetPasswordRequest:
      type: object
      required: [email, code, password]
      properties:
        email: {type: string, maxLength: 254, description: "Required. The address the reset code was sent to, normalised like at login."}
        code: {type: string, pattern: "^[0-9]{6}$", description: "Required. The 6-digit code from the reset email, valid 15 minutes.", examples: ["042917"]}
        password: {type: string, format: password, minLength: 10, maxLength: 128, description: "Required. The new password; same rules as at registration (NFKC, 10-128 characters, not the email)."}
    Profile:
      type: object
      description: The owner's profile page information of one yearbook.
      required: [id, is_owner, full_name, nickname, birthday, quote, hobbies, future_plans, photo_media_id]
      properties:
        id: {type: string, description: "Profile ULID."}
        is_owner: {type: boolean, description: "Always true: this is the profile of the book's owner."}
        full_name: {type: string, description: "The name on the profile page, 1 to 100 characters. A new book starts with the user's display name."}
        nickname: {type: string, description: "Up to 50 characters; the empty string when not set."}
        birthday: {type: [string, "null"], format: date, description: "`YYYY-MM-DD` calendar date (not an instant, so not Unix ms); null when not set."}
        quote: {type: string, description: "Up to 500 characters; the empty string when not set."}
        hobbies: {type: string, description: "Up to 300 characters; the empty string when not set."}
        future_plans: {type: string, description: "Up to 300 characters; the empty string when not set."}
        photo_media_id: {type: [string, "null"], description: "Photo ULID (a photo of this yearbook) shown on the profile page, or null."}
    Yearbook:
      type: object
      description: A yearbook with its owner profile. Carries no internal id.
      required: [id, title, school_name, class_name, graduation_year, motto, language, page_size, template_id, cover_media_id, created_at, updated_at, profile]
      properties:
        id: {type: string, description: "Yearbook ULID; use it as `id` or `yearbook_id` of the other calls."}
        title: {type: string, description: "1 to 120 characters."}
        school_name: {type: string, description: "Up to 120 characters; the empty string when not set."}
        class_name: {type: string, description: "Up to 120 characters; the empty string when not set."}
        graduation_year: {type: [integer, "null"], description: "Year from 1950 to 2100; null when not set."}
        motto: {type: string, description: "Up to 200 characters; the empty string when not set."}
        language: {type: string, enum: [en, vi], description: "Language of the book's pages: `en` English, `vi` Vietnamese."}
        page_size: {type: string, enum: [A5, A4, Letter], description: "Paper size of the printed book: `A5` (default), `A4` or `Letter`."}
        template_id: {type: [string, "null"], description: "Template ULID; null until a template is chosen."}
        cover_media_id: {type: [string, "null"], description: "Photo ULID (a photo of this yearbook) used as the cover, or null."}
        created_at: {type: integer, format: int64, description: "Creation time, Unix ms."}
        updated_at: {type: integer, format: int64, description: "Last edit of the book or its profile, Unix ms; the list is ordered by it."}
        profile: {$ref: "#/components/schemas/Profile"}
    YearbookResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: "Always `OK` on success."}
        data: {$ref: "#/components/schemas/Yearbook"}
    YearbookListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: "Always `OK` on success."}
        data:
          type: object
          description: One page of yearbooks.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The books of this page, newest `updated_at` first; an empty array when the user has none.
              items: {$ref: "#/components/schemas/Yearbook"}
            next_id: {type: string, description: "Opaque page token for the next page; the empty string on the last page."}
    YearbookCreateRequest:
      type: object
      additionalProperties: false
      required: [title, language]
      properties:
        title: {type: string, minLength: 1, maxLength: 120, description: "Required. 1 to 120 characters after trimming."}
        school_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; default empty."}
        class_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; default empty."}
        graduation_year: {type: [integer, "null"], minimum: 1950, maximum: 2100, description: "Optional, 1950 to 2100; default null."}
        motto: {type: string, maxLength: 200, description: "Optional, up to 200 characters; default empty."}
        language: {type: string, enum: [en, vi], description: "Required. `en` English or `vi` Vietnamese."}
        page_size: {type: string, enum: [A5, A4, Letter], default: A5, description: "Optional paper size, default `A5`."}
    YearbookUpdateRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, description: "Required. ULID of the yearbook to change."}
        title: {type: string, minLength: 1, maxLength: 120, description: "Optional. 1 to 120 characters after trimming; absent = unchanged."}
        school_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; the empty string clears it; absent = unchanged."}
        class_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; the empty string clears it; absent = unchanged."}
        graduation_year: {type: [integer, "null"], minimum: 1950, maximum: 2100, description: "Optional, 1950 to 2100; null clears it; absent = unchanged."}
        motto: {type: string, maxLength: 200, description: "Optional, up to 200 characters; the empty string clears it; absent = unchanged."}
        language: {type: string, enum: [en, vi], description: "Optional. `en` or `vi`; absent = unchanged."}
        page_size: {type: string, enum: [A5, A4, Letter], description: "Optional paper size; absent = unchanged."}
        cover_media_id: {type: [string, "null"], description: "Optional. Photo ULID, which must be a photo of this yearbook (else `ERROR_INVALID_MEDIA`); null clears the cover; absent = unchanged."}
    YearbookUpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id, full_name]
      properties:
        yearbook_id: {type: string, description: "Required. ULID of the yearbook whose profile is replaced."}
        full_name: {type: string, minLength: 1, maxLength: 100, description: "Required. 1 to 100 characters after trimming."}
        nickname: {type: string, maxLength: 50, description: "Optional, up to 50 characters; omitted = cleared."}
        birthday: {type: [string, "null"], format: date, description: "Optional `YYYY-MM-DD`, a real date strictly before today (UTC) and not before 1900-01-01; omitted or null = cleared."}
        quote: {type: string, maxLength: 500, description: "Optional, up to 500 characters; omitted = cleared."}
        hobbies: {type: string, maxLength: 300, description: "Optional, up to 300 characters; omitted = cleared."}
        future_plans: {type: string, maxLength: 300, description: "Optional, up to 300 characters; omitted = cleared."}
        photo_media_id: {type: [string, "null"], description: "Optional. Photo ULID, which must be a photo of this yearbook (else `ERROR_INVALID_MEDIA`); omitted or null = cleared."}
    YearbookDeleteRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, description: "Required. ULID of the yearbook to delete."}
    Media:
      type: object
      description: A stored photo. Carries no storage key, hash or URL; the client builds the content URL from `id`.
      required: [id, yearbook_id, content_type, bytes, width, height, created_at]
      properties:
        id: {type: string, description: "Photo ULID; use it as `id` of get-content and delete."}
        yearbook_id: {type: string, description: Yearbook ULID the photo belongs to.}
        content_type: {type: string, description: "MIME type of the display version: `image/jpeg`, or `image/png` for a photo with transparency."}
        bytes: {type: integer, description: Size in bytes of the stored display version.}
        width: {type: integer, description: Width in pixels of the stored display version.}
        height: {type: integer, description: Height in pixels of the stored display version.}
        created_at: {type: integer, format: int64, description: "Upload time, Unix ms."}
    MediaResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/Media"}
    MediaListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: One page of photos.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The photos of this page, newest first.
              items: {$ref: "#/components/schemas/Media"}
            next_id: {type: string, description: "Opaque page token for the next page; the empty string on the last page."}
    MediaCreateRequest:
      type: object
      required: [yearbook_id, file]
      properties:
        yearbook_id: {type: string, description: Required. ULID of a yearbook the caller owns, at most 64 characters.}
        file: {type: string, format: binary, description: "Required. The image: JPEG, PNG or WebP, at most `SMEM_MEDIA_MAX_BYTES` (default 10 MiB)."}
    MediaDeleteRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, description: Required. ULID of the photo to delete.}
    ApiError:
      type: object
      description: >-
        The v2 error envelope (docs/api-contract.md section 2). The HTTP status is kept as well; `status` is the contract clients
        localise on.
      required: [status, error_message, request_id]
      properties:
        status:
          type: string
          description: The error code, `ERROR_` + SCREAMING_SNAKE_CASE. Never `OK` here.
          examples: [ERROR_NOT_FOUND]
        error_message:
          type: string
          description: English text for logs and support; never shown to people and never contains secrets.
        request_id:
          type: string
          description: Same value as the X-Request-Id response header; quote it to support.
    EmptyResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {type: object, description: Always an empty object., additionalProperties: false}
    NoteCollectionCreateRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id]
      properties:
        yearbook_id: {type: string, description: Required. ULID of a yearbook the caller owns.}
        label: {type: string, maxLength: 60, description: "Optional, default empty. At most 60 characters, NFC and trimmed, no control or format characters."}
        deadline_at: {type: [integer, "null"], format: int64, description: "Optional, default null (no deadline). Unix ms; must be in the future and at most one year ahead."}
    NoteCollectionCreateResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/NoteCollectionCreated"}
    NoteCollectionCreated:
      type: object
      description: The new link, with its token.
      required: [id, label, deadline_at, created_at, token]
      properties:
        id: {type: string, description: Collection ULID.}
        label: {type: string, description: The cleaned label; an empty string when none was given.}
        deadline_at: {type: [integer, "null"], format: int64, description: "Deadline, Unix ms; null when the link has none."}
        created_at: {type: integer, format: int64, description: "Creation time, Unix ms."}
        token: {type: string, description: "The bearer secret of the link, 32 base64url characters. Shown only in this response."}
    NoteCollection:
      type: object
      description: One link as the owner's list shows it. Never contains the token.
      required: [id, label, deadline_at, created_at, revoked_at, note_count]
      properties:
        id: {type: string, description: Collection ULID.}
        label: {type: string, description: The label; an empty string when none was given.}
        deadline_at: {type: [integer, "null"], format: int64, description: "Deadline, Unix ms; null when the link has none."}
        created_at: {type: integer, format: int64, description: "Creation time, Unix ms."}
        revoked_at: {type: [integer, "null"], format: int64, description: "When the owner revoked the link, Unix ms; null while it is active."}
        note_count: {type: integer, minimum: 0, description: Number of notes of the link in any status.}
    NoteCollectionListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The page; the list is returned whole, so it is always the only page.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The links, newest first.
              items: {$ref: "#/components/schemas/NoteCollection"}
            next_id: {type: string, description: Opaque cursor; always the empty string (no more pages).}
    NoteCollectionRevokeRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, description: Required. ULID of a collection of one of the caller's yearbooks.}
    NoteCounts:
      type: object
      description: The notes of a whole yearbook by status.
      required: [all, pending, approved, hidden]
      properties:
        all: {type: integer, minimum: 0, description: Notes in any status (the sum of the three below).}
        pending: {type: integer, minimum: 0, description: Notes the owner has not looked at yet.}
        approved: {type: integer, minimum: 0, description: Notes that are in the book.}
        hidden: {type: integer, minimum: 0, description: Notes the owner hid.}
    NoteCountsResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The counts after the change.
          required: [counts]
          properties:
            counts: {$ref: "#/components/schemas/NoteCounts"}
    NoteItem:
      type: object
      description: One note as the owner sees it.
      required: [id, status, answers, photos, link_label, created_at, position]
      properties:
        id: {type: string, description: "The note's public id, a ULID."}
        status: {type: string, enum: [pending, approved, hidden], description: "`pending` not looked at yet, `approved` in the book, `hidden` kept out of it."}
        answers:
          type: object
          description: The friend's answers as stored, field id to text (`name`, `relationship`, `message`, ...; docs/note-fields.md). The display name is `answers.name`; the client shows "Anonymous" when it is missing.
          additionalProperties: {type: string}
        photos:
          type: array
          description: The note's photos in order (at most 3). Content is read with `GET /api/media/get-content?id=`.
          items:
            type: object
            required: [id]
            properties:
              id: {type: string, description: "The photo's public id, a ULID."}
        link_label: {type: string, description: Label of the collection link the note came through; empty when the link had none.}
        created_at: {type: integer, format: int64, description: "When the friend sent the note, Unix ms."}
        position: {type: [integer, "null"], minimum: 1, description: "1-based place among the approved notes; null unless `status` is `approved`."}
    NoteListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: One page of notes and the counts of the whole yearbook.
          required: [items, next_id, counts]
          properties:
            items:
              type: array
              description: "The notes: book order for `status=approved`, newest first otherwise."
              items: {$ref: "#/components/schemas/NoteItem"}
            next_id: {type: string, description: "Opaque cursor for the next page; the empty string on the last page."}
            counts: {$ref: "#/components/schemas/NoteCounts"}
    NoteUpdateStatusRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id, ids, status]
      properties:
        yearbook_id: {type: string, description: Required. ULID of a yearbook the caller owns.}
        ids:
          type: array
          description: "Required. 1 to 100 note ULIDs of that yearbook, no repeats. When approving, the order sets the order at the end of the book."
          minItems: 1
          maxItems: 100
          items: {type: string}
        status: {type: string, enum: [pending, approved, hidden], description: "Required. The status to set: `pending`, `approved` or `hidden`."}
    NoteReorderRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id, ids]
      properties:
        yearbook_id: {type: string, description: Required. ULID of a yearbook the caller owns.}
        ids:
          type: array
          description: "Required. Exactly the ULIDs of the notes that are approved now, in the wanted order, no repeats. At most 300; may be empty only when no note is approved."
          maxItems: 300
          items: {type: string}
    NoteDeleteRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id, ids]
      properties:
        yearbook_id: {type: string, description: Required. ULID of a yearbook the caller owns.}
        ids:
          type: array
          description: "Required. 1 to 100 note ULIDs of that yearbook, no repeats."
          minItems: 1
          maxItems: 100
          items: {type: string}
    PublicCollectGetResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/PublicCollect"}
    PublicCollect:
      type: object
      description: What a visitor with a valid link may learn.
      required: [yearbook, owner, deadline_at, open, fields]
      properties:
        yearbook:
          type: object
          description: The yearbook the notes are for.
          required: [title]
          properties:
            title: {type: string, description: The yearbook's title.}
        owner:
          type: object
          description: The person who made the link.
          required: [display_name]
          properties:
            display_name: {type: string, description: The owner's display name.}
        deadline_at: {type: [integer, "null"], format: int64, description: "Deadline, Unix ms; null when the link has none."}
        open: {type: boolean, const: true, description: Always true; a closed link answers `ERROR_COLLECTION_CLOSED` instead.}
        fields:
          type: array
          description: The questions of the note form, in order.
          items: {$ref: "#/components/schemas/NoteField"}
    NoteField:
      type: object
      description: One question of the note form.
      required: [id, kind, label, hint, required, max_length]
      properties:
        id: {type: string, description: Field id; the key of the answer in `answers`., examples: [name]}
        kind: {type: string, enum: [short_text, long_text], description: "`short_text` is a single line, `long_text` may contain line breaks."}
        label: {$ref: "#/components/schemas/LocalizedText"}
        hint: {$ref: "#/components/schemas/LocalizedText"}
        required: {type: boolean, description: True when the answer must be present and not blank.}
        max_length: {type: integer, minimum: 1, description: Longest answer, in characters after normalisation.}
    LocalizedText:
      type: object
      description: A text in each supported language.
      required: [en, vi]
      properties:
        en: {type: string, description: English text.}
        vi: {type: string, description: Vietnamese text.}
    PublicCollectSubmitNoteRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: string
          description: >-
            Required. A JSON object `{"<field id>":"<text>"}` of at most 16 KiB. Keys must be fields of the form;
            required fields must be present and not blank. Send it before the first `photos` part.
          examples: ['{"name":"Linh","message":"Nhớ các bạn nhiều 🎓"}']
        photos:
          type: array
          maxItems: 3
          items: {type: string, format: binary}
          description: Optional. Up to three JPEG, PNG or WebP images (the content decides, not the name or Content-Type).
        website: {type: string, description: Honeypot. Leave empty; a non-empty value makes the answer a fake success.}
    PublicCollectSubmitNoteResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The stored note.
          required: [id]
          properties:
            id: {type: string, description: Note ULID.}
    Error:
      type: object
      description: >-
        Error envelope of the infrastructure probes only (/readyz, and the 404/405 of unknown root paths). Business routes use ApiError.
        `code` is a stable snake_case name; `message` is English text meant for logs.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              examples: [not_found, method_not_allowed, internal_error, not_ready]
            message:
              type: string
            request_id:
              type: string
              description: Same value as the X-Request-Id response header.
