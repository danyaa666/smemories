openapi: 3.1.0
info:
  title: SMemories API
  version: 0.1.0
  description: >-
    Hand-written contract for the SMemories API. Infrastructure routes (/healthz, /readyz) live at the
    root; every business route lives under /api/<namespace>/<action> (docs/api-contract.md).
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /readyz:
    get:
      operationId: getReady
      summary: Readiness probe (pings the database and Redis, 1 s timeout together)
      responses:
        "200":
          description: The database and Redis answered.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        "503":
          description: >-
            The database or Redis did not answer in time. Error code `ERROR_NOT_READY`; the body never
            carries driver error text (it is logged server-side).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account and sign in
      description: >-
        Called by the sign-up form. Creates the account and signs the caller in (the session cookie is set) and sends the 6-digit verification code by email.
        The email is trimmed, lower-cased and normalised to NFC; a duplicate (case-insensitive, and NFC/NFD spellings are the same address) is `ERROR_EMAIL_TAKEN`.
        Password: 10-128 characters after NFKC normalisation and not equal to the email. Display name: 1-100 characters after trimming, no control or format characters.
        Rate limit: 5 per hour per IP, counted once the input is valid. A cookie-less request needs no Origin; one that carries a session cookie must come from an allowed Origin.
        The account gets a default `username` (`user-` plus the last 8 characters of its id; longer slices on a clash, never an error). Not idempotent: a repeated call is `ERROR_EMAIL_TAKEN`. An unknown body field is `ERROR_PARAM`.
      x-auth: public
      x-error-codes:
        - {code: ERROR_INVALID_EMAIL, description: "Field `email`: not a single address, over 254 characters, local part over 64 bytes, or containing control or format characters."}
        - {code: ERROR_WEAK_PASSWORD, description: "Field `password`: fewer than 10 or more than 128 characters after normalisation, or equal to the email."}
        - {code: ERROR_INVALID_DISPLAY_NAME, description: "Field `display_name`: empty after trimming, over 100 characters, or containing control characters."}
        - {code: ERROR_INVALID_LOCALE, description: "Field `locale`: present but not `en` or `vi` (case-sensitive), or not a string."}
        - {code: ERROR_EMAIL_TAKEN, description: An account with this address already exists.}
        - {code: ERROR_RATE_LIMITED, description: "More than 5 registrations per hour from this IP; wait for `Retry-After` seconds."}
        - {code: ERROR_BUSY, description: "All password-hashing slots stayed taken for 2 seconds; retry after `Retry-After`."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; no account is created. Retry after `Retry-After`."}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
            examples:
              register:
                value: {email: lan@example.com, password: correct-horse-battery, display_name: "Nguyễn Thị Lan", locale: vi}
      responses:
        "200":
          description: Account created; the session cookie is set.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
              examples:
                created:
                  value: {status: OK, data: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, email: lan@example.com, email_verified: false, display_name: "Nguyễn Thị Lan", locale: vi, created_at: 1760000000000, username: user-8b0c1d2e, username_next_change_at: null}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiAuthUnavailable"}
  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      description: >-
        Called by the sign-in form. A wrong password, an unknown email and an account without a password (Google only) give the identical `ERROR_INVALID_CREDENTIALS`
        (same body, same work), so the answer never tells whether an address is registered. Every login issues a new session token; a session cookie sent with the
        request is revoked. Failures are limited to 10 per 15 minutes per IP and email and 100 per 15 minutes per IP (`ERROR_RATE_LIMITED`). The email is trimmed,
        lower-cased and NFC-normalised as at registration. Not idempotent (a new session each time). An unknown body field is `ERROR_PARAM`.
      x-auth: public
      x-error-codes:
        - {code: ERROR_INVALID_CREDENTIALS, description: Wrong email or password; the two cannot be told apart.}
        - {code: ERROR_RATE_LIMITED, description: "Too many failed sign-ins for this IP and email, or for this IP; wait for `Retry-After` seconds."}
        - {code: ERROR_BUSY, description: "All password-hashing slots stayed taken for 2 seconds; retry after `Retry-After`."}
        - {code: ERROR_LIMITER_UNAVAILABLE, description: "The sign-in lockout counters in Redis did not answer, so the attempt fails closed. Retry after `Retry-After`."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; no session is created. Retry after `Retry-After`."}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
            examples:
              login:
                value: {email: lan@example.com, password: correct-horse-battery}
      responses:
        "200":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
              examples:
                signedIn:
                  value: {status: OK, data: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, email: lan@example.com, email_verified: true, display_name: "Nguyễn Thị Lan", locale: vi, created_at: 1760000000000, username: user-8b0c1d2e, username_next_change_at: null}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401":
          description: Wrong email or password (`ERROR_INVALID_CREDENTIALS`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiError"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiAuthUnavailable"}
  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out (idempotent)
      description: >-
        Called by the sign-out button. Deletes the session and clears the cookie. Always succeeds, also when nobody is signed in or the session is already gone, so a lost
        response can simply be repeated. A request with the session cookie must come from an allowed Origin. Takes no body.
      x-auth: optional
      x-error-codes:
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer, so the session could not be deleted. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: Signed out; the cookie is cleared.
          headers:
            Set-Cookie:
              description: smem_session with an empty value and a negative Max-Age.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                signedOut:
                  value: {status: OK, data: {}}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm the signed-in user's email address with the 6-digit code from the verification email
      description: >-
        Called by the verification screen. The code is 6 decimal digits, valid 30 minutes, single use; there is one live code per user (a new one from registration or
        `/api/auth/resend-verification` replaces the old). Only the HMAC of the code is stored, in Redis. A wrong or missing code (or one that is not 6 digits) is
        `ERROR_INVALID_CODE`, a code past its lifetime `ERROR_CODE_EXPIRED`, and after 5 wrong attempts on one code it is `ERROR_CODE_LOCKED` until a new code is requested.
        An already verified user gets success without a check. Also limited to 20 attempts per hour per user. Idempotent once verified. In dev and test `SMEM_DEV_FIXED_OTP`
        makes one fixed code valid (docs/dev-shortcuts.md). A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_INVALID_CODE, description: The code is missing, not 6 digits, or wrong.}
        - {code: ERROR_CODE_EXPIRED, description: The code is past its 30-minute lifetime; request a new one.}
        - {code: ERROR_CODE_LOCKED, description: "5 wrong attempts were used on this code; request a new one."}
        - {code: ERROR_RATE_LIMITED, description: "More than 20 attempts per hour for this user; wait for `Retry-After` seconds."}
        - {code: ERROR_LIMITER_UNAVAILABLE, description: "The code-guess counter in Redis did not answer, so the attempt fails closed. Retry after `Retry-After`."}
        - {code: ERROR_CODE_STORE_UNAVAILABLE, description: "Redis, which holds the email codes, did not answer; nothing was accepted. Retry after `Retry-After`."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyEmailRequest"}
            examples:
              verify:
                value: {code: "042917"}
      responses:
        "200":
          description: The address is verified (`email_verified` is now true) and the code is used.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                verified:
                  value: {status: OK, data: {}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiAuthUnavailable"}
  /api/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Send a new verification code to the signed-in user
      description: >-
        Called by the "send a new code" button. At most 3 per hour per user (`ERROR_RATE_LIMITED` with `Retry-After`). The new code replaces the previous one, which stops
        working. A user whose address is already verified gets `already_verified: true` and nothing is sent. This is the one endpoint that waits for the mail provider
        (at most 10 seconds): a provider that is throttling or down is `ERROR_MAIL_UNAVAILABLE` (503 with `Retry-After`; the try is not counted), and an address the
        provider refuses is `ERROR_EMAIL_UNDELIVERABLE` (400, the address is the caller's own). Registration and forgot-password send in the background and never wait.
        Takes no body. A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_RATE_LIMITED, description: "More than 3 sends per hour for this user; wait for `Retry-After` seconds."}
        - {code: ERROR_CODE_STORE_UNAVAILABLE, description: "Redis, which holds the email codes, did not answer; nothing was sent. Retry after `Retry-After`."}
        - {code: ERROR_MAIL_UNAVAILABLE, description: "The mail provider is throttling, failing or timed out; nothing was sent and the try is not counted. Retry after `Retry-After`."}
        - {code: ERROR_EMAIL_UNDELIVERABLE, description: "The mail provider refused the address (invalid, on its suppression list, or sending is paused); retrying does not help."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The email was sent, or the address was already verified and nothing was sent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResendVerificationResponse"}
              examples:
                sent:
                  value: {status: OK, data: {already_verified: false}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiAuthUnavailable"}
  /api/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Ask for a password reset code by email
      description: >-
        Called by the "forgot password" form. Always succeeds with an empty `data` for a well-formed address, whether or not an account exists: the email (a 6-digit code
        valid 15 minutes, in the user's `locale`; a new request replaces the previous code) goes out in the background and only when the account exists, so neither the body
        nor the timing tells them apart (anti-enumeration). Limits: 5 per hour per IP and 3 per hour per address, counted for unknown addresses too. The address is trimmed,
        lower-cased and NFC-normalised like at login; one that is not an email at all is `ERROR_INVALID_EMAIL`. Idempotent for the caller (a repeat sends a fresh code).
        A request with the session cookie must come from an allowed Origin.
      x-auth: public
      x-error-codes:
        - {code: ERROR_INVALID_EMAIL, description: "Field `email`: not a single valid address."}
        - {code: ERROR_RATE_LIMITED, description: "More than 5 requests per hour from this IP or 3 for this address; wait for `Retry-After` seconds."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ForgotPasswordRequest"}
            examples:
              forgot:
                value: {email: lan@example.com}
      responses:
        "200":
          description: Accepted; a code was sent if the account exists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                accepted:
                  value: {status: OK, data: {}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
  /api/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with the 6-digit code from the reset email
      description: >-
        Called by the reset form. Checked in this order: the address format (`ERROR_INVALID_EMAIL`), 20 attempts per hour per IP (`ERROR_RATE_LIMITED`), the password rules
        (NFKC, 10-128 characters, not the email; a rejected password is `ERROR_WEAK_PASSWORD` and leaves the code untouched, so the answer cannot confirm a code), then the code.
        An unknown address, a wrong code and no live code all answer `ERROR_INVALID_CODE` with the same body (anti-enumeration); `ERROR_CODE_EXPIRED` and `ERROR_CODE_LOCKED`
        (5 wrong attempts) only for an account that has such a code. The code is valid 15 minutes and single use. On success every session of the user is deleted (sign in again).
        In dev and test `SMEM_DEV_FIXED_OTP` makes one fixed code valid for any existing account (docs/dev-shortcuts.md). Not idempotent: the code is used up.
       
      x-auth: public
      x-error-codes:
        - {code: ERROR_INVALID_EMAIL, description: "Field `email`: not a single valid address."}
        - {code: ERROR_WEAK_PASSWORD, description: "Field `password`: fewer than 10 or more than 128 characters after normalisation, or equal to the email."}
        - {code: ERROR_INVALID_CODE, description: "The code is missing, not 6 digits, wrong, or there is no live code (also for an unknown address)."}
        - {code: ERROR_CODE_EXPIRED, description: The code is past its 15-minute lifetime; request a new one.}
        - {code: ERROR_CODE_LOCKED, description: "5 wrong attempts were used on this code; request a new one."}
        - {code: ERROR_RATE_LIMITED, description: "More than 20 attempts per hour from this IP; wait for `Retry-After` seconds."}
        - {code: ERROR_BUSY, description: "All password-hashing slots stayed taken; the code is already used, ask for a new one. Retry after `Retry-After`."}
        - {code: ERROR_LIMITER_UNAVAILABLE, description: "The code-guess counter in Redis did not answer, so the attempt fails closed. Retry after `Retry-After`."}
        - {code: ERROR_CODE_STORE_UNAVAILABLE, description: "Redis, which holds the email codes, did not answer. Retry after `Retry-After`."}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "The sessions could not be deleted, so the password was not changed either. Retry after `Retry-After`."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResetPasswordRequest"}
            examples:
              reset:
                value: {email: lan@example.com, code: "042917", password: a-brand-new-passphrase}
      responses:
        "200":
          description: Password changed; all sessions are gone.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                changed:
                  value: {status: OK, data: {}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiAuthUnavailable"}
  /api/auth/google-start:
    get:
      operationId: googleStart
      tags: [auth]
      summary: Start Google sign-in (browser navigation, not a fetch call)
      description: >-
        Called by the "Continue with Google" link, which the browser follows; there is no JSON body. Only exists when the server has `SMEM_GOOGLE_CLIENT_ID` set; otherwise it is
        `ERROR_NOT_FOUND` (404). Redirects (302) to Google's authorization endpoint (authorization-code flow with PKCE S256, `state` and `nonce`, scope `openid email profile`)
        and sets the 10-minute `smem_oidc` cookie (HttpOnly, SameSite=Lax, signed) that binds the flow to this browser. `return_to` must be a same-site relative path (one leading `/`,
        at most 200 characters, no `//`, `/\`, scheme or control characters); anything else is replaced by `/`. If Google cannot be reached the answer is `302 /login?error=oidc_failed`.
        30 per 15 minutes per IP (`ERROR_RATE_LIMITED`).
      x-auth: public
      x-error-codes:
        - {code: ERROR_RATE_LIMITED, description: "More than 30 starts per 15 minutes from this IP; wait for `Retry-After` seconds."}
      security: []
      parameters:
        - {name: return_to, in: query, required: false, schema: {type: string, maxLength: 200}, description: "Same-site path to go to after sign-in, for example `/yearbooks`. Default and fallback `/`."}
      responses:
        "302":
          description: To Google (or to `/login?error=oidc_failed`).
          headers:
            Location: {schema: {type: string}, description: "Google's authorization URL, or `/login?error=oidc_failed`."}
            Set-Cookie:
              description: "`smem_oidc`, valid 10 minutes."
              schema: {type: string}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
  /api/auth/google-callback:
    get:
      operationId: googleCallback
      tags: [auth]
      summary: Google redirects the browser here after sign-in
      description: >-
        Called by Google through the browser, never by our web code; there is no JSON body. Only exists when Google sign-in is enabled (else `ERROR_NOT_FOUND`, 404). The redirect URI
        registered in the Google console is `<PUBLIC_BASE_URL>/api/auth/google-callback`. Success signs the user in (new `smem_session` cookie; a session cookie sent with the request is
        revoked) and redirects (302) to the `return_to` given at start. Linking: a known Google account signs in; the same verified email on a local account links to it; the same email on
        a local account that never verified it first loses its password and sessions, is marked verified and linked (pre-hijacking defence); an unknown email creates a password-less account.
        Every failure is `302 /login?error=<code>` and creates nothing: `oidc_state` (cookie missing, altered or expired, or `state` differs), `oidc_denied` (the provider reported an error),
        `oidc_failed` (code exchange or ID-token check failed, or no usable email), `email_unverified` (Google did not mark the email verified). Provider details are only logged.
        30 per 15 minutes per IP (`ERROR_RATE_LIMITED`).
      x-auth: public
      x-error-codes:
        - {code: ERROR_RATE_LIMITED, description: "More than 30 callbacks per 15 minutes from this IP; wait for `Retry-After` seconds."}
      security: []
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}, description: "Authorization code from Google."}
        - {name: state, in: query, required: false, schema: {type: string}, description: "The `state` we sent to Google; must equal the one in the `smem_oidc` cookie."}
        - {name: error, in: query, required: false, schema: {type: string}, description: "Set by Google when the user refused or the request failed; its text is never logged."}
      responses:
        "302":
          description: To `return_to` (signed in) or to `/login?error=<code>`.
          headers:
            Location: {schema: {type: string}, description: "The `return_to` path, or `/login?error=<code>`."}
            Set-Cookie:
              description: "`smem_session` on success; `smem_oidc` is always cleared."
              schema: {type: string}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
  /api/user/get-me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user
      description: >-
        Called on every page load as the session bootstrap; `ERROR_UNAUTHORIZED` (401) means signed out. Sliding expiry: once more than half of the 30-day session lifetime has elapsed the
        expiry is extended and the cookie is sent again. `username` is the public handle (D-28); `username_next_change_at` is when it may change again, `null` when a change is allowed now. Read-only and idempotent.
      x-auth: required
      x-error-codes:
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed (the caller is not treated as signed out). Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current user.
          headers:
            Set-Cookie:
              description: Present only when the session expiry was extended.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
              examples:
                me:
                  value: {status: OK, data: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, email: lan@example.com, email_verified: true, display_name: "Nguyễn Thị Lan", locale: vi, created_at: 1760000000000, username: user-8b0c1d2e, username_next_change_at: null}}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/user/update-username:
    post:
      operationId: updateUsername
      tags: [auth]
      summary: Change the signed-in user's public username
      description: >-
        Called by the profile form. The username is a unique, public handle (not a login name; sign-in stays email + password or Google). The input is trimmed and lower-cased,
        then must be 3-30 characters of `a-z 0-9 . _ -`, start and end with a letter or digit, and have no two special characters in a row (`ERROR_INVALID_USERNAME`).
        A fixed list (`admin`, `support`, `root`, `smemories`, ...) and every name starting with `user-` that is not the caller's own generated default are `ERROR_USERNAME_RESERVED`.
        A name already in use is `ERROR_USERNAME_TAKEN` (case-insensitive). A change is allowed once every 7 days after a user-made change (the first change from the default is
        allowed at once); a too-early change is `ERROR_USERNAME_CHANGE_TOO_SOON` with `Retry-After` in seconds and the allowed time in the message. Setting the current name again
        succeeds and does not start the cooldown. The cooldown check and the write are one conditional update, so concurrent requests cannot both pass. Taken, invalid and reserved
        attempts are limited to 20 per hour per user (`ERROR_RATE_LIMITED`) so the endpoint cannot be used to probe which names exist; successes, no-ops and cooldown answers do not
        count. Not idempotent in effect (it starts the cooldown). A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_INVALID_USERNAME, description: "Field `username`: not 3-30 characters of a-z 0-9 . _ - after trimming and lower-casing, or it starts or ends with a special character, or has two in a row."}
        - {code: ERROR_USERNAME_RESERVED, description: "Field `username`: on the reserved list, or a `user-` name that is not the caller's own default."}
        - {code: ERROR_USERNAME_TAKEN, description: "Another account already uses this username (case-insensitive)."}
        - {code: ERROR_USERNAME_CHANGE_TOO_SOON, description: "The last user-made change was less than 7 days ago; the message has the allowed time and `Retry-After` the seconds to wait."}
        - {code: ERROR_RATE_LIMITED, description: "More than 20 failed attempts (taken, invalid, reserved) in an hour for this user; wait for `Retry-After` seconds."}
        - {code: ERROR_LIMITER_UNAVAILABLE, description: "The failed-attempt counter in Redis did not answer, so the request fails closed. Retry after `Retry-After`."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateUsernameRequest"}
            examples:
              change:
                value: {username: lan.nguyen}
      responses:
        "200":
          description: The username is now the requested one (or already was); the body is the same user object as `get-me`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserResponse"}
              examples:
                changed:
                  value: {status: OK, data: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, email: lan@example.com, email_verified: true, display_name: "Nguyễn Thị Lan", locale: vi, created_at: 1760000000000, username: lan.nguyen, username_next_change_at: 1760604800000}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiAuthUnavailable"}
  /api/yearbook/create:
