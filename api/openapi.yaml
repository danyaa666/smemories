  /api/yearbook/delete:
    post:
      operationId: deleteYearbook
      tags: [yearbook]
      summary: Delete a yearbook
      description: >-
        Called by the signed-in owner (the edit screen). Hard-deletes the book with its profile, photos, note collections and notes. The stored files are removed
        from object storage first; if that fails the call answers `ERROR_STORAGE_ERROR` and nothing is deleted, so it can simply be repeated. After the
        files are gone one transaction removes the rows (all or nothing). Not idempotent: a book that is already deleted, a missing one and someone else's all answer
        `ERROR_NOT_FOUND`. A missing `id` and unknown fields are `ERROR_PARAM`. A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; the book is still there and the call can be repeated.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
