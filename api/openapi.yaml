        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note/reorder:
    post:
      operationId: reorderNotes
      tags: [notes]
      summary: Put the approved notes in a new order
      description: >-
        Called by the owner's inbox after a drag. `ids` must be exactly the notes that are approved right now, in the wanted order
        (at most 300; a repeated id is `ERROR_PARAM`, more than 300 is `ERROR_TOO_MANY_IDS`). If the approved set differs, for
        example a note was approved or hidden meanwhile, or an id is not an approved note of the yearbook, the answer is
