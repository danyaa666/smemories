  /api/class/get:
    get:
      operationId: getClass
      tags: [class]
      summary: Read one class with the caller's role
      description: >-
        Called by any member (the class screen). Returns the class, the caller's role in it (`my_role`), whether the caller has chosen their class page (`page_linked`) and, in `page`, the caller's own page status (the linked yearbook and two flags about it). Nobody else's page status is ever returned here. It never carries the roster, whatever the role: admins read it from `/api/class-member/get-list`.
