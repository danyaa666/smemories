openapi: 3.1.0
info:
  title: SMemories API
  version: 0.1.0
  description: >-
    Hand-written contract for the SMemories API. Infrastructure routes live at the
    root; business routes live under /api/<namespace>/<action> (v2, docs/api-contract.md) or,
    until epic E10 moves their domain, under /v1 (the web app reaches them as /api/v1/*).
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /readyz:
    get:
      operationId: getReady
      summary: Readiness probe (pings the database and Redis, 1 s timeout together)
      responses:
        "200":
          description: The database and Redis answered.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        "503":
          description: >-
            The database or Redis did not answer in time. Error code `not_ready`; the body never
            carries driver error text (it is logged server-side).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/register:
    post:
      operationId: register
      security: []
      tags: [auth]
      summary: Create an account and sign in
      description: >-
        Email is trimmed, lower-cased and normalised to NFC; a duplicate (case-insensitive, and
        NFC/NFD spellings are the same address) is `409 email_taken`. Password: 10-128 characters
        and not equal to the email. Display name: 1-100 characters after trimming, no control or
        format characters (see the field). Rate limit: 5 per hour per IP (counted once the
        input is valid). A cookie-less request needs no Origin; one that carries a session cookie
        must satisfy the CSRF origin check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email:
                  type: string
                  maxLength: 254
                  description: >-
                    Trimmed, lower-cased and normalised to Unicode NFC, so NFC and NFD spellings of one
                    address are the same account (also at login). The local part (before the last `@`)
                    is at most 64 bytes, and the address contains no control (Cc) or format (Cf)
                    characters; otherwise `invalid_email`.
                password:
                  type: string
                  format: password
                  minLength: 10
                  maxLength: 128
                  description: >-
                    Normalised to Unicode NFKC before the length rules (counted in characters after
                    normalisation) and before hashing, so NFC and NFD forms of the same password are equal.
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: >-
                    Normalised to Unicode NFC, then trimmed; stored and returned in that form. Control
                    characters (Cc), format characters (Cf: zero-width space, bidi overrides and isolates,
                    LRM/RLM, BOM) except U+200D (zero-width joiner, used in emoji sequences), and line or
                    paragraph separators (Zl, Zp) are rejected with `invalid_display_name`.
                locale:
                  type: [string, "null"]
                  enum: [en, vi, null]
                  default: en
                  description: >-
                    The student's UI language; it becomes `users.locale` and selects the language of the
                    verification email. Absent or `null` means `en`; any other value (including another
                    case such as `VI`, or a non-string) is `400 invalid_locale` and nothing is created.
      responses:
        "201":
          description: Account created; the session cookie is set.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "400":
          description: >-
            `invalid_email`, `weak_password`, `invalid_display_name`, `invalid_locale` or `invalid_body`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "409":
          description: Email already registered (`email_taken`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/BusyOrSessionStore"}
  /v1/auth/login:
    post:
      operationId: login
      security: []
      tags: [auth]
      summary: Sign in with email and password
      description: >-
        A wrong password and an unknown email give the identical `401 invalid_credentials`
        (same body, same work). Every login issues a new session token; a session cookie sent
        with the request is revoked. Failures are limited to 10 per 15 minutes per IP+email and
        100 per 15 minutes per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, description: "Trimmed, lower-cased and NFC-normalised as at registration, so either Unicode spelling signs in."}
                password:
                  type: string
                  format: password
                  description: Normalised to Unicode NFKC before verification, exactly as at registration.
      responses:
        "200":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "400":
          description: Malformed body (`invalid_body`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: Wrong email or password (`invalid_credentials`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: >-
            `busy` (all password-hashing slots stayed taken), `session_store_unavailable` (no session could be created) or
            `limiter_unavailable` (the sign-in lockout counters in Redis did not answer, so the attempt fails closed); retry after `Retry-After`.
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out (idempotent)
      description: Deletes the session and clears the cookie. Always 204, also when nobody is signed in.
      security:
        - sessionCookie: []
        - {}
      responses:
        "204":
          description: Signed out; the cookie is cleared.
          headers:
            Set-Cookie:
              description: smem_session with an empty value and a negative Max-Age.
              schema: {type: string}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm the signed-in user's email address with the 6-digit code from the verification email
      description: >-
        The code is 6 decimal digits, valid 30 minutes, single use; there is one live code per user (a new one
        from registration or `verify-email/resend` replaces the old). Only the HMAC of the code is stored, in Redis.
        A wrong or missing code (or one that is not 6 digits) is `400 invalid_code`, a code past its lifetime
        `400 code_expired`, and after 5 wrong attempts on one code it is `400 code_locked` until a new code is
        requested. An already verified user gets `204` without a check. Also limited to 20 attempts per hour per
        user (`429 rate_limited` with `Retry-After`). When the code store (Redis) is down the answer is
        `503 code_store_unavailable`. In dev and test `SMEM_DEV_FIXED_OTP` makes one fixed code valid (docs/dev-shortcuts.md).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: "^[0-9]{6}$", examples: ["042917"]}
      responses:
        "204":
          description: The address is verified (`email_verified` is now true) and the code is used.
        "400":
          description: "`invalid_code`, `code_expired`, `code_locked` or `invalid_body`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: >-
            `code_store_unavailable`, `session_store_unavailable` or `limiter_unavailable` (the code-guess counter in Redis did not
            answer, so the attempt fails closed); retry after `Retry-After`.
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Send a new verification code to the signed-in user
      description: >-
        At most 3 per hour per user (`429 rate_limited` with `Retry-After`). The new code replaces the
        previous one, which stops working. Takes no body.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The address was already verified; nothing was sent.
          content:
            application/json:
              schema:
                type: object
                required: [already_verified]
                properties:
                  already_verified: {type: boolean, const: true}
        "202":
          description: The email was sent. A mailer failure is `500 internal_error` (and is logged without the code).
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/CodeOrSessionStoreUnavailable"}
  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      security: []
      tags: [auth]
      summary: Ask for a password reset code by email
      description: >-
        Always `202 {}` for a well-formed address, whether or not an account exists; the email (a 6-digit
        code valid 15 minutes, in the user's `locale`; a new request replaces the previous code) goes out in the background and only when the account
        exists, so neither the body nor the timing tells them apart. Limits: 5 per hour per IP and 3 per
        hour per address (counted for unknown addresses too). The address is trimmed, lower-cased and
        NFC-normalised like at login; one that is not an email at all is `400 invalid_email`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: {type: object}
        "400":
          description: "`invalid_email` or `invalid_body`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      security: []
      tags: [auth]
      summary: Set a new password with the 6-digit code from the reset email
      description: >-
        Checked in this order: the address format (`400 invalid_email`), 20 attempts per hour per IP
        (`429 rate_limited`), the password rules (NFKC, 10-128 characters, not the email; a rejected password
        is `400 weak_password` and leaves the code untouched, so the answer cannot confirm a code), then the
        code. An unknown address, a wrong code and no live code all answer `400 invalid_code` with the same
        body; `400 code_expired` and `400 code_locked` (5 wrong attempts) only for an account that has such a
        code. The code is valid 15 minutes and single use. On success every session of the user is deleted
        (sign in again). When the code store (Redis) is down the answer is `503 code_store_unavailable`. In dev
        and test `SMEM_DEV_FIXED_OTP` makes one fixed code valid for any existing account (docs/dev-shortcuts.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email: {type: string, maxLength: 254}
                code: {type: string, pattern: "^[0-9]{6}$", examples: ["042917"]}
                password: {type: string, format: password, minLength: 10, maxLength: 128}
      responses:
        "204":
          description: Password changed; all sessions are gone.
        "400":
          description: "`invalid_email`, `invalid_code`, `code_expired`, `code_locked`, `weak_password` or `invalid_body`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: "`busy` (all password-hashing slots stayed taken; the code is already used, ask for a new one), `code_store_unavailable`, `limiter_unavailable` (the code-guess counter in Redis did not answer, so the attempt fails closed) or `session_store_unavailable` (the sessions could not be deleted, so the password was not changed either)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/auth/google/start:
    get:
      operationId: googleStart
      security: []
      tags: [auth]
      summary: Start Google sign-in (browser navigation, not a fetch call)
      description: >-
        Only exists when the server has `SMEM_GOOGLE_CLIENT_ID` set; otherwise `404 not_found`. Redirects
        to Google's authorization endpoint (authorization-code flow with PKCE S256, `state` and `nonce`,
        scope `openid email profile`) and sets the 10-minute `smem_oidc` cookie (HttpOnly, SameSite=Lax,
        signed) that binds the flow to this browser. `return_to` must be a same-site relative path (one
        leading `/`, at most 200 characters, no `//`, `/\`, scheme or control characters); anything else
        is replaced by `/`. If Google cannot be reached the answer is `302 /login?error=oidc_failed`.
        30 per 15 minutes per IP.
      parameters:
        - {name: return_to, in: query, required: false, schema: {type: string, maxLength: 200}}
      responses:
        "302":
          description: To Google (or to `/login?error=oidc_failed`).
          headers:
            Location: {schema: {type: string}}
            Set-Cookie:
              description: "`smem_oidc`, valid 10 minutes."
              schema: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/auth/google/callback:
    get:
      operationId: googleCallback
      security: []
      tags: [auth]
      summary: Google redirects the browser here after sign-in
      description: >-
        Only exists when Google sign-in is enabled (else `404 not_found`). The redirect URI registered at
        Google is `<public base URL>/api/v1/auth/google/callback`. Success signs the user in (new
        `smem_session` cookie; a session cookie sent with the request is revoked) and redirects to the
        `return_to` given at start. Linking: a known Google account signs in; the same verified email on a
        local account links to it; the same email on a local account that never verified it first loses its
        password and sessions, is marked verified and linked (pre-hijacking defence); an unknown email
        creates a password-less account. Every failure is `302 /login?error=<code>` and creates nothing:
        `oidc_state` (cookie missing, altered or expired, or `state` differs), `oidc_denied` (the provider
        reported an error), `oidc_failed` (code exchange or ID-token check failed, or no usable email),
        `email_unverified` (Google did not mark the email verified). Provider details are only logged.
        30 per 15 minutes per IP.
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        "302":
          description: To `return_to` (signed in) or to `/login?error=<code>`.
          headers:
            Location: {schema: {type: string}}
            Set-Cookie:
              description: "`smem_session` on success; `smem_oidc` is always cleared."
              schema: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user
      description: >-
        Sliding expiry: once more than half of the 30-day lifetime has elapsed the expiry is
        extended and the cookie is sent again.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current user.
          headers:
            Set-Cookie:
              description: Present only when the session expiry was extended.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401":
          description: No, unknown or expired session (`unauthenticated`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
  /v1/yearbooks:
    post:
      operationId: createYearbook
      tags: [yearbooks]
      summary: Create a yearbook (and its owner profile)
      description: >-
        Creates the book and one owner profile whose `full_name` is the user's display name.
        A user owns at most 20 books (`409 limit_reached`). Unknown fields (for example `owner_id`)
        are rejected with `400 unknown_field`. Text fields are normalised to NFC and trimmed;
        control characters (Cc), format characters (Cf, except U+200D) and line/paragraph
        separators are rejected with `invalid_<field>`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YearbookCreate"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearbookEnvelope"}
        "400": {$ref: "#/components/responses/YearbookInvalid"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "409":
          description: The user already owns 20 yearbooks (`limit_reached`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
    get:
      operationId: listYearbooks
      tags: [yearbooks]
      summary: List the caller's yearbooks
      description: >-
        Only the caller's books, newest `updated_at` first (editing the book or its profile updates it).
        Pass `next_cursor` back as `cursor` for the next page; `next_cursor` is null on the last page.
        A malformed or tampered cursor is `400 invalid_cursor`.
      security:
        - sessionCookie: []
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}, description: "Out of range or not a number: `400 invalid_limit`."}
        - {name: cursor, in: query, required: false, schema: {type: string}, description: Opaque token from a previous page.}
      responses:
        "200":
          description: A page of books (each with its profile).
          content:
            application/json:
              schema:
                type: object
                required: [yearbooks, next_cursor]
                properties:
                  yearbooks:
                    type: array
                    items: {$ref: "#/components/schemas/Yearbook"}
                  next_cursor: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/YearbookInvalid"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
  /v1/yearbooks/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: Yearbook ULID.}
    get:
      operationId: getYearbook
      tags: [yearbooks]
      summary: Read one yearbook with its profile
      description: A missing book and a book owned by someone else both answer `404 not_found`.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearbookEnvelope"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
        "404": {$ref: "#/components/responses/YearbookNotFound"}
    patch:
      operationId: updateYearbook
      tags: [yearbooks]
      summary: Partially update a yearbook
      description: >-
        Only the fields present change. An empty string clears an optional text field; `graduation_year: null`
        clears the year. A JSON null on any other field counts as absent. Unknown fields are `400 unknown_field`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YearbookPatch"}
      responses:
        "200":
          description: The updated book.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearbookEnvelope"}
        "400": {$ref: "#/components/responses/YearbookInvalid"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "404": {$ref: "#/components/responses/YearbookNotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
    delete:
      operationId: deleteYearbook
      tags: [yearbooks]
      summary: Delete a yearbook
      description: >-
        Hard-deletes the book, its profile and its stored photos. The photos are removed from object storage first;
        if that fails the request answers `502 storage_error` and nothing is deleted.
      security:
        - sessionCookie: []
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "404": {$ref: "#/components/responses/YearbookNotFound"}
        "502": {$ref: "#/components/responses/StorageError"}
  /v1/yearbooks/{id}/profile:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: Yearbook ULID.}
    put:
      operationId: replaceYearbookProfile
      tags: [yearbooks]
      summary: Replace the owner's profile information
      description: >-
        Replaces every field: an omitted optional field is cleared. Unknown fields (for example `is_owner`)
        are `400 unknown_field`. Birthday is personal data and is never logged.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileInput"}
      responses:
        "200":
          description: The book with its updated profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearbookEnvelope"}
        "400": {$ref: "#/components/responses/YearbookInvalid"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "404": {$ref: "#/components/responses/YearbookNotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
  /v1/yearbooks/{id}/media:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: Yearbook ULID.}
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a photo to a yearbook
      description: >-
        `multipart/form-data` with the image in the part named `file`; other parts are ignored and the client file
        name is never used. The type is decided by sniffing the content (JPEG, PNG, WebP), never by file name or
        Content-Type. The image is decoded, rotated upright, stripped of all metadata (EXIF, GPS, ICC, comments),
        resized to at most 3000 px on the long edge (never enlarged) and stored; a 480 px JPEG thumbnail and a
        print version (long edge at most 1800 px, JPEG quality 85, PNG when the photo has transparency) are stored
        too. Opaque images are stored as JPEG, images with transparency as PNG. Only the owner may upload (`404`
        otherwise). The body cap is `SMEM_MEDIA_MAX_BYTES` (default 10 MiB). Limits: 200 photos per yearbook, 500 MiB
        per user, 60 uploads per 10 minutes per user.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaEnvelope"}
        "400":
          description: >-
            `invalid_image` (corrupt, over 12000 px on a side, over 50 megapixels for JPEG or 25 megapixels for PNG and
            WebP, or an estimated decoded size over 128 MiB) or `invalid_body` (not multipart or no `file` part).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "404": {$ref: "#/components/responses/YearbookNotFound"}
        "409":
          description: A storage limit is reached (`quota_exceeded`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: The file or the request body is over the cap (`payload_too_large`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415":
          description: >-
            The request is not `multipart/form-data`, or the file is not a JPEG, PNG or WebP image
            (`unsupported_media_type`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "502": {$ref: "#/components/responses/StorageError"}
        "503":
          description: Too many uploads in progress (`busy`) or the session store is down (`session_store_unavailable`); retry after the `Retry-After` seconds.
          headers:
            Retry-After: {schema: {type: integer}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      operationId: listMedia
      tags: [media]
      summary: List a yearbook's photos
      description: >-
        Owner only (a missing book and someone else's both answer `404 not_found`). Newest first, keyset
        paginated on the photo id, so uploads and deletes between pages never repeat or skip a photo that stays.
        Pass `next_cursor` back as `cursor`; it is null on the last page. By default only the owner's own uploads
        are listed (`uploader=owner`). The response never contains storage keys, hashes or URLs: fetch the image
        with `GET /v1/media/{id}/content`.
      security:
        - sessionCookie: []
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}, description: "Out of range or not a number: `400 invalid_limit`."}
        - {name: cursor, in: query, required: false, schema: {type: string}, description: "Opaque token from a previous page; a malformed one is `400 invalid_cursor`."}
        - {name: uploader, in: query, required: false, schema: {type: string, enum: [owner, contributor, all], default: owner}, description: "Anything else: `400 invalid_uploader`."}
      responses:
        "200":
          description: A page of photos.
          content:
            application/json:
              schema:
                type: object
                required: [media, next_cursor]
                properties:
                  media:
                    type: array
                    items: {$ref: "#/components/schemas/MediaItem"}
                  next_cursor: {type: [string, "null"]}
        "400":
          description: "`invalid_limit`, `invalid_cursor` or `invalid_uploader`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
        "404": {$ref: "#/components/responses/YearbookNotFound"}
  /v1/media/{id}/content:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: Media ULID.}
    get:
      operationId: getMediaContent
      tags: [media]
      summary: Download a photo
      description: >-
        Streams the stored image to the yearbook owner only (`404` for anyone else). `Content-Type` comes from the
        stored record. Honours `Range` and `If-None-Match`. `size=print` is the 1800 px version for the print renderer
        (same type as `display`); a photo uploaded before it existed, and not yet reached by the backfill
        (`smemories-media-backfill`), is answered in display size.
      security:
        - sessionCookie: []
      parameters:
        - {name: size, in: query, required: false, schema: {type: string, enum: [display, thumb, print], default: display}}
      responses:
        "200":
          description: The image.
          headers:
            Cache-Control: {schema: {type: string, const: "private, max-age=3600"}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        "206": {description: The requested byte range.}
        "304": {description: Not modified.}
        "400":
          description: Unknown `size` (`invalid_size`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
        "404": {$ref: "#/components/responses/NotFound"}
        "416": {description: Range not satisfiable.}
        "502": {$ref: "#/components/responses/StorageError"}
  /v1/media/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: Media ULID.}
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a photo
      description: >-
        Removes the row and both stored objects. Idempotent: an unknown id, an already deleted one and someone
        else's photo all answer `204` (and the last deletes nothing), so the answer never reveals whether a photo
        exists. A cover or profile photo that pointed at it is cleared.
      security:
        - sessionCookie: []
      responses:
        "204": {description: Deleted, or nothing to delete.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "503": {$ref: "#/components/responses/SessionStoreUnavailable"}
        "403": {$ref: "#/components/responses/CsrfOriginMismatch"}
        "502": {$ref: "#/components/responses/StorageError"}
  /api/note-collection/create:
    post:
      operationId: createNoteCollection
      tags: [notes]
      summary: Create a collection link for a yearbook
      description: >-
        Called by the signed-in owner of a yearbook (the web app's "share" screen). Creates a private link friends can use
        to leave notes. The body is a JSON object with the `yearbook_id` and optional options. The response carries the link
        `token` once; only its SHA-256 is stored and it can never be shown again (revoke the link and create a new one instead).
        The token is a bearer secret of 192 random bits (32 base64url characters); the web link is `<app>/c/<token>`.
        `label` is optional, at most 60 characters, NFC and trimmed (`ERROR_INVALID_LABEL` for control or format characters).
        `deadline_at` is optional, Unix ms, in the future and at most one year ahead (`ERROR_INVALID_DEADLINE`); `null` or
        absent means no deadline. Unknown fields, a missing `yearbook_id` and values of the wrong type are `ERROR_PARAM`.
        Needs a verified email (`ERROR_EMAIL_NOT_VERIFIED`). A missing yearbook and one owned by someone else both answer
        `ERROR_NOT_FOUND`. At most 5 active (not revoked) links per yearbook (`ERROR_LIMIT_REACHED`). A request with the
        session cookie must come from an allowed Origin. Not idempotent: retrying after a lost answer may create a second link.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_INVALID_LABEL, description: The label is longer than 60 characters or contains control or format characters.}
        - {code: ERROR_INVALID_DEADLINE, description: "`deadline_at` is not in the future or is more than one year ahead."}
        - {code: ERROR_LIMIT_REACHED, description: The yearbook already has 5 active links.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteCollectionCreateRequest"}
            examples:
              withDeadline:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, label: Cafe friends, deadline_at: 1761000000000}
              noOptions:
                value: {yearbook_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E}
      responses:
        "200":
          description: Created. The only response that ever contains the token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteCollectionCreateResponse"}
              examples:
                created:
                  value:
                    status: OK
                    data: {id: 01K7QA1B2C3D4E5F6G7H8J9K0M, label: Cafe friends, deadline_at: 1761000000000, created_at: 1760000000000, token: q3Zp0Vn8xYk2LwR5tB7mJc9aHdE4sUgF}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note-collection/get-list:
    get:
      operationId: listNoteCollections
      tags: [notes]
      summary: List a yearbook's collection links
      description: >-
        Called by the signed-in owner to show the links of a yearbook, newest first, revoked ones included (`revoked_at` set).
        Never contains a token or a token hash. `note_count` counts the link's notes in any status. At most 5 links are active, but
        revoked ones stay, so the list is returned whole: `next_id` is always the empty string and there is no `limit` yet.
        A missing `yearbook_id` is `ERROR_PARAM`; a missing yearbook and one owned by someone else both answer `ERROR_NOT_FOUND`.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: yearbook_id, in: query, required: true, schema: {type: string}, description: Yearbook ULID.}
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteCollectionListResponse"}
              examples:
                list:
                  value:
                    status: OK
                    data:
                      items:
                        - {id: 01K7QA1B2C3D4E5F6G7H8J9K0M, label: Cafe friends, deadline_at: 1761000000000, created_at: 1760000000000, revoked_at: null, note_count: 3}
                      next_id: ""
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/note-collection/revoke:
    post:
      operationId: revokeNoteCollection
      tags: [notes]
      summary: Revoke a collection link
      description: >-
        Called by the signed-in owner to stop a link. Sets `revoked_at`; the link stops working at once and never becomes active
        again, but its notes are kept. Idempotent: repeating it succeeds and keeps the first `revoked_at`, so a lost answer can be
        retried. A missing link and someone else's both answer `ERROR_NOT_FOUND`. A request with the session cookie must come from
        an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The link does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteCollectionRevokeRequest"}
            examples:
              revoke: {value: {id: 01K7QA1B2C3D4E5F6G7H8J9K0M}}
      responses:
        "200":
          description: Revoked (or already revoked).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                revoked: {value: {status: OK, data: {}}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/public-collect/get:
    get:
      operationId: getPublicCollect
      tags: [notes]
      summary: Look up a collection link (public)
      description: >-
        Called by the public note form (a friend's browser) when the page opens. No session is needed and none is read; no cookie
        is set and no CORS headers are sent. An unknown, malformed, missing or revoked `token` all answer the same `ERROR_NOT_FOUND`.
        Once the deadline has passed the answer is `ERROR_COLLECTION_CLOSED`. The answer also carries `fields`, the questions of the
        note form in order, so the page can render the form. Only requests that miss (unknown, malformed or revoked token) count
        against the tight limit of 60 per client IP per 15 minutes, so a class behind one address can open the same link; all requests
        together are capped at 600 per client IP per 15 minutes (`ERROR_RATE_LIMITED`, with `Retry-After`: wait that many seconds).
        The token is a credential in the URL: the access log records the route only, never the query string.
      x-auth: public
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The token is missing, malformed, unknown or revoked; the four cannot be told apart."}
        - {code: ERROR_COLLECTION_CLOSED, description: The deadline of the link has passed.}
        - {code: ERROR_RATE_LIMITED, description: "Too many requests from this client IP; wait `Retry-After` seconds."}
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}, description: The link token, a bearer secret of 32 base64url characters.}
      responses:
        "200":
          description: The link is active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicCollectGetResponse"}
              examples:
                open:
                  value:
                    status: OK
                    data:
                      yearbook: {title: Class 12A}
                      owner: {display_name: Linh}
                      deadline_at: 1761000000000
                      open: true
                      fields:
                        - {id: name, kind: short_text, label: {en: Your name, vi: Tên của bạn}, hint: {en: "", vi: ""}, required: true, max_length: 60}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "410": {$ref: "#/components/responses/ApiGone"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
  /api/public-collect/submit-note:
    post:
      operationId: submitPublicCollectNote
      tags: [notes]
      summary: Submit a note through a collection link (public)
      description: >-
        Called by the public note form (a friend's browser). A friend sends the link `token`, answers to the form fields (`fields` of
        the lookup) and up to three photos, without an account, as `multipart/form-data`. The token is a form field, not part of the
        URL. The note is stored as `pending` for the owner to moderate; nothing about it is returned except its id. No session is read,
        no cookie is set, no CORS headers are sent, and neither the client IP nor the user agent is stored. The body is spooled to a
        temporary file on the server while it arrives (nothing is decoded and no image-processing slot is held during the upload); the
        server removes the file in every case. The link, the note limit and the text are checked once the body has arrived, and a
        rejection (`ERROR_NOT_FOUND` for an unknown, malformed, missing or revoked token, `ERROR_COLLECTION_CLOSED` after the deadline,
        `ERROR_PARAM`, `ERROR_RATE_LIMITED`) is sent only after the rest of the body has been read, so a browser can show it. Send
        `answers` before the first `photos` part (otherwise `ERROR_PARAM`). Unknown parts are ignored. A body that delivers no byte for 10
        seconds, or averages under 16 KiB/s once 15 seconds have passed, or takes over 120 seconds, is dropped (`ERROR_REQUEST_TIMEOUT`,
        nothing stored).


        Answers are validated against the set of fields in force at submission time (text rules of `docs/note-fields.md`: NFC, trimmed,
        control and format characters rejected except ZWJ and variation selectors, limits in characters). Each photo goes through the same
        pipeline as owner uploads (content sniffing, decode limits, metadata stripped, display, print and thumbnail versions); a rejected
        photo rejects the whole submission and nothing is stored. Photos are processed one at a time, each waiting up to 10 seconds for a
        free image-processing slot. A submission is refused at once, before any byte of the body is read, with `ERROR_BUSY` and a
        `Retry-After` of 2 to 6 seconds (random) when the server already has `SMEM_PUBLIC_UPLOAD_MAX_CONNS` uploads in progress or the
        client IP has `SMEM_PUBLIC_UPLOAD_CONCURRENT_PER_IP`; `ERROR_BUSY` is also the answer when no processing slot frees up in 10
        seconds. A `503` costs the client nothing against the request limits below. The server does not read the body of an immediate
        `503`, so a client that is still uploading may see the connection reset instead of the answer: treat a network error exactly
        like `503` and retry with the same data. Retrying after any other failure may store a second note; a success is final.


        Limits: request body 32 MiB, each photo `SMEM_MEDIA_MAX_BYTES` (default 10 MiB), `answers` 16 KiB, 300 notes per link in any status,
        the yearbook's photo quota. Submissions that passed text validation are counted per client IP (100 per hour, 300 per day) and per
        link (60 per hour): `ERROR_RATE_LIMITED` with `Retry-After`. A non-empty `website` field is a honeypot: the answer is a normal
        success and nothing is stored.
      x-auth: public
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The token is missing, malformed, unknown or revoked; the four cannot be told apart."}
        - {code: ERROR_COLLECTION_CLOSED, description: The deadline of the link has passed.}
        - {code: ERROR_COLLECTION_FULL, description: The link already holds 300 notes.}
        - {code: ERROR_MISSING_ANSWER, description: "A required field is missing or blank; the message names the field id, never the value."}
        - {code: ERROR_INVALID_ANSWER, description: "An answer breaks the text rules or the field's length limit; the message names the field id, never the value."}
        - {code: ERROR_TOO_MANY_PHOTOS, description: More than three photos were sent.}
        - {code: ERROR_INVALID_IMAGE, description: "A photo is corrupt, over 12000 px on a side, over 50 megapixels for JPEG or 25 megapixels for PNG and WebP, or its estimated decoded size is over 128 MiB."}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: The request is not multipart/form-data, or a photo is not a JPEG, PNG or WebP image.}
        - {code: ERROR_VERIFICATION_FAILED, description: The abuse check refused the submission.}
        - {code: ERROR_QUOTA_EXCEEDED, description: The yearbook's photo quota is reached.}
        - {code: ERROR_TOO_LARGE, description: The request body is over 32 MiB or a photo is over the per-photo cap.}
        - {code: ERROR_REQUEST_TIMEOUT, description: "No body byte arrived for 10 seconds, the average rate stayed under 16 KiB/s after 15 seconds, or the upload took over 120 seconds; nothing was stored."}
        - {code: ERROR_RATE_LIMITED, description: "Too many requests from this client IP or for this link; wait `Retry-After` seconds."}
        - {code: ERROR_BUSY, description: "The upload slots or the image-processing slots are full; retry after `Retry-After`."}
        - {code: ERROR_STORAGE_ERROR, description: The object store failed; nothing was kept, retry later.}
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/PublicCollectSubmitNoteRequest"}
            examples:
              textOnly:
                value: {token: q3Zp0Vn8xYk2LwR5tB7mJc9aHdE4sUgF, answers: '{"name":"Linh","message":"Nhớ các bạn nhiều 🎓"}'}
      responses:
        "200":
          description: Stored as pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicCollectSubmitNoteResponse"}
              examples:
                stored:
                  value: {status: OK, data: {id: 01K7QB4C5D6E7F8G9H0J1K2M3N}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "408": {$ref: "#/components/responses/ApiRequestTimeout"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "410": {$ref: "#/components/responses/ApiGone"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiBusy"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: smem_session
      description: >-
        HttpOnly, SameSite=Lax, Path=/, Max-Age 30 days, Secure except when SMEM_ENV=dev.
        State-changing requests that carry it must come from an origin in SMEM_ALLOWED_ORIGINS.
  headers:
    SessionCookie:
      description: >-
        `smem_session=<32 random bytes, base64url>; Path=/; Max-Age=2592000; HttpOnly; SameSite=Lax`
        (plus `Secure` unless SMEM_ENV=dev). Only the token's SHA-256 is stored server-side.
      schema: {type: string}
  responses:
    Unauthenticated:
      description: No, unknown or expired session (`unauthenticated`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    YearbookNotFound:
      description: The yearbook does not exist or belongs to someone else (`not_found`); the two cannot be told apart.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    YearbookInvalid:
      description: >-
        `invalid_<field>` (title, school_name, class_name, graduation_year, motto, language, page_size, full_name,
        nickname, birthday, quote, hobbies, future_plans, limit, cursor, media: a `*_media_id` that is not a photo of this
        yearbook), `unknown_field` or `invalid_body`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CsrfOriginMismatch:
      description: >-
        The request carries the session cookie but its Origin (or Referer) is missing or not
        allowed (`csrf_origin_mismatch`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PayloadTooLarge:
      description: Body over the 1 MiB cap (`payload_too_large`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    UnsupportedMediaType:
      description: A body was sent with a Content-Type other than application/json (`unsupported_media_type`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Too many attempts (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the oldest counted attempt leaves the window.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    StorageError:
      description: The object store failed (`storage_error`); nothing was changed, retry later.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CodeStoreUnavailable:
      description: Redis, which holds the email codes, did not answer (`code_store_unavailable`), or the rate limiter that guards sign-in, verification and reset did (`limiter_unavailable`); nothing was accepted, retry shortly.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    SessionStoreUnavailable:
      description: >-
        Redis, which holds the login sessions, did not answer (`session_store_unavailable`). Sessions have no copy elsewhere, so
        the request fails closed: the caller is not treated as anonymous and no session is created. Retry after `Retry-After`.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BusyOrSessionStore:
      description: >-
        All password-hashing slots stayed taken (`busy`), or the session store is down (`session_store_unavailable`; for register
        no account is created); retry after `Retry-After`.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CodeOrSessionStoreUnavailable:
      description: >-
        Redis did not answer: `code_store_unavailable` (nothing was accepted) or `session_store_unavailable` (the session could not be
        read); retry shortly.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Busy:
      description: >-
        All password-hashing or image-processing slots stayed taken for a few seconds, or (public note submission) the upload
        slots are full (`busy`); retry after `Retry-After`.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No route matches this path. Error code `not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Wrong HTTP method for this path. Error code `method_not_allowed`.
      headers:
        Allow:
          description: Methods this path accepts.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ApiBadRequest:
      description: >-
        `ERROR_PARAM` (malformed body or query, unknown field, wrong type, a missing required parameter) or one of the field-level
        codes listed in the operation's `x-error-codes`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiUnauthorized:
      description: No, unknown or expired session (`ERROR_UNAUTHORIZED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiForbidden:
      description: A business code listed in the operation's `x-error-codes` (for example `ERROR_CSRF_ORIGIN_MISMATCH`, `ERROR_EMAIL_NOT_VERIFIED`, `ERROR_VERIFICATION_FAILED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiNotFound:
      description: "`ERROR_NOT_FOUND`: the thing does not exist or is not the caller's; the two cannot be told apart."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiConflict:
      description: A business code listed in the operation's `x-error-codes` (`ERROR_LIMIT_REACHED`, `ERROR_COLLECTION_FULL`, `ERROR_QUOTA_EXCEEDED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiGone:
      description: The deadline of the link has passed (`ERROR_COLLECTION_CLOSED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiRequestTimeout:
      description: The request body arrived too slowly (`ERROR_REQUEST_TIMEOUT`); nothing was stored.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiTooLarge:
      description: The body, or a photo in it, is over its cap (`ERROR_TOO_LARGE`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiUnsupportedMediaType:
      description: The Content-Type is not the one the operation takes, or a photo is not a JPEG, PNG or WebP image (`ERROR_UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiRateLimited:
      description: Too many requests (`ERROR_RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds until the oldest counted request leaves the window.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiInternal:
      description: Unexpected failure (`ERROR_INTERNAL`); nothing was kept.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiBadGateway:
      description: The object store failed (`ERROR_STORAGE_ERROR`); nothing was changed, retry later.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiBusy:
      description: The upload slots or the image-processing slots are full (`ERROR_BUSY`); retry after `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiSessionStoreUnavailable:
      description: >-
        Redis, which holds the login sessions, did not answer (`ERROR_SESSION_STORE_UNAVAILABLE`). Sessions have no copy elsewhere, so
        the request fails closed. Retry after `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email, email_verified, display_name, locale, created_at]
      properties:
        id: {type: string, description: Opaque ULID., examples: ["01J9Z3K6V8Q4M7N2P5R8T0W1XY"]}
        email: {type: string}
        email_verified: {type: boolean}
        display_name: {type: string}
        locale: {type: string, enum: [en, vi]}
        created_at: {type: string, format: date-time}
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: {$ref: "#/components/schemas/User"}
    Profile:
      type: object
      additionalProperties: false
      required: [id, is_owner, full_name, nickname, birthday, quote, hobbies, future_plans, photo_media_id]
      properties:
        id: {type: string, description: Opaque ULID.}
        is_owner: {type: boolean}
        full_name: {type: string, minLength: 1, maxLength: 100}
        nickname: {type: string, maxLength: 50, description: Empty when not set.}
        birthday: {type: [string, "null"], format: date}
        quote: {type: string, maxLength: 500}
        hobbies: {type: string, maxLength: 300}
        future_plans: {type: string, maxLength: 300}
        photo_media_id: {type: [string, "null"], description: A photo of this yearbook, or null.}
    Yearbook:
      type: object
      additionalProperties: false
      required: [id, title, school_name, class_name, graduation_year, motto, language, page_size, template_id, cover_media_id, created_at, updated_at, profile]
      properties:
        id: {type: string, description: Opaque ULID., examples: ["01J9Z3K6V8Q4M7N2P5R8T0W1XY"]}
        title: {type: string, minLength: 1, maxLength: 120}
        school_name: {type: string, maxLength: 120, description: Empty when not set.}
        class_name: {type: string, maxLength: 120, description: Empty when not set.}
        graduation_year: {type: [integer, "null"], minimum: 1950, maximum: 2100}
        motto: {type: string, maxLength: 200}
        language: {type: string, enum: [en, vi]}
        page_size: {type: string, enum: [A5, A4, Letter]}
        template_id: {type: [string, "null"], description: Null until a template is chosen.}
        cover_media_id: {type: [string, "null"], description: A photo of this yearbook, or null.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        profile: {$ref: "#/components/schemas/Profile"}
    YearbookEnvelope:
      type: object
      required: [yearbook]
      properties:
        yearbook: {$ref: "#/components/schemas/Yearbook"}
    YearbookCreate:
      type: object
      additionalProperties: false
      required: [title, language]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        school_name: {type: string, maxLength: 120}
        class_name: {type: string, maxLength: 120}
        graduation_year: {type: [integer, "null"], minimum: 1950, maximum: 2100}
        motto: {type: string, maxLength: 200}
        language: {type: string, enum: [en, vi]}
        page_size: {type: string, enum: [A5, A4, Letter], default: A5}
    YearbookPatch:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        school_name: {type: string, maxLength: 120}
        class_name: {type: string, maxLength: 120}
        graduation_year: {type: [integer, "null"], minimum: 1950, maximum: 2100}
        motto: {type: string, maxLength: 200}
        language: {type: string, enum: [en, vi]}
        page_size: {type: string, enum: [A5, A4, Letter]}
        cover_media_id: {type: [string, "null"], description: A photo of this yearbook (else `400 invalid_media`); null clears it.}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [full_name]
      properties:
        full_name: {type: string, minLength: 1, maxLength: 100}
        nickname: {type: string, maxLength: 50}
        birthday: {type: [string, "null"], format: date, description: "YYYY-MM-DD, a real date strictly before today (UTC) and not before 1900-01-01."}
        quote: {type: string, maxLength: 500}
        hobbies: {type: string, maxLength: 300}
        future_plans: {type: string, maxLength: 300}
        photo_media_id: {type: [string, "null"], description: A photo of this yearbook (else `400 invalid_media`). Like every field of this replacing PUT, omitted means cleared.}
    Media:
      type: object
      additionalProperties: false
      required: [id, width, height, bytes]
      properties:
        id: {type: string, description: Opaque ULID.}
        width: {type: integer, description: Pixels, of the stored display version.}
        height: {type: integer}
        bytes: {type: integer, description: Size of the stored display version.}
    MediaItem:
      type: object
      additionalProperties: false
      required: [id, width, height, bytes, uploader_kind, created_at]
      properties:
        id: {type: string, description: Opaque ULID.}
        width: {type: integer}
        height: {type: integer}
        bytes: {type: integer}
        uploader_kind: {type: string, enum: [owner, contributor]}
        created_at: {type: string, format: date-time}
    MediaEnvelope:
      type: object
      required: [media]
      properties:
        media: {$ref: "#/components/schemas/Media"}
    ApiError:
      type: object
      description: >-
        The v2 error envelope (docs/api-contract.md section 2). The HTTP status is kept as well; `status` is the contract clients
        localise on.
      required: [status, error_message, request_id]
      properties:
        status:
          type: string
          description: The error code, `ERROR_` + SCREAMING_SNAKE_CASE. Never `OK` here.
          examples: [ERROR_NOT_FOUND]
        error_message:
          type: string
          description: English text for logs and support; never shown to people and never contains secrets.
        request_id:
          type: string
          description: Same value as the X-Request-Id response header; quote it to support.
    EmptyResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {type: object, description: Always an empty object., additionalProperties: false}
    NoteCollectionCreateRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id]
      properties:
        yearbook_id: {type: string, description: Required. ULID of a yearbook the caller owns.}
        label: {type: string, maxLength: 60, description: "Optional, default empty. At most 60 characters, NFC and trimmed, no control or format characters."}
        deadline_at: {type: [integer, "null"], format: int64, description: "Optional, default null (no deadline). Unix ms; must be in the future and at most one year ahead."}
    NoteCollectionCreateResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/NoteCollectionCreated"}
    NoteCollectionCreated:
      type: object
      description: The new link, with its token.
      required: [id, label, deadline_at, created_at, token]
      properties:
        id: {type: string, description: Collection ULID.}
        label: {type: string, description: The cleaned label; an empty string when none was given.}
        deadline_at: {type: [integer, "null"], format: int64, description: "Deadline, Unix ms; null when the link has none."}
        created_at: {type: integer, format: int64, description: "Creation time, Unix ms."}
        token: {type: string, description: "The bearer secret of the link, 32 base64url characters. Shown only in this response."}
    NoteCollection:
      type: object
      description: One link as the owner's list shows it. Never contains the token.
      required: [id, label, deadline_at, created_at, revoked_at, note_count]
      properties:
        id: {type: string, description: Collection ULID.}
        label: {type: string, description: The label; an empty string when none was given.}
        deadline_at: {type: [integer, "null"], format: int64, description: "Deadline, Unix ms; null when the link has none."}
        created_at: {type: integer, format: int64, description: "Creation time, Unix ms."}
        revoked_at: {type: [integer, "null"], format: int64, description: "When the owner revoked the link, Unix ms; null while it is active."}
        note_count: {type: integer, minimum: 0, description: Number of notes of the link in any status.}
    NoteCollectionListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The page; the list is returned whole, so it is always the only page.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The links, newest first.
              items: {$ref: "#/components/schemas/NoteCollection"}
            next_id: {type: string, description: Opaque cursor; always the empty string (no more pages).}
    NoteCollectionRevokeRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, description: Required. ULID of a collection of one of the caller's yearbooks.}
    PublicCollectGetResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/PublicCollect"}
    PublicCollect:
      type: object
      description: What a visitor with a valid link may learn.
      required: [yearbook, owner, deadline_at, open, fields]
      properties:
        yearbook:
          type: object
          description: The yearbook the notes are for.
          required: [title]
          properties:
            title: {type: string, description: The yearbook's title.}
        owner:
          type: object
          description: The person who made the link.
          required: [display_name]
          properties:
            display_name: {type: string, description: The owner's display name.}
        deadline_at: {type: [integer, "null"], format: int64, description: "Deadline, Unix ms; null when the link has none."}
        open: {type: boolean, const: true, description: Always true; a closed link answers `ERROR_COLLECTION_CLOSED` instead.}
        fields:
          type: array
          description: The questions of the note form, in order.
          items: {$ref: "#/components/schemas/NoteField"}
    NoteField:
      type: object
      description: One question of the note form.
      required: [id, kind, label, hint, required, max_length]
      properties:
        id: {type: string, description: Field id; the key of the answer in `answers`., examples: [name]}
        kind: {type: string, enum: [short_text, long_text], description: "`short_text` is a single line, `long_text` may contain line breaks."}
        label: {$ref: "#/components/schemas/LocalizedText"}
        hint: {$ref: "#/components/schemas/LocalizedText"}
        required: {type: boolean, description: True when the answer must be present and not blank.}
        max_length: {type: integer, minimum: 1, description: Longest answer, in characters after normalisation.}
    LocalizedText:
      type: object
      description: A text in each supported language.
      required: [en, vi]
      properties:
        en: {type: string, description: English text.}
        vi: {type: string, description: Vietnamese text.}
    PublicCollectSubmitNoteRequest:
      type: object
      required: [token, answers]
      properties:
        token: {type: string, description: Required. The link token (32 base64url characters); the first `token` part counts.}
        answers:
          type: string
          description: >-
            Required. A JSON object `{"<field id>":"<text>"}` of at most 16 KiB. Keys must be fields of the form;
            required fields must be present and not blank. Send it before the first `photos` part.
          examples: ['{"name":"Linh","message":"Nhớ các bạn nhiều 🎓"}']
        photos:
          type: array
          maxItems: 3
          items: {type: string, format: binary}
          description: Optional. Up to three JPEG, PNG or WebP images (the content decides, not the name or Content-Type).
        website: {type: string, description: Honeypot. Leave empty; a non-empty value makes the answer a fake success.}
    PublicCollectSubmitNoteResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The stored note.
          required: [id]
          properties:
            id: {type: string, description: Note ULID.}
    Error:
      type: object
      description: >-
        Shared error envelope. `code` is a stable snake_case contract (clients localise
        it); `message` is English text meant for logs.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              examples: [not_found, method_not_allowed, payload_too_large, internal_error, not_ready, invalid_credentials, unauthenticated, rate_limited, invalid_code, code_expired, code_locked, code_store_unavailable, session_store_unavailable, limiter_unavailable, limit_reached, unknown_field, unsupported_media_type, invalid_image, quota_exceeded, storage_error, invalid_media, missing_answer, invalid_answer, too_many_photos, collection_full, collection_closed, verification_failed, busy, request_timeout]
            message:
              type: string
            request_id:
              type: string
              description: Same value as the X-Request-Id response header.
