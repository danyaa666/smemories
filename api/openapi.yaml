        revoked ones included (`note-collection/create` answers `ERROR_LIMIT_REACHED` for the 51st), so the list is paged: `limit`
        defaults to 50, at most 100 (`ERROR_PARAM` otherwise), and `next_id` is the opaque cursor of the previous page, bound to this
        yearbook (a malformed, tampered or foreign one is `ERROR_PARAM`) and `""` on the last page. The cursor is a position, so
        links created between two requests never shift a page.
