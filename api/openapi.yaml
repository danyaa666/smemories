      tags: [class]
      summary: Make a join link for a class (admin)
      description: >-
        Called by an admin of the class (the invite screen). Returns the link **once**: the `token` is a bearer secret (32 random bytes, 43 base64url characters) that lets whoever holds it join the class as a `student`; the server keeps only its SHA-256, so it cannot be shown again. Show `link` (`<public base URL>/join/<token>`) to the admin to copy; there is no invite email.
        `expires_at` (Unix ms) is optional: it defaults to 14 days from now and must be in the future and at most 30 days away. A class has at most 5 active invites (not revoked, not expired); the 6th is `ERROR_LIMIT_REACHED`, counted under the class lock so parallel creates cannot exceed it.
        A member who is not an admin gets `ERROR_FORBIDDEN`; a non-member and an unknown class get `ERROR_NOT_FOUND`. Not idempotent: repeating a lost request makes a second link. A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The class does not exist or the caller is not a member of it; the two cannot be told apart."}
        - {code: ERROR_FORBIDDEN, description: "The caller is a member but not an admin of this class."}
        - {code: ERROR_INVALID_EXPIRES_AT, description: "Field `expires_at`: not in the future, or more than 30 days away."}
        - {code: ERROR_LIMIT_REACHED, description: The class already has 5 active invites.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_RATE_LIMITED, description: "More than 120 class writes by this user in an hour. Retry after `Retry-After`."}
        - {code: ERROR_UNAVAILABLE, description: "The write rate limiter in Redis did not answer, so the write fails closed. Retry after `Retry-After`."}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClassInviteCreateRequest"}
            examples:
              example:
                value: {class_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E}
      responses:
        "200":
          description: The new invite with its token and link, shown only here.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClassInviteCreatedResponse"}
              examples:
                ok:
                  value:
                    status: OK
                    data: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2H, created_at: 1760000000000, expires_at: 1761209600000, revoked_at: null, active: true, token: "Zm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyMDA", link: "https://app.example.com/join/Zm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyMDA"}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/class-invite/get-list:
    get:
      operationId: listClassInvites
      tags: [class]
      summary: List the join links of a class (admin)
      description: >-
        Called by an admin of the class. Newest first; revoked and expired links are listed too, with `active` false. It never carries a token or a link: those were shown once, by `/api/class-invite/create`.
        Keyset paginated like every list; `next_id` is bound to this class and this caller. A `limit` outside 1..50 is `ERROR_PARAM`. A member who is not an admin gets `ERROR_FORBIDDEN`; a non-member and an unknown class get `ERROR_NOT_FOUND`.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The class does not exist or the caller is not a member of it; the two cannot be told apart."}
        - {code: ERROR_FORBIDDEN, description: "The caller is a member but not an admin of this class."}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: class_id, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Class ULID.}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}, description: "Page size, default 20, maximum 50."}
        - {name: next_id, in: query, required: false, schema: {type: string}, description: "Opaque token from the previous page; omit it for the first page."}
      responses:
        "200":
          description: A page of invites.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClassInviteListResponse"}
              examples:
                ok:
                  value:
                    status: OK
                    data:
                      items:
                        - {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2H, created_at: 1760000000000, expires_at: 1761209600000, revoked_at: null, active: true}
                      next_id: ""
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/class-invite/revoke:
    post:
      operationId: revokeClassInvite
      tags: [class]
      summary: Revoke a join link (admin)
      description: >-
        Called by an admin of the class. The link stops working at once; members who already joined with it stay, and removing a member never revokes a link. Revoking a revoked link succeeds and changes nothing.
        An invite id that is not in this class (an id of another class included) is `ERROR_NOT_FOUND` and nothing changes. A member who is not an admin gets `ERROR_FORBIDDEN`; a non-member and an unknown class get `ERROR_NOT_FOUND`.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The class does not exist or the caller is not a member of it; the two cannot be told apart."}
        - {code: ERROR_FORBIDDEN, description: "The caller is a member but not an admin of this class."}
        - {code: ERROR_NOT_FOUND, description: "(Also) the invite id is not an invite of this class."}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_RATE_LIMITED, description: "More than 120 class writes by this user in an hour. Retry after `Retry-After`."}
        - {code: ERROR_UNAVAILABLE, description: "The write rate limiter in Redis did not answer, so the write fails closed. Retry after `Retry-After`."}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClassInviteRevokeRequest"}
            examples:
              example:
                value: {class_id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, id: 01K7Q8W3ZR5N2M4X6V8B0C1D2H}
      responses:
        "200":
          description: The invite is revoked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyResponse"}
              examples:
                ok:
                  value:
                    {status: OK, data: {}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/class-invite/lookup:
    post:
      operationId: lookupClassInvite
      tags: [class]
      summary: Preview a join link (public)
      description: >-
        Called by the join page (`/join/<token>`) before the visitor signs in. No session is needed and none is read. Returns only the class name and school of an **active** link. An unknown, malformed, empty, expired or revoked `token` all answer the same `ERROR_NOT_FOUND`, byte for byte, and take the same code path (one lookup by SHA-256).
        A `POST` although it only reads, and the one exception to "GET reads": the token is a bearer secret and travels in the body, never in a URL that a proxy or access log could record. Every request counts against 600 per client IP per 10 minutes (a whole class can share one school address), and a request that misses also against 20 per 10 minutes (a hit is refunded); past either limit the answer is `ERROR_RATE_LIMITED` with `Retry-After`. The limiters fail open: a 256-bit token cannot be guessed, they bound load.
        The preview does not say whether the class is full, nor how many members it has.
      x-auth: public
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The token is missing, malformed, unknown, expired or revoked; the five cannot be told apart."}
        - {code: ERROR_RATE_LIMITED, description: "Too many requests from this client IP; wait `Retry-After` seconds."}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClassInviteTokenRequest"}
            examples:
              example:
                value: {token: "Zm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyMDA"}
      responses:
        "200":
          description: The link is active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClassInvitePreviewResponse"}
              examples:
                ok:
                  value:
                    status: OK
                    data: {name: "Lớp 12A1", school_name: "THPT Chu Văn An"}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
  /api/class-invite/accept:
    post:
      operationId: acceptClassInvite
      tags: [class]
      summary: Join a class with a join link
      description: >-
        Called by the join page for a signed-in user with a verified email who accepted the Terms. Adds the caller to the class as a `student` and returns the class as `/api/class/get` does, without `page`. Idempotent: a caller who is already a member gets their membership back and **keeps their role** (an admin is never downgraded, a promoted student never demoted).
        An unknown, malformed, empty, expired or revoked `token` answers `ERROR_NOT_FOUND`, byte for byte as `lookup` does, also for a caller who is already a member. A class with 60 members refuses a new member with `ERROR_CLASS_FULL`; the cap is checked under the class lock, so ten simultaneous accepts of the last seat add exactly one member.
        Accepting is a write: it counts against the caller's 120 class writes an hour (a wrong token too, which bounds guessing per user) and against 300 accepts per client IP per hour (a whole class can share one school address). An unverified email is `ERROR_EMAIL_NOT_VERIFIED` and nothing is joined. A request with the session cookie must come from an allowed Origin.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: "The token is missing, malformed, unknown, expired or revoked; the five cannot be told apart."}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The caller's email address is not verified yet; nothing was joined.}
        - {code: ERROR_CLASS_FULL, description: The class already has 60 members.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_RATE_LIMITED, description: "More than 120 class writes by this user in an hour, or 300 accepts from this client IP. Retry after `Retry-After`."}
        - {code: ERROR_UNAVAILABLE, description: "The write rate limiter in Redis did not answer, so the write fails closed. Retry after `Retry-After`."}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClassInviteTokenRequest"}
            examples:
              example:
                value: {token: "Zm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyMDA"}
      responses:
        "200":
          description: The caller is a member of the class.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClassResponse"}
              examples:
                ok:
                  value:
                    status: OK
                    data: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, name: "Lớp 12A1", school_name: "THPT Chu Văn An", graduation_year: 2026, language: vi, my_role: student, page_linked: false, created_at: 1760000000000, updated_at: 1760000000000}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "409": {$ref: "#/components/responses/ApiConflict"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: smem_session
      description: >-
        Named `__Host-smem_session` (Secure, Path=/, no Domain) except when SMEM_ENV=dev, where it is `smem_session`.
        HttpOnly, SameSite=Lax, Path=/, Max-Age 30 days (sliding, shortened near the end so it never passes 90 days after sign-in; then 401 and sign in again), Secure except when SMEM_ENV=dev.
        State-changing requests that carry it must come from an origin in SMEM_ALLOWED_ORIGINS.
  headers:
    SessionCookie:
      description: >-
        `<name>=<32 random bytes, base64url>; Path=/; Max-Age=2592000; HttpOnly; SameSite=Lax` with name `__Host-smem_session`
        (plus `Secure`), or `smem_session` without `Secure` when SMEM_ENV=dev. `Max-Age` is 30 days at sign-in; a slide re-sends the cookie with the shorter of 30 days and the time left to the 90-day absolute ceiling (from sign-in). Only the token's SHA-256 is stored server-side.
      schema: {type: string}
  responses:
    NotFound:
      description: No route matches this path. Error code `ERROR_NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    MethodNotAllowed:
      description: Wrong HTTP method for this path. Error code `ERROR_METHOD_NOT_ALLOWED`.
      headers:
        Allow:
          description: Methods this path accepts.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ApiBadRequest:
      description: >-
        `ERROR_PARAM` (malformed body or query, unknown field, wrong type, a missing required parameter) or one of the field-level
        codes listed in the operation's `x-error-codes`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiUnauthorized:
      description: No, unknown or expired session, including one past its 90-day absolute lifetime (`ERROR_UNAUTHORIZED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiForbidden:
      description: >-
        A business code listed in the operation's `x-error-codes` (for example `ERROR_CSRF_ORIGIN_MISMATCH`, `ERROR_EMAIL_NOT_VERIFIED`, `ERROR_VERIFICATION_FAILED`). Every operation that needs the session cookie can also answer `ERROR_TERMS_REQUIRED` (403) until the user accepted the current Terms (`/api/user/accept-terms`); it is not repeated in each `x-error-codes`. Exempt: `get-me`, `accept-terms`, `logout`, `verify-email` and `resend-verification`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiNotFound:
      description: "`ERROR_NOT_FOUND`: the thing does not exist or is not the caller's; the two cannot be told apart."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiConflict:
      description: A business code listed in the operation's `x-error-codes` (`ERROR_LIMIT_REACHED`, `ERROR_COLLECTION_FULL`, `ERROR_QUOTA_EXCEEDED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiGone:
      description: The deadline of the link has passed (`ERROR_COLLECTION_CLOSED`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiRequestTimeout:
      description: The request body arrived too slowly (`ERROR_REQUEST_TIMEOUT`); nothing was stored.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiTooLarge:
      description: The body, or a photo in it, is over its cap (`ERROR_TOO_LARGE`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiUnsupportedMediaType:
      description: The Content-Type is not the one the operation takes, or a photo is not a JPEG, PNG or WebP image (`ERROR_UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiRateLimited:
      description: Too many requests (`ERROR_RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds until the oldest counted request leaves the window.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiInternal:
      description: Unexpected failure (`ERROR_INTERNAL`); nothing was kept.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiBadGateway:
      description: The object store failed (`ERROR_STORAGE_ERROR`); nothing was changed, retry later.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiBusy:
      description: The upload slots or the image-processing slots are full (`ERROR_BUSY`); retry after `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiAuthUnavailable:
      description: >-
        A Redis-backed store or the hashing pool could not serve the request, so it failed closed and nothing was accepted: `ERROR_BUSY`, `ERROR_LIMITER_UNAVAILABLE`,
        `ERROR_CODE_STORE_UNAVAILABLE` or `ERROR_SESSION_STORE_UNAVAILABLE`; or, on resend-verification only, the mail provider could not take the message
        (`ERROR_MAIL_UNAVAILABLE`). Retry after `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    ApiSessionStoreUnavailable:
      description: >-
        Redis, which holds the login sessions, did not answer (`ERROR_SESSION_STORE_UNAVAILABLE`). Sessions have no copy elsewhere, so
        the request fails closed. Retry after `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
  schemas:
    User:
      type: object
      description: The signed-in account. Fields are only ever added.
      required: [id, email, email_verified, display_name, locale, created_at, username, username_next_change_at]
      properties:
        id: {type: string, description: "The account's public id, a ULID. Always present.", examples: ["01J9Z3K6V8Q4M7N2P5R8T0W1XY"]}
        email: {type: string, description: "The normalised (trimmed, lower-cased, NFC) address. Always present."}
        email_verified: {type: boolean, description: "True once the 6-digit code was confirmed (or Google vouched for the address). Always present."}
        display_name: {type: string, description: "1-100 characters, NFC. Always present."}
        locale: {type: string, enum: [en, vi], description: "UI language and language of the emails: `en` English, `vi` Vietnamese. Always present."}
        created_at: {type: integer, format: int64, description: "When the account was created, Unix ms. Always present."}
        username: {type: string, minLength: 3, maxLength: 30, pattern: "^[a-z0-9]+([._-][a-z0-9]+)*$", description: "The public handle, lower case, unique. A generated `user-xxxxxxxx` until the user changes it. Not a login name. Always present."}
        username_next_change_at: {type: [integer, "null"], format: int64, description: "When the username may be changed again, Unix ms; `null` when a change is allowed now (never changed, or the 7-day cooldown is over). Always present."}
    Terms:
      type: object
      description: Where the signed-in user stands on the Terms of Use and Privacy Policy (D-35).
      required: [accepted_version, current_version, required]
      properties:
        accepted_version: {type: [string, "null"], description: "The version the user accepted (the date of the texts in `docs/legal`, e.g. `2026-10-21`); `null` = never accepted."}
        current_version: {type: string, description: "The version in force now."}
        required: {type: boolean, description: "True when `accepted_version` is not `current_version`: the user must call `/api/user/accept-terms` before any other signed-in endpoint works."}
    Me:
      description: The user object plus `terms`.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [terms]
          properties:
            terms: {$ref: "#/components/schemas/Terms"}
    MeResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/Me"}
    AcceptTermsRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          description: "Required. The version the user was shown; it must equal the current version, otherwise `ERROR_PARAM` (a stale page). A non-string is `ERROR_PARAM`."
          examples: ["2026-10-21"]
    UpdateUsernameRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          description: >-
            Required. Trimmed and lower-cased (`Alice` is stored as `alice`), then 3-30 characters of `a-z 0-9 . _ -`, starting and ending with a letter or digit, with no two specials in a row;
            otherwise `ERROR_INVALID_USERNAME`. Non-ASCII characters are never valid. A non-string is `ERROR_PARAM`.
          examples: [lan.nguyen]
    UserResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/User"}
    ResendVerificationResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: What the call did.
          required: [already_verified]
          properties:
            already_verified: {type: boolean, description: "True when the address was already verified and nothing was sent; false when a new code was emailed."}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name, accept_terms_version]
      properties:
        accept_terms_version:
          type: string
          description: >-
            Required. The version of the Terms of Use and Privacy Policy the sign-up form showed (the current one, `2026-10-21` at the time of writing; the web has it from the same
            constant as the texts in `docs/legal`). Missing, empty or another version is `ERROR_TERMS_REQUIRED` (HTTP 400) and nothing is created.
          examples: ["2026-10-21"]
        email:
          type: string
          maxLength: 254
          description: >-
            Required. Trimmed, lower-cased and normalised to Unicode NFC, so NFC and NFD spellings of one address are the same account (also at login). The local part (before the last `@`)
            is at most 64 bytes, and the address contains no control (Cc) or format (Cf) characters; otherwise `ERROR_INVALID_EMAIL`.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          description: >-
            Required. Normalised to Unicode NFKC before the length rules (counted in characters after normalisation) and before hashing, so NFC and NFD forms of the same password are equal.
            Must differ from the email (case-insensitive); otherwise `ERROR_WEAK_PASSWORD`.
        display_name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Required. Normalised to Unicode NFC, then trimmed; stored and returned in that form. Control characters (Cc), format characters (Cf: zero-width space, bidi overrides and isolates,
            LRM/RLM, BOM) except U+200D (zero-width joiner, used in emoji sequences), and line or paragraph separators (Zl, Zp) are rejected with `ERROR_INVALID_DISPLAY_NAME`.
        locale:
          type: [string, "null"]
          enum: [en, vi, null]
          default: en
          description: >-
            Optional. The student's UI language; it selects the language of the verification email. Absent or `null` means `en`; any other value (including another case such as `VI`,
            or a non-string) is `ERROR_INVALID_LOCALE` and nothing is created.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, maxLength: 254, description: "Required. Trimmed, lower-cased and NFC-normalised as at registration, so either Unicode spelling signs in."}
        password: {type: string, format: password, description: "Required. Normalised to Unicode NFKC before verification, exactly as at registration."}
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, pattern: "^[0-9]{6}$", description: "Required. The 6-digit code from the verification email; anything else is `ERROR_INVALID_CODE`.", examples: ["042917"]}
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, maxLength: 254, description: "Required. Trimmed, lower-cased and NFC-normalised like at login."}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, code, password]
      properties:
        email: {type: string, maxLength: 254, description: "Required. The address the reset code was sent to, normalised like at login."}
        code: {type: string, pattern: "^[0-9]{6}$", description: "Required. The 6-digit code from the reset email, valid 15 minutes.", examples: ["042917"]}
        password: {type: string, format: password, minLength: 10, maxLength: 128, description: "Required. The new password; same rules as at registration (NFKC, 10-128 characters, not the email)."}
    Profile:
      type: object
      description: The owner's profile page information of one yearbook.
      required: [id, is_owner, full_name, nickname, birthday, quote, hobbies, future_plans, photo_media_id]
      properties:
        id: {type: string, description: "Profile ULID."}
        is_owner: {type: boolean, description: "Always true: this is the profile of the book's owner."}
        full_name: {type: string, description: "The name on the profile page, 1 to 100 characters. A new book starts with the user's display name."}
        nickname: {type: string, description: "Up to 50 characters; the empty string when not set."}
        birthday: {type: [string, "null"], format: date, description: "`YYYY-MM-DD` calendar date (not an instant, so not Unix ms); null when not set."}
        quote: {type: string, description: "Up to 500 characters; the empty string when not set."}
        hobbies: {type: string, description: "Up to 300 characters; the empty string when not set."}
        future_plans: {type: string, description: "Up to 300 characters; the empty string when not set."}
        photo_media_id: {type: [string, "null"], description: "Photo ULID (a photo of this yearbook) shown on the profile page, or null."}
    Yearbook:
      type: object
      description: A yearbook with its owner profile. Carries no internal id.
      required: [id, title, school_name, class_name, graduation_year, motto, language, page_size, template_id, cover_media_id, created_at, updated_at, profile]
      properties:
        id: {type: string, description: "Yearbook ULID; use it as `id` or `yearbook_id` of the other calls."}
        title: {type: string, description: "1 to 120 characters."}
        school_name: {type: string, description: "Up to 120 characters; the empty string when not set."}
        class_name: {type: string, description: "Up to 120 characters; the empty string when not set."}
        graduation_year: {type: [integer, "null"], description: "Year from 1950 to 2100; null when not set."}
        motto: {type: string, description: "Up to 200 characters; the empty string when not set."}
        language: {type: string, enum: [en, vi], description: "Language of the book's pages: `en` English, `vi` Vietnamese."}
        page_size: {type: string, enum: [A5, A4, Letter], description: "Paper size of the printed book: `A5` (default), `A4` or `Letter`."}
        template_id: {type: [string, "null"], description: "Id of the chosen template (`GET /api/template/get-list`, for example `memory-book`); null until one is chosen, and then the built-in plain layout is used."}
        cover_media_id: {type: [string, "null"], description: "Photo ULID (a photo of this yearbook) used as the cover, or null."}
        created_at: {type: integer, format: int64, description: "Creation time, Unix ms."}
        updated_at: {type: integer, format: int64, description: "Last edit of the book or its profile, Unix ms; the list is ordered by it."}
        profile: {$ref: "#/components/schemas/Profile"}
    YearbookResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: "Always `OK` on success."}
        data: {$ref: "#/components/schemas/Yearbook"}
    YearbookListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: "Always `OK` on success."}
        data:
          type: object
          description: One page of yearbooks.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The books of this page, newest `updated_at` first; an empty array when the user has none.
              items: {$ref: "#/components/schemas/Yearbook"}
            next_id: {type: string, description: "Opaque page token for the next page; the empty string on the last page."}
    YearbookCreateRequest:
      type: object
      additionalProperties: false
      required: [title, language]
      properties:
        title: {type: string, minLength: 1, maxLength: 120, description: "Required. 1 to 120 characters after trimming."}
        school_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; default empty."}
        class_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; default empty."}
        graduation_year: {type: [integer, "null"], minimum: 1950, maximum: 2100, description: "Optional, 1950 to 2100; default null."}
        motto: {type: string, maxLength: 200, description: "Optional, up to 200 characters; default empty."}
        language: {type: string, enum: [en, vi], description: "Required. `en` English or `vi` Vietnamese."}
        page_size: {type: string, enum: [A5, A4, Letter], default: A5, description: "Optional paper size, default `A5`."}
        template_id: {type: [string, "null"], maxLength: 32, description: "Optional. Id of a template from `GET /api/template/get-list` that supports `page_size`, else `ERROR_INVALID_TEMPLATE`; default null (the plain layout)."}
    YearbookUpdateRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the yearbook to change."}
        title: {type: string, minLength: 1, maxLength: 120, description: "Optional. 1 to 120 characters after trimming; absent = unchanged."}
        school_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; the empty string clears it; absent = unchanged."}
        class_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; the empty string clears it; absent = unchanged."}
        graduation_year: {type: [integer, "null"], minimum: 1950, maximum: 2100, description: "Optional, 1950 to 2100; null clears it; absent = unchanged."}
        motto: {type: string, maxLength: 200, description: "Optional, up to 200 characters; the empty string clears it; absent = unchanged."}
        language: {type: string, enum: [en, vi], description: "Optional. `en` or `vi`; absent = unchanged."}
        page_size: {type: string, enum: [A5, A4, Letter], description: "Optional paper size; absent = unchanged."}
        cover_media_id: {type: [string, "null"], pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Optional. Photo ULID, which must be a photo of this yearbook (else `ERROR_INVALID_MEDIA`); null clears the cover; absent = unchanged."}
        template_id: {type: [string, "null"], maxLength: 32, description: "Optional. Id of a template from `GET /api/template/get-list` that supports the book's page size (after this change), else `ERROR_INVALID_TEMPLATE`; null clears it (the plain layout); absent = unchanged."}
    YearbookUpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id, full_name]
      properties:
        yearbook_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the yearbook whose profile is replaced."}
        full_name: {type: string, minLength: 1, maxLength: 100, description: "Required. 1 to 100 characters after trimming."}
        nickname: {type: string, maxLength: 50, description: "Optional, up to 50 characters; omitted = cleared."}
        birthday: {type: [string, "null"], format: date, description: "Optional `YYYY-MM-DD`, a real date strictly before today (UTC) and not before 1900-01-01; omitted or null = cleared."}
        quote: {type: string, maxLength: 500, description: "Optional, up to 500 characters; omitted = cleared."}
        hobbies: {type: string, maxLength: 300, description: "Optional, up to 300 characters; omitted = cleared."}
        future_plans: {type: string, maxLength: 300, description: "Optional, up to 300 characters; omitted = cleared."}
        photo_media_id: {type: [string, "null"], pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Optional. Photo ULID, which must be a photo of this yearbook (else `ERROR_INVALID_MEDIA`); omitted or null = cleared."}
    YearbookDeleteRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the yearbook to delete."}
    YearbookRevokePhotoLinksRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the yearbook whose public photo links are switched off."}
    Media:
      type: object
      description: A stored photo. Carries no storage key, hash or URL; the client builds the content URL from `id`.
      required: [id, yearbook_id, content_type, bytes, width, height, created_at]
      properties:
        id: {type: string, description: "Photo ULID; use it as `id` of get-content and delete."}
        yearbook_id: {type: string, description: Yearbook ULID the photo belongs to.}
        content_type: {type: string, description: "MIME type of the display version: `image/jpeg`, or `image/png` for a photo with transparency."}
        bytes: {type: integer, description: Size in bytes of the stored display version.}
        width: {type: integer, description: Width in pixels of the stored display version.}
        height: {type: integer, description: Height in pixels of the stored display version.}
        created_at: {type: integer, format: int64, description: "Upload time, Unix ms."}
    MediaResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/Media"}
    MediaListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: One page of photos.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The photos of this page, newest first.
              items: {$ref: "#/components/schemas/Media"}
            next_id: {type: string, description: "Opaque page token for the next page; the empty string on the last page."}
    MediaCreateRequest:
      type: object
      required: [yearbook_id, file]
      properties:
        yearbook_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: Required. ULID of a yearbook the caller owns (26 upper-case characters).}
        file: {type: string, format: binary, description: "Required. The image: JPEG, PNG or WebP, at most `SMEM_MEDIA_MAX_BYTES` (default 10 MiB)."}
    MediaDeleteRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: Required. ULID of the photo to delete.}
    ApiError:
      type: object
      description: >-
        The v2 error envelope (docs/api-contract.md section 2). The HTTP status is kept as well; `status` is the contract clients
        localise on.
      required: [status, error_message, request_id]
      properties:
        status:
          type: string
          description: The error code, `ERROR_` + SCREAMING_SNAKE_CASE. Never `OK` here.
          examples: [ERROR_NOT_FOUND]
        error_message:
          type: string
          description: English text for logs and support; never shown to people and never contains secrets.
        request_id:
          type: string
          description: Same value as the X-Request-Id response header; quote it to support.
    EmptyResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {type: object, description: Always an empty object., additionalProperties: false}
    NoteCollectionCreateRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id]
      properties:
        yearbook_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: Required. ULID of a yearbook the caller owns.}
        label: {type: string, maxLength: 60, description: "Optional, default empty. At most 60 characters, NFC and trimmed, no control or format characters."}
        deadline_at: {type: [integer, "null"], format: int64, description: "Optional, default null (no deadline). Unix ms; must be in the future and at most one year ahead."}
    NoteCollectionCreateResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/NoteCollectionCreated"}
    NoteCollectionCreated:
      type: object
      description: The new link, with its token.
      required: [id, label, deadline_at, created_at, token]
      properties:
        id: {type: string, description: Collection ULID.}
        label: {type: string, description: The cleaned label; an empty string when none was given.}
        deadline_at: {type: [integer, "null"], format: int64, description: "Deadline, Unix ms; null when the link has none."}
        created_at: {type: integer, format: int64, description: "Creation time, Unix ms."}
        token: {type: string, description: "The bearer secret of the link, 32 base64url characters. Shown only in this response."}
    NoteCollection:
      type: object
      description: One link as the owner's list shows it. Never contains the token.
      required: [id, label, deadline_at, created_at, revoked_at, note_count]
      properties:
        id: {type: string, description: Collection ULID.}
        label: {type: string, description: The label; an empty string when none was given.}
        deadline_at: {type: [integer, "null"], format: int64, description: "Deadline, Unix ms; null when the link has none."}
        created_at: {type: integer, format: int64, description: "Creation time, Unix ms."}
        revoked_at: {type: [integer, "null"], format: int64, description: "When the owner revoked the link, Unix ms; null while it is active."}
        note_count: {type: integer, minimum: 0, description: Number of notes of the link in any status.}
    NoteCollectionListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The page; the list is returned whole, so it is always the only page.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The links, newest first.
              items: {$ref: "#/components/schemas/NoteCollection"}
            next_id: {type: string, description: Opaque cursor; always the empty string (no more pages).}
    NoteCollectionRevokeRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: Required. ULID of a collection of one of the caller's yearbooks.}
    NoteCounts:
      type: object
      description: The notes of a whole yearbook by status.
      required: [all, pending, approved, hidden]
      properties:
        all: {type: integer, minimum: 0, description: Notes in any status (the sum of the three below).}
        pending: {type: integer, minimum: 0, description: Notes the owner has not looked at yet.}
        approved: {type: integer, minimum: 0, description: Notes that are in the book.}
        hidden: {type: integer, minimum: 0, description: Notes the owner hid.}
    NoteCountsResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The counts after the change.
          required: [counts]
          properties:
            counts: {$ref: "#/components/schemas/NoteCounts"}
    Signature:
      type: object
      description: >-
        A friend's handwritten signature as vector strokes (format v1, decision L-14). The server stores and returns only this canonical form:
        integers, no timing, pressure or device data. Draw it as an SVG path built from these numbers; never as markup or an image.
      required: [v, w, h, s]
      properties:
        v: {type: integer, const: 1, description: Format version; always 1.}
        w: {type: integer, const: 1000, description: Width of the drawing space; always 1000.}
        h: {type: integer, const: 400, description: Height of the drawing space; always 400.}
        s:
          type: array
          description: >-
            The strokes, in drawing order: 1 to 12 strokes, at most 600 points in total, at most 3072 bytes as canonical JSON. Each stroke is a flat list
            `[x0, y0, x1, y1, ...]` of at least 2 points (4 numbers, an even count); `0 <= x <= 1000`, `0 <= y <= 400`.
          minItems: 1
          maxItems: 12
          items:
            type: array
            minItems: 4
            items: {type: integer, minimum: 0, maximum: 1000}
    SignatureInfo:
      type: object
      description: What the note form needs to offer the signature pad.
      required: [enabled, w, h, max_strokes, max_points]
      properties:
        enabled: {type: boolean, description: "True when the book's template declares `signature: true`; only then does `submit-note` accept a `signature` (otherwise `ERROR_PARAM`)."}
        w: {type: integer, const: 1000, description: Width of the drawing space.}
        h: {type: integer, const: 400, description: Height of the drawing space.}
        max_strokes: {type: integer, const: 12, description: Most strokes a signature may have.}
        max_points: {type: integer, const: 600, description: Most points in all strokes together (the 3072-byte limit usually binds first).}
    NoteItem:
      type: object
      description: One note as the owner sees it.
      required: [id, status, answers, signature, photos, link_label, created_at, position]
      properties:
        id: {type: string, description: "The note's public id, a ULID."}
        status: {type: string, enum: [pending, approved, hidden], description: "`pending` not looked at yet, `approved` in the book, `hidden` kept out of it."}
        answers:
          type: object
          description: The friend's answers as stored, field id to text (`name`, `relationship`, `message`, ...; docs/note-fields.md). The display name is `answers.name`; the client shows "Anonymous" when it is missing.
          additionalProperties: {type: string}
        signature:
          description: The note's handwritten signature, or null when the friend did not sign. It follows the note's status.
          oneOf:
            - {$ref: "#/components/schemas/Signature"}
            - {type: "null"}
        photos:
          type: array
          description: The note's photos in order (at most 3). Content is read with `GET /api/media/get-content?id=`.
          items:
            type: object
            required: [id]
            properties:
              id: {type: string, description: "The photo's public id, a ULID."}
        link_label: {type: string, description: Label of the collection link the note came through; empty when the link had none.}
        created_at: {type: integer, format: int64, description: "When the friend sent the note, Unix ms."}
        position: {type: [integer, "null"], minimum: 1, description: "1-based place among the approved notes; null unless `status` is `approved`."}
    NoteListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: One page of notes and the counts of the whole yearbook.
          required: [items, next_id, counts]
          properties:
            items:
              type: array
              description: "The notes: book order for `status=approved`, newest first otherwise."
              items: {$ref: "#/components/schemas/NoteItem"}
            next_id: {type: string, description: "Opaque cursor for the next page; the empty string on the last page."}
            counts: {$ref: "#/components/schemas/NoteCounts"}
    BookDataResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The book as the renderer needs it.
          required: [yearbook, profile, notes, note_count, approved_total, truncated]
          properties:
            yearbook:
              type: object
              description: The yearbook's printed information.
              required: [title, school_name, class_name, graduation_year, motto, language, page_size, template_id, cover_media_id]
              properties:
                title: {type: string, description: The book's title.}
                school_name: {type: string, description: School name; empty when unset.}
                class_name: {type: string, description: Class name; empty when unset.}
                graduation_year: {type: [integer, "null"], description: Graduation year; null when unset.}
                motto: {type: string, description: Motto; empty when unset.}
                language: {type: string, enum: [en, vi], description: "Language of the book: `en` or `vi`."}
                page_size: {type: string, enum: [A5, A4, Letter], description: "Page size: `A5`, `A4` or `Letter`."}
                template_id: {type: [string, "null"], description: Template id; null when none was chosen (the renderer uses its default).}
                cover_media_id: {type: [string, "null"], description: Public id of the cover photo; null when there is none.}
            profile:
              type: object
              description: The owner's profile page. The birthday is not part of it.
              required: [full_name, nickname, quote, hobbies, future_plans, photo_media_id]
              properties:
                full_name: {type: string, description: Full name.}
                nickname: {type: string, description: Nickname; empty when unset.}
                quote: {type: string, description: Favourite quote; empty when unset.}
                hobbies: {type: string, description: Hobbies; empty when unset.}
                future_plans: {type: string, description: Future plans; empty when unset.}
                photo_media_id: {type: [string, "null"], description: Public id of the profile photo; null when there is none.}
            notes:
              type: array
              description: The approved notes in book order, at most 300.
              maxItems: 300
              items:
                type: object
                required: [id, answers, signature, photo_ids]
                properties:
                  id: {type: string, description: "The note's public id, a ULID."}
                  answers:
                    type: object
                    description: The friend's answers as stored, field id to text (docs/note-fields.md). Plain text; never render it as HTML.
                    additionalProperties: {type: string}
                  signature:
                    description: The note's handwritten signature, or null when the friend did not sign. Integers only.
                    oneOf:
                      - {$ref: "#/components/schemas/Signature"}
                      - {type: "null"}
                  photo_ids:
                    type: array
                    description: Public ids of the note's photos in order, at most 3; empty when it has none. Content is read with `GET /api/media/get-content?id=&variant=print`.
                    maxItems: 3
                    items: {type: string}
            note_count: {type: integer, minimum: 0, maximum: 300, description: Number of notes in `notes`.}
            approved_total: {type: integer, minimum: 0, description: "Number of approved notes the book has, also when more than 300 (then `notes` holds the first 300 in book order)."}
            truncated: {type: boolean, description: True when the book has more approved notes than the 300 returned (`approved_total` > `note_count`); the renderer shows a warning. Always present.}
    BookExportResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The book as a text document.
          required: [filename, text, note_count, photo_count, approved_total, truncated]
          properties:
            filename: {type: string, description: "Suggested file name: the title folded to lower-case ASCII words joined by `-` (at most 40 characters), `-`, the UTC date as yyyymmdd and `.txt`; `yearbook-<yyyymmdd>.txt` when nothing of the title is left. Only `[a-z0-9-.]`.", pattern: "^[a-z0-9.-]+$"}
            text: {type: string, description: "The whole document, UTF-8, `\\n` line ends, no BOM. Contains bearer photo links: treat it like a secret and never log it."}
            note_count: {type: integer, minimum: 0, maximum: 1000, description: Number of notes in the text.}
            photo_count: {type: integer, minimum: 0, description: "Number of photo links in the text (profile photo, cover photo and at most 3 per note)."}
            approved_total: {type: integer, minimum: 0, description: "Number of approved notes the book has, also when more than 1000 (then the text holds the first 1000 in book order)."}
            truncated: {type: boolean, description: True when the book has more approved notes than the text holds (`approved_total` > `note_count`); the text says so too. Always present.}
    NoteUpdateStatusRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id, ids, status]
      properties:
        yearbook_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: Required. ULID of a yearbook the caller owns.}
        ids:
          type: array
          description: "Required. 1 to 100 note ULIDs of that yearbook, no repeats. When approving, the order sets the order at the end of the book."
          minItems: 1
          maxItems: 100
          items: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        status: {type: string, enum: [pending, approved, hidden], description: "Required. The status to set: `pending`, `approved` or `hidden`."}
    NoteReorderRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id, ids]
      properties:
        yearbook_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: Required. ULID of a yearbook the caller owns.}
        ids:
          type: array
          description: "Required. Exactly the ULIDs of the notes that are approved now, in the wanted order, no repeats. At most 300; may be empty only when no note is approved."
          maxItems: 300
          items: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
    NoteDeleteRequest:
      type: object
      additionalProperties: false
      required: [yearbook_id, ids]
      properties:
        yearbook_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: Required. ULID of a yearbook the caller owns.}
        ids:
          type: array
          description: "Required. 1 to 100 note ULIDs of that yearbook, no repeats."
          minItems: 1
          maxItems: 100
          items: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
    TemplateListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: "Always `OK` on success."}
        data:
          type: object
          description: The templates, in the shape of every list.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The templates ordered by id; an empty array when none supports the requested size.
              items: {$ref: "#/components/schemas/Template"}
            next_id: {type: string, description: "Always the empty string: the list is not paginated."}
    Template:
      type: object
      description: A built-in template as the picker shows it.
      required: [id, name, page_sizes, renderer, preview]
      properties:
        id: {type: string, description: "Template id, the value of `template_id` of a yearbook (for example `memory-book`)."}
        name:
          type: object
          description: "Display name by language."
          required: [en, vi]
          properties:
            en: {type: string, description: English name.}
            vi: {type: string, description: Vietnamese name.}
        page_sizes:
          type: array
          description: The paper sizes the template supports.
          items: {type: string, enum: [A5, A4, Letter], description: "A paper size."}
        renderer: {type: string, enum: [html, go], description: "`html`: drawn by the web app (preview and print screen); `go`: the older server-side PDF renderer."}
        preview: {type: string, description: "Path on the web app's origin of a cover image, for example `/template-previews/memory-book.jpg`; the file may be missing."}
    PrintFeedbackCreateRequest:
      type: object
      additionalProperties: false
      required: [verdict, browser_family]
      properties:
        verdict: {type: string, enum: ["yes", "no"], description: "Required. `yes`: the PDF looks right; `no`: it does not."}
        browser_family:
          type: string
          enum: [chromium_desktop, safari_desktop, firefox, chrome_android, safari_ios, other]
          description: "Required. The device class the print guide was chosen for: `chromium_desktop` Chrome or Edge on a computer, `safari_desktop`, `firefox`, `chrome_android`, `safari_ios` (every browser on an iPhone or iPad), `other` anything else."
    PublicCollectGetResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/PublicCollect"}
    PublicCollect:
      type: object
      description: What a visitor with a valid link may learn.
      required: [yearbook, owner, deadline_at, open, fields, signature]
      properties:
        yearbook:
          type: object
          description: The yearbook the notes are for.
          required: [title]
          properties:
            title: {type: string, description: The yearbook's title.}
        owner:
          type: object
          description: The person who made the link.
          required: [display_name]
          properties:
            display_name: {type: string, description: The owner's display name.}
        deadline_at: {type: [integer, "null"], format: int64, description: "Deadline, Unix ms; null when the link has none."}
        open: {type: boolean, const: true, description: Always true; a closed link answers `ERROR_COLLECTION_CLOSED` instead.}
        fields:
          type: array
          description: The questions of the note form, in order.
          items: {$ref: "#/components/schemas/NoteField"}
        signature: {$ref: "#/components/schemas/SignatureInfo"}
    NoteField:
      type: object
      description: One question of the note form.
      required: [id, kind, label, hint, required, max_length]
      properties:
        id: {type: string, description: Field id; the key of the answer in `answers`., examples: [name]}
        kind: {type: string, enum: [short_text, long_text], description: "`short_text` is a single line, `long_text` may contain line breaks."}
        label: {$ref: "#/components/schemas/LocalizedText"}
        hint: {$ref: "#/components/schemas/LocalizedText"}
        required: {type: boolean, description: True when the answer must be present and not blank.}
        max_length: {type: integer, minimum: 1, description: Longest answer, in characters after normalisation.}
    LocalizedText:
      type: object
      description: A text in each supported language.
      required: [en, vi]
      properties:
        en: {type: string, description: English text.}
        vi: {type: string, description: Vietnamese text.}
    PublicCollectSubmitNoteRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: string
          description: >-
            Required. A JSON object `{"<field id>":"<text>"}` of at most 16 KiB. Keys must be fields of the form;
            required fields must be present and not blank. Send it before the first `photos` part.
          examples: ['{"name":"Linh","message":"Nhớ các bạn nhiều 🎓"}']
        photos:
          type: array
          maxItems: 3
          items: {type: string, format: binary}
          description: Optional. Up to three JPEG, PNG or WebP images (the content decides, not the name or Content-Type).
        signature:
          type: string
          description: >-
            Optional. The handwritten signature as JSON `{"v":1,"w":1000,"h":400,"s":[[x0,y0,x1,y1,...],...]}`, at most 4 KiB read (larger is `ERROR_INVALID_SIGNATURE`),
            sent once. Integers only, 1 to 12 strokes of at least 2 points, at most 600 points in all, every coordinate `0 <= x <= 1000`, `0 <= y <= 400`, at most 3072 bytes
            once the server has re-serialised it, and a bounding box at least 5 % of the width or 5 % of the height. An empty value is invalid: leave the part out to send no
            signature. Accepted only when `signature.enabled` of the lookup is true (otherwise `ERROR_PARAM`).
          examples: ['{"v":1,"w":1000,"h":400,"s":[[120,260,300,120,480,280],[500,260,880,240]]}']
        website: {type: string, description: Honeypot. Leave empty; a non-empty value makes the answer a fake success.}
    PublicCollectSubmitNoteResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: The stored note.
          required: [id]
          properties:
            id: {type: string, description: Note ULID.}
    Class:
      type: object
      description: A class as its caller sees it, with the caller's own membership. Never carries the roster.
      required: [id, name, school_name, graduation_year, language, my_role, page_linked, created_at, updated_at]
      properties:
        id: {type: string, description: Class ULID.}
        name: {type: string, description: "1 to 120 characters."}
        school_name: {type: string, description: "Up to 120 characters; empty when unset."}
        graduation_year: {type: [integer, "null"], description: "Year from 1950 to 2100; `null` when unset."}
        language: {type: string, enum: [en, vi], description: "Language of the class book: `en` English, `vi` Vietnamese."}
        my_role: {type: string, enum: [admin, student], description: "The caller's role in this class: `admin` (teacher or monitor) or `student`."}
        page_linked: {type: boolean, description: "True when the caller has chosen which of their yearbooks is their page in the class book."}
        page: {$ref: "#/components/schemas/ClassPageStatus"}
        created_at: {type: integer, format: int64, description: "When the class was created, Unix ms."}
        updated_at: {type: integer, format: int64, description: "When the class was last changed, Unix ms."}
    ClassPageStatus:
      type: object
      description: "The caller's own page in the class (T-126), as returned by `class/get` and `class-member/set-book`. Never about another member."
      required: [linked, yearbook_id, profile_complete, approved_notes]
      properties:
        linked: {type: boolean, description: "True when the caller has chosen one of their own yearbooks as their page."}
        yearbook_id: {type: [string, "null"], description: "ULID of the caller's own linked yearbook; `null` when not linked."}
        profile_complete: {type: boolean, description: "True when the owner profile of that yearbook has a name and a photo."}
        approved_notes: {type: integer, minimum: 0, description: "How many notes the owner approved in that yearbook."}
    ClassPageStatusResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/ClassPageStatus"}
    ClassSetBookRequest:
      type: object
      additionalProperties: false
      required: [class_id, yearbook_id]
      properties:
        class_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the class."}
        yearbook_id: {type: [string, "null"], pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of one of the caller's own yearbooks, or `null` to clear the link. Absent is refused so a mistake cannot unlink silently."}
    ClassResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/Class"}
    ClassListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: One page of the caller's classes.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The classes of this page, newest membership first; an empty array when the caller is in none.
              items: {$ref: "#/components/schemas/Class"}
            next_id: {type: string, description: "Opaque page token for the next page; the empty string on the last page."}
    ClassInput:
      type: object
      additionalProperties: false
      required: [name, language]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, description: "Required. 1 to 120 characters after trimming."}
        school_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; default empty."}
        graduation_year: {type: [integer, "null"], minimum: 1950, maximum: 2100, description: "Optional year from 1950 to 2100; default null."}
        language: {type: string, enum: [en, vi], description: "Required. Language of the class book: `en` English, `vi` Vietnamese."}
    ClassUpdateRequest:
      type: object
      additionalProperties: false
      required: [id, name, language]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the class."}
        name: {type: string, minLength: 1, maxLength: 120, description: "Required. 1 to 120 characters after trimming."}
        school_name: {type: string, maxLength: 120, description: "Optional, up to 120 characters; absent clears it."}
        graduation_year: {type: [integer, "null"], minimum: 1950, maximum: 2100, description: "Optional year from 1950 to 2100; absent or null clears it."}
        language: {type: string, enum: [en, vi], description: "Required. `en` English, `vi` Vietnamese."}
    ClassIdRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the class."}
    ClassLeaveRequest:
      type: object
      additionalProperties: false
      required: [class_id]
      properties:
        class_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the class to leave."}
    ClassMemberRequest:
      type: object
      additionalProperties: false
      required: [class_id, member_id]
      properties:
        class_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the class."}
        member_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the member (the `id` of a roster row, not a user id)."}
    ClassMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [class_id, member_id, role]
      properties:
        class_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the class."}
        member_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the member (the `id` of a roster row, not a user id)."}
        role: {type: string, enum: [admin, student], description: "Required. The new role: `admin` or `student`."}
    ClassMember:
      type: object
      description: One row of the roster, seen by admins only. Carries no email, user id or page content.
      required: [id, name, role, joined_at, page_linked, profile_complete, approved_notes]
      properties:
        id: {type: string, description: "Member ULID; use it as `member_id`. Not the user's id."}
        name: {type: string, description: The member's display name.}
        role: {type: string, enum: [admin, student], description: "`admin` or `student`."}
        joined_at: {type: integer, format: int64, description: "When the member joined, Unix ms."}
        page_linked: {type: boolean, description: "True when the member has chosen a class page that they own. Nothing about its content."}
        profile_complete: {type: boolean, description: "True when the owner profile of the member's page has a name and a photo. False when no page is chosen."}
        approved_notes: {type: integer, minimum: 0, description: "How many notes the member approved in their page. 0 when no page is chosen. The pending and hidden counts are never exposed."}
    ClassMemberListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: One page of the roster.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The members of this page, oldest first.
              items: {$ref: "#/components/schemas/ClassMember"}
            next_id: {type: string, description: "Opaque page token for the next page; the empty string on the last page."}
    ClassInviteCreateRequest:
      type: object
      additionalProperties: false
      required: [class_id]
      properties:
        class_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the class."}
        expires_at: {type: [integer, "null"], format: int64, description: "Optional, Unix ms: when the link stops working. Default 14 days from now; must be in the future and at most 30 days away."}
    ClassInviteRevokeRequest:
      type: object
      additionalProperties: false
      required: [class_id, id]
      properties:
        class_id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the class."}
        id: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', description: "Required. ULID of the invite (the `id` of a list row), not the token."}
    ClassInviteTokenRequest:
      type: object
      additionalProperties: false
      properties:
        token: {type: string, description: "The link token, a bearer secret of 43 base64url characters (the last part of `/join/<token>`). A missing, empty or malformed one is `ERROR_NOT_FOUND`, like an unknown one."}
    ClassInvite:
      type: object
      description: A join link as an admin sees it. Never carries the token or the link.
      required: [id, created_at, expires_at, revoked_at, active]
      properties:
        id: {type: string, description: "Invite ULID; use it as `id` to revoke. Not the token."}
        created_at: {type: integer, format: int64, description: "When the link was made, Unix ms."}
        expires_at: {type: integer, format: int64, description: "When the link stops working, Unix ms."}
        revoked_at: {type: [integer, "null"], format: int64, description: "When an admin revoked it, Unix ms; `null` while not revoked."}
        active: {type: boolean, description: "True when the link is neither revoked nor expired now. Only active links count against the cap of 5."}
    ClassInviteCreated:
      description: A new join link. The only answer that carries the token.
      allOf:
        - {$ref: "#/components/schemas/ClassInvite"}
        - type: object
          required: [token, link]
          properties:
            token: {type: string, description: "The bearer secret, 43 base64url characters. Shown once; the server keeps only its SHA-256."}
            link: {type: string, description: "`<public base URL>/join/<token>`, ready to copy. Treat it like a password: never log or store it."}
    ClassInviteCreatedResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/ClassInviteCreated"}
    ClassInviteListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data:
          type: object
          description: One page of the class's invites.
          required: [items, next_id]
          properties:
            items:
              type: array
              description: The invites of this page, newest first, revoked and expired ones included.
              items: {$ref: "#/components/schemas/ClassInvite"}
            next_id: {type: string, description: "Opaque page token for the next page; the empty string on the last page."}
    ClassInvitePreview:
      type: object
      description: All a visitor with a valid link learns about the class.
      required: [name, school_name]
      properties:
        name: {type: string, description: "The class name."}
        school_name: {type: string, description: "The school; empty when unset."}
    ClassInvitePreviewResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: string, const: OK, description: Always `OK` on success.}
        data: {$ref: "#/components/schemas/ClassInvitePreview"}
