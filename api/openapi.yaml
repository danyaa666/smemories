        - {code: ERROR_INVALID_GRADUATION_YEAR, description: "Field `graduation_year`: not a whole year from 1950 to 2100."}
        - {code: ERROR_INVALID_MOTTO, description: "Field `motto`: over 200 characters or containing control characters."}
        - {code: ERROR_INVALID_LANGUAGE, description: "Field `language`: missing on create, or not `en` or `vi`."}
        - {code: ERROR_INVALID_PAGE_SIZE, description: "Field `page_size`: not `A5`, `A4` or `Letter`."}
        - {code: ERROR_INVALID_MEDIA, description: "A cover was sent; a new book has no photos yet."}
        - {code: ERROR_LIMIT_REACHED, description: The user already owns 20 yearbooks.}
        - {code: ERROR_CSRF_ORIGIN_MISMATCH, description: The request carries the session cookie but its Origin (or Referer) is missing or not allowed.}
        - {code: ERROR_UNSUPPORTED_MEDIA_TYPE, description: A body was sent with a Content-Type other than application/json.}
        - {code: ERROR_TOO_LARGE, description: The body is over the 1 MiB cap.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
