        parameter to get the next one; it is the empty string on the last page. `next_id` is an opaque, tamper-evident token bound to the
        caller's list: a changed, truncated or foreign token (also a cursor of the old API passed as `next_id`) is `ERROR_PARAM`, and it
        never reveals an internal id. A `limit` outside 1..50 is `ERROR_PARAM`. Books created, edited or deleted between two pages never make the walk repeat
        or skip a book that stays.
