        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "413": {$ref: "#/components/responses/ApiTooLarge"}
        "415": {$ref: "#/components/responses/ApiUnsupportedMediaType"}
        "429": {$ref: "#/components/responses/ApiRateLimited"}
        "502": {$ref: "#/components/responses/ApiBadGateway"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/book-data/get:
    get:
      operationId: getBookData
      tags: [book-data]
      summary: Read the whole book for the browser renderer
      description: >-
        Called by the signed-in owner's book screens (preview and print) to draw the book from one request (decision D-24): the
        yearbook, the owner's profile and the approved notes, nothing else. Notes are in book order (the order of
        `GET /api/note/get-list?status=approved`); pending and hidden notes never appear. At most 300 notes with at most 3 photos
        each. A book with more approved notes is cut after the 300th in book order, never silently: `truncated` (always present) is true
        and `approved_total` is the real number of approved notes, while `note_count` stays the number returned. The renderer must
        show a visible warning when `truncated` is true. Each note carries `signature` (the vector strokes, or null; integers only, draw it as an SVG
        path, never as markup). The answer is about 1.62 MB (1 618 318 bytes measured, documented bound 1.6 MiB) for 300 notes with 3 photos, the longest
        answers of the built-in templates and a maximal 3070-byte signature each (about 700 KB without signatures); the API does not compress it. Media are public ids;
        the bytes come from `GET /api/media/get-content?id=&variant=print`. The answers are stored text: render them escaped,
        never as HTML. No storage key, hash, email, birthday or internal id is part of the answer. `yearbook_id` must be a
        canonical ULID (26 upper-case characters), else `ERROR_PARAM`. Needs a verified email (`ERROR_EMAIL_NOT_VERIFIED`, as the
        note list). A missing yearbook and one owned by someone else both answer `ERROR_NOT_FOUND`. Safe to repeat.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: yearbook_id, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Yearbook ULID (canonical upper case).}
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookDataResponse"}
              examples:
                book:
                  value:
                    status: OK
                    data:
                      yearbook: {title: "Lớp 12A1 - Trường THPT Chu Văn An", school_name: "THPT Chu Văn An", class_name: 12A1, graduation_year: 2026, motto: "Học, học nữa, học mãi", language: vi, page_size: A5, template_id: classic, cover_media_id: 01K7QC0B2C3D4E5F6G7H8J9K0M}
                      profile: {full_name: "Nguyễn Thị Hồng", nickname: Hồng, quote: "", hobbies: "", future_plans: "", photo_media_id: null}
                      notes:
                        - {id: 01K7QB1B2C3D4E5F6G7H8J9K0M, answers: {name: Minh Khoa, relationship: Classmate, message: Thanks for everything}, signature: {v: 1, w: 1000, h: 400, s: [[120, 260, 300, 120, 480, 280]]}, photo_ids: [01K7QC1B2C3D4E5F6G7H8J9K0M]}
                      note_count: 1
                      approved_total: 1
                      truncated: false
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "403": {$ref: "#/components/responses/ApiForbidden"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "500": {$ref: "#/components/responses/ApiInternal"}
        "503": {$ref: "#/components/responses/ApiSessionStoreUnavailable"}
  /api/book-export/get-text:
    get:
      operationId: getBookExportText
      tags: [book-export]
      summary: Read the book as one plain-text document with public photo links
      description: >-
        Called by the signed-in owner's export screen (T-094). The server builds one UTF-8 text document (`\n` line ends, no BOM, NFC) of the owner's book: the
        yearbook information, the owner profile, the approved notes in book order and, for every photo, a public link
        `<SMEM_PUBLIC_BASE_URL>/api/public-media/get-content?token=...` made with the same signer as `GET /api/public-media/get-content` (decision D-32; the
        links are bearer secrets that work without a session until the owner calls `POST /api/yearbook/revoke-photo-links` or the note is hidden). Photos
        listed: the profile photo, the cover photo and at most 3 per note. Only `approved` notes appear, in the order of `GET /api/note/get-list?status=approved`;
        pending and hidden notes and their photos never do. The fields and their order follow the book's template (the field catalogue labels, docs/note-fields.md),
        then any answered field the template no longer asks for; a book without a template uses the default fields. Fixed labels follow `lang`. No internal id,
        storage key, hash or email is in the text. At most 1000 notes: with more, the text holds the first 1000 in book order, says "1000 of N notes are included"
        (localised), `truncated` is true and `approved_total` is the real count; never a silent cut. `lang` is `en` or `vi` and defaults to the book's language,
        anything else is `ERROR_PARAM`. `yearbook_id` must be a canonical ULID (26 upper-case characters), else `ERROR_PARAM`. Needs a verified email
        (`ERROR_EMAIL_NOT_VERIFIED`). A missing yearbook and one owned by someone else both answer `ERROR_NOT_FOUND`. Limited to 30 calls per 10 minutes per user
        (`ERROR_RATE_LIMITED`, with `Retry-After`; fails open when Redis is down). Every call makes fresh links of the book's current epoch. The answer is never
        cached (it holds bearer links). Format and limits: docs/book-export.md. Safe to repeat.
      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_EMAIL_NOT_VERIFIED, description: The owner's email address is not verified yet.}
        - {code: ERROR_RATE_LIMITED, description: "More than 30 calls in 10 minutes; wait `Retry-After` seconds."}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: yearbook_id, in: query, required: true, schema: {type: string}, description: Yearbook ULID (canonical upper case).}
        - {name: lang, in: query, required: false, schema: {type: string, enum: [en, vi]}, description: "Language of the fixed labels: `en` or `vi`. Defaults to the book's language."}
      responses:
        "200":
          description: The text document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookExportResponse"}
              examples:
                text:
                  value:
                    status: OK
                    data:
                      filename: lop-12a1-20261019.txt
