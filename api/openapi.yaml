      x-auth: required
      x-error-codes:
        - {code: ERROR_NOT_FOUND, description: The yearbook does not exist or belongs to someone else; the two cannot be told apart.}
        - {code: ERROR_SESSION_STORE_UNAVAILABLE, description: "Redis, which holds the login sessions, did not answer; the request fails closed. Retry after `Retry-After`."}
      security:
        - sessionCookie: []
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}, description: Yearbook ULID.}
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearbookResponse"}
              examples:
                book:
                  value:
                    status: OK
                    data: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2E, title: "Lớp 12A1 - Trường THPT Chu Văn An", school_name: "THPT Chu Văn An", class_name: 12A1, graduation_year: 2026, motto: "Học, học nữa, học mãi", language: vi, page_size: A5, template_id: null, cover_media_id: null, created_at: 1760000000000, updated_at: 1760000000000, profile: {id: 01K7Q8W3ZR5N2M4X6V8B0C1D2F, is_owner: true, full_name: "Nguyễn Thị Hồng", nickname: "", birthday: null, quote: "", hobbies: "", future_plans: "", photo_media_id: null}}
        "400": {$ref: "#/components/responses/ApiBadRequest"}
        "401": {$ref: "#/components/responses/ApiUnauthorized"}
        "404": {$ref: "#/components/responses/ApiNotFound"}
        "500": {$ref: "#/components/responses/ApiInternal"}
