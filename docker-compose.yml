# Local development stack: MySQL 8.4 + Valkey 8 (Redis protocol) + SeaweedFS (S3). Dev-only credentials come from .env
# (copied from .env.example by `make up`). Every port binds to loopback only.
name: smemories

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs once, when the data volume is first created: lets the app user create the
      # throwaway smem_test_* databases used by integration tests.
      - ./docker/mysql/init-test-grants.sh:/docker-entrypoint-initdb.d/10-test-grants.sh:ro
    healthcheck:
      # TCP on 127.0.0.1: the entrypoint's temporary init server listens on a socket only,
      # so this turns healthy only once the real server is up.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  redis:
    # Valkey 8 (BSD): Redis-protocol compatible, so the code also runs on Redis or ElastiCache. Holds sessions, email
    # codes and rate limiters (D-23). The AOF on a named volume keeps them over a restart; noeviction makes a full
    # Redis fail writes loudly instead of silently dropping sessions. The tag is pinned by digest (multi-arch index).
    image: valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      # Without a password the server refuses connections that arrive through the published port (they look
      # non-loopback inside the container). Safe here: the port is published on 127.0.0.1 only.
      - --protected-mode
      - "no"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  s3:
    # SeaweedFS (Apache-2.0), `weed mini`: master, volume server, filer and S3 gateway in one process (T-029; it replaced the
    # frozen MinIO image). Only the S3 port is published; the single credential pair is the dev placeholder. The bucket is
    # created at startup (-bucket). Telemetry is switched off. The tag is pinned by digest (multi-arch index: amd64 and arm64);
    # keep it in step with .github/workflows/ci.yml and scripts/image-smoke.sh. Dev-only, loopback-only, holds no real data.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-master.telemetry=false", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_USER:?update .env from .env.example (the MINIO_* lines became S3_*, T-029)}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?update .env from .env.example (the MINIO_* lines became S3_*, T-029)}
      S3_BUCKET: ${S3_BUCKET:?}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

volumes:
  mysql-data:
  redis-data:
  s3-data:
